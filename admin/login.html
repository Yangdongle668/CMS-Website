<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Sign in | Acme CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div class="admin-shell admin-shell--auth">
  <div class="auth-card">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom: 24px;">
      <div class="sidebar__brand-mark">A</div>
      <strong>Acme CMS</strong>
    </div>
    <h1>Sign in</h1>
    <p>Manage products, inquiries and GDPR requests.</p>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input name="email" type="email" required autocomplete="email" autofocus/>
      </div>
      <div class="field">
        <label>Password</label>
        <input name="password" type="password" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn btn--lg" style="width:100%;">Sign in</button>
      <p class="form-status" data-status style="margin-top:14px; min-height:1em; font-size:13px;"></p>
    </form>
  </div>
</div>

<script src="/admin/assets/js/admin.js"></script>
<script>
const form = document.getElementById('login-form');
const status = form.querySelector('[data-status]');
form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  status.textContent = '';
  status.style.color = '';
  const submit = form.querySelector('[type="submit"]');
  submit.disabled = true;
  submit.textContent = 'Signing in…';
  try {
    await window.AdminAPI.api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify(data),
    });
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/admin/') ? next : '/admin/index.html';
  } catch (err) {
    status.style.color = 'var(--a-danger)';
    status.textContent = err.message === 'invalid_credentials' ? 'Email or password is incorrect.' : 'Sign-in failed.';
  } finally {
    submit.disabled = false;
    submit.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
