<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>访问统计 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
<style>
  /* ==== Analytics-only chrome ==== */
  .a-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .a-kpi { background: #fff; border: 1px solid var(--a-line); border-radius: 10px; padding: 18px 20px; }
  .a-kpi__label { font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--a-mute2); font-weight: 600; }
  .a-kpi__value { font-size: 30px; font-weight: 600; color: var(--a-text); margin-top: 6px; letter-spacing: -0.4px; line-height: 1; }
  .a-kpi__delta { font-size: 11.5px; color: var(--a-mute2); margin-top: 8px; }
  .a-kpi--accent .a-kpi__value { color: var(--a-accent); }

  .a-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 18px; }
  @media (max-width: 1100px) { .a-row { grid-template-columns: 1fr; } }
  .a-row--three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 1100px) { .a-row--three { grid-template-columns: 1fr; } }

  .a-card { background: #fff; border: 1px solid var(--a-line); border-radius: 10px; padding: 18px 20px; }
  .a-card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .a-card h3 .hint { font-weight: 400; color: var(--a-mute2); font-size: 12px; margin-left: 8px; }

  /* ==== Range tabs ==== */
  .a-ranges { display: inline-flex; gap: 0; border: 1px solid var(--a-line); border-radius: 8px; overflow: hidden; background: #fff; }
  .a-ranges button { appearance: none; background: transparent; border: none; padding: 8px 14px; font-size: 12.5px; cursor: pointer; color: var(--a-mute2); border-right: 1px solid var(--a-line); }
  .a-ranges button:last-child { border-right: none; }
  .a-ranges button.is-active { background: var(--a-accent); color: #fff; font-weight: 500; }

  /* ==== Realtime indicator ==== */
  .a-realtime {
    display: inline-flex; align-items: center; gap: 8px;
    background: #f0fdf4; color: #166534;
    padding: 4px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 500;
  }
  .a-realtime__dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

  /* ==== Bar list ==== */
  .a-bar-list { display: grid; gap: 6px; }
  .a-bar-row {
    display: grid; grid-template-columns: 1fr 60px;
    gap: 10px; align-items: center;
    padding: 6px 8px; border-radius: 4px;
    position: relative; overflow: hidden;
  }
  .a-bar-row__fill {
    position: absolute; inset: 0 auto 0 0;
    background: linear-gradient(90deg, rgba(11,58,130,0.10), rgba(11,58,130,0.20));
    border-radius: 4px;
    z-index: 0;
  }
  .a-bar-row__label, .a-bar-row__count { position: relative; z-index: 1; font-size: 12.5px; }
  .a-bar-row__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a-bar-row__count { text-align: right; color: var(--a-mute2); font-variant-numeric: tabular-nums; }
  .a-bar-row__label code { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--a-mute2); margin-left: 6px; }
  .a-bar-row a { color: var(--a-text); text-decoration: none; }
  .a-bar-row a:hover { color: var(--a-accent); }

  /* ==== Daily line chart ==== */
  .a-line-chart { width: 100%; height: 220px; }
  .a-line-chart .axis { stroke: var(--a-line); stroke-width: 1; }
  .a-line-chart .axis-label { font-size: 10px; fill: var(--a-mute2); }
  .a-line-chart .area { fill: rgba(11, 58, 130, 0.10); }
  .a-line-chart .line { fill: none; stroke: #0b3a82; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .a-line-chart .dot { fill: #0b3a82; }
  .a-line-chart .grid { stroke: #f1f5f9; stroke-width: 1; }
  .a-line-chart-tooltip {
    position: absolute; background: #0f1115; color: #fff;
    padding: 6px 10px; border-radius: 4px;
    font-size: 11.5px; pointer-events: none;
    transform: translate(-50%, -120%); display: none; white-space: nowrap;
  }

  /* ==== World hex map ==== */
  .world-hex-map path { transition: fill 0.2s ease; cursor: default; }
  .world-hex-map path:hover { fill: var(--a-accent) !important; }
  .world-hex-legend {
    display: flex; gap: 6px; align-items: center;
    margin-top: 12px; font-size: 11.5px; color: var(--a-mute2);
  }
  .world-hex-legend .lh { width: 14px; height: 14px; border-radius: 2px; }

  /* ==== Heatmap (DOW × hour) ==== */
  .a-heatmap { display: grid; grid-template-columns: 30px repeat(24, 1fr); gap: 2px; }
  .a-heatmap__hr-label { font-size: 9.5px; color: var(--a-mute2); text-align: center; }
  .a-heatmap__dow-label { font-size: 11.5px; color: var(--a-mute2); padding-right: 4px; align-self: center; }
  .a-heatmap__cell { aspect-ratio: 1; border-radius: 2px; background: #f1f5f9; }
  .a-heatmap__cell[data-h] { background: rgba(11, 58, 130, var(--h)); }

  /* ==== Empty state ==== */
  .a-empty {
    padding: 32px 20px; text-align: center; color: var(--a-mute2);
    font-size: 13px;
  }
  .a-empty strong { display: block; color: var(--a-text); font-size: 14px; margin-bottom: 6px; }
</style>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script src="/admin/assets/js/world-map.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '访问统计', crumbs: '统计' });
  if (!shell) return;

  const COUNTRY_NAMES = {
    US:'United States', CN:'China', GB:'United Kingdom', DE:'Germany', FR:'France', JP:'Japan', KR:'South Korea',
    IN:'India', RU:'Russia', BR:'Brazil', CA:'Canada', AU:'Australia', NL:'Netherlands', IT:'Italy',
    ES:'Spain', SE:'Sweden', NO:'Norway', FI:'Finland', PL:'Poland', BE:'Belgium', CH:'Switzerland',
    AT:'Austria', PT:'Portugal', IE:'Ireland', DK:'Denmark', CZ:'Czechia', GR:'Greece', RO:'Romania',
    HU:'Hungary', BG:'Bulgaria', UA:'Ukraine', TR:'Turkey', IL:'Israel', AE:'UAE', SA:'Saudi Arabia',
    EG:'Egypt', ZA:'South Africa', NG:'Nigeria', KE:'Kenya', MA:'Morocco', MX:'Mexico', AR:'Argentina',
    CL:'Chile', CO:'Colombia', VE:'Venezuela', PE:'Peru', SG:'Singapore', MY:'Malaysia', TH:'Thailand',
    VN:'Vietnam', PH:'Philippines', ID:'Indonesia', BD:'Bangladesh', PK:'Pakistan', TW:'Taiwan', HK:'Hong Kong',
    NZ:'New Zealand', IS:'Iceland', BY:'Belarus', GE:'Georgia', IR:'Iran', YE:'Yemen', ET:'Ethiopia',
    TZ:'Tanzania', MZ:'Mozambique', AO:'Angola', SD:'Sudan', DZ:'Algeria', UY:'Uruguay', CD:'DR Congo',
    KZ:'Kazakhstan', MN:'Mongolia',
  };

  let currentRange = '30d';

  shell.actions.innerHTML = `
    <div style="display:flex; gap:10px; align-items:center;">
      <span class="a-realtime"><span class="a-realtime__dot"></span><span id="rt-active">–</span> 在线</span>
      <div class="a-ranges" id="range-tabs">
        <button data-range="24h">24 小时</button>
        <button data-range="7d">7 天</button>
        <button data-range="30d" class="is-active">30 天</button>
        <button data-range="90d">90 天</button>
        <button data-range="365d">1 年</button>
      </div>
    </div>
  `;

  shell.content.innerHTML = `
    <div class="a-kpi-grid">
      <div class="a-kpi"><div class="a-kpi__label">总访问</div><div class="a-kpi__value" id="kpi-hits">–</div><div class="a-kpi__delta" id="kpi-hits-d"></div></div>
      <div class="a-kpi"><div class="a-kpi__label">独立访客</div><div class="a-kpi__value" id="kpi-vis">–</div><div class="a-kpi__delta" id="kpi-vis-d"></div></div>
      <div class="a-kpi a-kpi--accent"><div class="a-kpi__label">最热页面</div><div class="a-kpi__value" id="kpi-top-page" style="font-size:14px; font-weight:500; word-break:break-all;">–</div><div class="a-kpi__delta" id="kpi-top-page-d"></div></div>
      <div class="a-kpi"><div class="a-kpi__label">最热国家</div><div class="a-kpi__value" id="kpi-top-cc" style="font-size:18px; font-weight:500;">–</div><div class="a-kpi__delta" id="kpi-top-cc-d"></div></div>
    </div>

    <div class="a-row">
      <div class="a-card" style="position:relative;">
        <h3>访问趋势 <span class="hint" id="trend-hint">最近 30 天</span></h3>
        <svg class="a-line-chart" id="trend-chart" preserveAspectRatio="none"></svg>
        <div class="a-line-chart-tooltip" id="trend-tip"></div>
      </div>
      <div class="a-card">
        <h3>实时（最近 30 分钟）<span class="hint" id="rt-hint"></span></h3>
        <svg class="a-line-chart" id="rt-chart" preserveAspectRatio="none" style="height:140px;"></svg>
        <div style="margin-top:14px;">
          <h3 style="font-size:12px; margin:0 0 8px;">最近活跃页面（5 分钟内）</h3>
          <div class="a-bar-list" id="rt-paths"></div>
        </div>
      </div>
    </div>

    <div class="a-row a-row--three">
      <div class="a-card">
        <h3>访问最多的页面</h3>
        <div class="a-bar-list" id="top-pages"></div>
      </div>
      <div class="a-card">
        <h3>访问来源（外站 referer）</h3>
        <div class="a-bar-list" id="top-referers"></div>
      </div>
      <div class="a-card">
        <h3>浏览器 / 系统</h3>
        <div style="margin-bottom:12px;"><strong style="font-size:11.5px; color:var(--a-mute2); text-transform:uppercase; letter-spacing:1px;">Browser</strong></div>
        <div class="a-bar-list" id="top-browsers"></div>
        <div style="margin-top:14px; margin-bottom:8px;"><strong style="font-size:11.5px; color:var(--a-mute2); text-transform:uppercase; letter-spacing:1px;">OS</strong></div>
        <div class="a-bar-list" id="top-os"></div>
      </div>
    </div>

    <div class="a-row">
      <div class="a-card">
        <h3>访客地理分布 <span class="hint">悬停查看具体国家</span></h3>
        <div id="world-map"></div>
      </div>
      <div class="a-card">
        <h3>国家排行</h3>
        <div class="a-bar-list" id="top-countries"></div>
      </div>
    </div>

    <div class="a-row" style="grid-template-columns: 1fr;">
      <div class="a-card">
        <h3>访问热力图（UTC × 星期） <span class="hint">颜色越深越活跃</span></h3>
        <div id="heatmap"></div>
      </div>
    </div>
  `;

  /* ===== Range tabs ===== */
  document.querySelectorAll('#range-tabs button').forEach((b) => {
    b.addEventListener('click', () => {
      currentRange = b.dataset.range;
      document.querySelectorAll('#range-tabs button').forEach((x) => x.classList.toggle('is-active', x === b));
      document.getElementById('trend-hint').textContent = ({'24h':'最近 24 小时','7d':'最近 7 天','30d':'最近 30 天','90d':'最近 90 天','365d':'最近 1 年'})[currentRange];
      loadSummary();
    });
  });

  /* ===== Helpers ===== */
  function fmt(n) { return (n || 0).toLocaleString('en-US'); }
  function pathLabel(p) { return p === '/' ? '/ (首页)' : p; }

  function renderBars(containerId, items, getLabel, max) {
    const cap = max || items.reduce((m, x) => Math.max(m, x.hits), 1);
    const container = document.getElementById(containerId);
    if (!items.length) { container.innerHTML = '<div class="a-empty">暂无数据</div>'; return; }
    container.innerHTML = items.map((it) => {
      const w = Math.max(2, (it.hits / cap) * 100).toFixed(1);
      return `<div class="a-bar-row">
        <div class="a-bar-row__fill" style="width:${w}%"></div>
        <div class="a-bar-row__label">${getLabel(it)}</div>
        <div class="a-bar-row__count">${fmt(it.hits)}</div>
      </div>`;
    }).join('');
  }

  function lineChart(svgId, points, opts) {
    opts = opts || {};
    const svg = document.getElementById(svgId);
    if (!svg) return;
    const W = 620, H = 220, P = { l: 36, r: 10, t: 10, b: 22 };
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    if (!points || !points.length) {
      svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#94a3b8" font-size="13">暂无数据</text>`;
      return;
    }
    const max = Math.max(1, ...points.map((p) => p.value));
    const min = 0;
    const stepX = (W - P.l - P.r) / Math.max(1, points.length - 1);
    const yScale = (v) => H - P.b - ((v - min) / (max - min || 1)) * (H - P.t - P.b);

    let path = '', area = '', dots = '';
    points.forEach((pt, i) => {
      const x = P.l + i * stepX, y = yScale(pt.value);
      path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      dots += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" data-i="${i}"/>`;
    });
    area = path.replace(/^M/, '') + ` L${(P.l + (points.length - 1) * stepX).toFixed(1)},${(H - P.b).toFixed(1)} L${P.l},${(H - P.b).toFixed(1)} Z`;

    // Y-axis labels (3 lines: 0, mid, max)
    const yLabels = [0, max / 2, max].map((v) => {
      return `<text class="axis-label" x="${P.l - 6}" y="${yScale(v) + 3}" text-anchor="end">${fmt(Math.round(v))}</text>` +
             `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${yScale(v)}" y2="${yScale(v)}"/>`;
    }).join('');

    // X-axis ticks: first, middle, last
    const xLabels = [0, Math.floor(points.length / 2), points.length - 1].map((idx) => {
      const x = P.l + idx * stepX;
      return `<text class="axis-label" x="${x}" y="${H - 6}" text-anchor="middle">${escapeHtml(points[idx].label)}</text>`;
    }).join('');

    svg.innerHTML = `
      ${yLabels}
      <path class="area" d="M${area}"/>
      <path class="line" d="${path.trim()}"/>
      ${dots}
      ${xLabels}
    `;

    // Hover dot → tooltip
    const tip = document.getElementById('trend-tip');
    if (tip && opts.tooltip !== false) {
      svg.querySelectorAll('.dot').forEach((d) => {
        d.addEventListener('mouseenter', () => {
          const i = parseInt(d.dataset.i, 10);
          tip.style.display = 'block';
          const rect = svg.getBoundingClientRect();
          const cx = parseFloat(d.getAttribute('cx')) / W * rect.width + rect.left;
          const cy = parseFloat(d.getAttribute('cy')) / H * rect.height + rect.top;
          tip.style.left = cx + 'px';
          tip.style.top = (cy + window.scrollY) + 'px';
          tip.textContent = `${points[i].label}: ${fmt(points[i].value)} hits`;
        });
        d.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      });
    }
  }

  /* ===== Heatmap (DOW × hour) ===== */
  function renderHeatmap(rows) {
    const grid = document.getElementById('heatmap');
    const matrix = Array.from({ length: 7 }, () => Array(24).fill(0));
    let max = 0;
    for (const r of rows) {
      const dow = r.dow, hr = r.hour;
      if (dow >= 0 && dow < 7 && hr >= 0 && hr < 24) {
        matrix[dow][hr] = r.hits;
        if (r.hits > max) max = r.hits;
      }
    }
    const labels = ['周日','周一','周二','周三','周四','周五','周六'];
    let html = '<div class="a-heatmap">';
    html += '<div></div>';
    for (let h = 0; h < 24; h++) html += `<div class="a-heatmap__hr-label">${h % 6 === 0 ? h : ''}</div>`;
    for (let d = 0; d < 7; d++) {
      html += `<div class="a-heatmap__dow-label">${labels[d]}</div>`;
      for (let h = 0; h < 24; h++) {
        const v = matrix[d][h];
        const intensity = max > 0 && v > 0 ? Math.max(0.1, v / max) : 0;
        html += `<div class="a-heatmap__cell" ${intensity ? `data-h="1" style="--h:${intensity.toFixed(2)}"` : ''} title="${labels[d]} ${h}:00 — ${v} hits"></div>`;
      }
    }
    html += '</div>';
    grid.innerHTML = html;
  }

  /* ===== Load summary ===== */
  async function loadSummary() {
    try {
      const data = await api('/api/analytics/summary?range=' + encodeURIComponent(currentRange));

      // KPIs
      document.getElementById('kpi-hits').textContent = fmt(data.totals.hits);
      document.getElementById('kpi-vis').textContent = fmt(data.totals.visitors);
      document.getElementById('kpi-hits-d').textContent = data.daily.length ? `首条 ${data.daily[0].bucket.slice(0,10)}` : '';
      document.getElementById('kpi-vis-d').textContent = '基于 IP+UA 日 hash';
      const top = (data.top_pages && data.top_pages[0]) || null;
      document.getElementById('kpi-top-page').textContent = top ? pathLabel(top.path) : '–';
      document.getElementById('kpi-top-page-d').textContent = top ? `${fmt(top.hits)} 次访问` : '';
      const topCC = (data.top_countries && data.top_countries[0]) || null;
      document.getElementById('kpi-top-cc').textContent = topCC ? (COUNTRY_NAMES[topCC.country] || topCC.country) : '–';
      document.getElementById('kpi-top-cc-d').textContent = topCC ? `${fmt(topCC.hits)} 次` : '';

      // Trend chart
      const fmtBucket = (b) => {
        const d = new Date(b);
        if (currentRange === '24h') return d.getUTCHours() + ':00';
        if (currentRange === '365d') return (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
        return (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
      };
      lineChart('trend-chart', data.daily.map((d) => ({ label: fmtBucket(d.bucket), value: d.hits })));

      // Top lists
      renderBars('top-pages', data.top_pages.slice(0, 12), (it) => `<a href="${escapeHtml(it.path)}" target="_blank">${escapeHtml(pathLabel(it.path))}</a>`);
      renderBars('top-referers', data.top_referers.slice(0, 12), (it) => `<a href="https://${escapeHtml(it.referer_host)}" target="_blank">${escapeHtml(it.referer_host)}</a>`);
      renderBars('top-browsers', data.top_browsers.slice(0, 6), (it) => escapeHtml(it.browser));
      renderBars('top-os', data.top_os.slice(0, 6), (it) => escapeHtml(it.os));

      // Countries list + world map
      renderBars(
        'top-countries',
        data.top_countries.slice(0, 20),
        (it) => `${flagEmoji(it.country)} <span style="margin-left:6px;">${escapeHtml(COUNTRY_NAMES[it.country] || it.country)}</span> <code>${escapeHtml(it.country)}</code>`
      );
      const ccData = {};
      for (const r of data.top_countries) ccData[r.country] = r.hits;
      window.WorldHexMap.render('world-map', ccData);

      renderHeatmap(data.heatmap || []);
    } catch (err) {
      toast('加载失败：' + err.message, 'error');
    }
  }

  function flagEmoji(cc) {
    if (!cc || cc.length !== 2 || cc === 'XX') return '🌐';
    const A = 0x1F1E6;
    const a = cc.charCodeAt(0) - 65;
    const b = cc.charCodeAt(1) - 65;
    if (a < 0 || a > 25 || b < 0 || b > 25) return '🌐';
    return String.fromCodePoint(A + a, A + b);
  }

  /* ===== Realtime polling ===== */
  async function pollRealtime() {
    try {
      const r = await api('/api/analytics/realtime');
      document.getElementById('rt-active').textContent = r.active;
      document.getElementById('rt-hint').textContent = `每分钟一格，向右最新`;
      const points = (r.per_minute || []).map((m) => ({
        label: new Date(m.bucket).toISOString().slice(11, 16),
        value: m.hits,
      }));
      // Pad to 30 minutes width even if early in the period.
      lineChart('rt-chart', points.length ? points : [{label:'', value:0}], { tooltip: false });

      const paths = (r.recent_paths || []);
      const cap = Math.max(1, ...paths.map((x) => x.hits));
      document.getElementById('rt-paths').innerHTML = paths.length
        ? paths.map((p) => {
            const w = ((p.hits / cap) * 100).toFixed(0);
            return `<div class="a-bar-row"><div class="a-bar-row__fill" style="width:${w}%"></div><div class="a-bar-row__label"><a href="${escapeHtml(p.path)}" target="_blank">${escapeHtml(pathLabel(p.path))}</a></div><div class="a-bar-row__count">${fmt(p.hits)}</div></div>`;
          }).join('')
        : '<div class="a-empty">暂无活跃访客</div>';
    } catch (_) { /* silent — keep last known state */ }
  }

  loadSummary();
  pollRealtime();
  setInterval(pollRealtime, 15 * 1000);
})();
</script>
</body>
</html>
