<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>产品 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script src="/admin/assets/js/seo-panel.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '产品', crumbs: '内容 / 产品' });
  if (!shell) return;
  shell.actions.innerHTML = `<button class="btn btn--sm" id="new">+ 新建产品</button>`;

  const pillars = (await api('/api/pillars?status=all')).items;
  const wantId = new URLSearchParams(location.search).get('id');

  async function refresh() {
    const { items } = await api('/api/products/admin/list');
    shell.content.innerHTML = `
      <div class="panel" id="list-panel">
        <table class="table">
          <thead><tr><th>名称</th><th>Slug</th><th>支柱</th><th>定制</th><th>状态</th><th></th></tr></thead>
          <tbody>
            ${items.length ? items.map((p) => `
              <tr>
                <td><strong>${escapeHtml(p.name)}</strong><div style="font-size:11.5px; color:var(--a-mute2);">${escapeHtml(p.model_no || '')}</div></td>
                <td><span class="mono">${escapeHtml(p.slug)}</span></td>
                <td>${escapeHtml(p.pillar_slug || '-')}</td>
                <td>${p.is_custom ? '<span class="pill pill--verified">定制</span>' : '<span class="pill pill--read">标准</span>'}</td>
                <td><span class="pill pill--${p.status}">${p.status}</span></td>
                <td><a class="btn btn--ghost btn--sm" href="?id=${p.id}">编辑</a></td>
              </tr>
            `).join('') : '<tr><td colspan="6"><div class="empty">还没有产品。</div></td></tr>'}
          </tbody>
        </table>
      </div>
      <div id="edit-panel"></div>
    `;
    if (wantId) {
      const p = items.find((x) => String(x.id) === wantId);
      if (p) renderEditor(p);
    }
  }

  function renderEditor(p) {
    p = p || { specs: {}, features: [], gallery: [], status: 'published', sort_order: 0 };
    const isNew = !p.id;
    document.getElementById('list-panel').style.display = 'none';
    const panel = document.getElementById('edit-panel');
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>${isNew ? '新建产品' : '编辑：' + escapeHtml(p.name)}</h2>
          <div style="display:flex; gap:8px;">
            ${!isNew ? `<a target="_blank" class="btn btn--ghost btn--sm" href="/products/${escapeHtml(p.slug)}">预览 ↗</a>` : ''}
            <a href="/admin/products.html" class="btn btn--ghost btn--sm">返回</a>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>名称</label><input id="f-name" value="${escapeHtml(p.name || '')}"/></div>
          <div class="field"><label>型号</label><input id="f-model" value="${escapeHtml(p.model_no || '')}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Slug</label><input id="f-slug" value="${escapeHtml(p.slug || '')}" ${isNew ? '' : 'readonly'}/></div>
          <div class="field"><label>Pillar</label>
            <select id="f-pillar">
              <option value="">— 不绑定支柱 —</option>
              ${pillars.map((x) => `<option value="${x.id}" ${x.id === p.pillar_id ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field"><label>标语</label><input id="f-tagline" value="${escapeHtml(p.tagline || '')}"/></div>
        <div class="field"><label>封面图 URL</label><input id="f-cover" value="${escapeHtml(p.cover_url || '')}"/></div>
        <div class="field"><label>Datasheet URL</label><input id="f-datasheet" value="${escapeHtml(p.datasheet_url || '')}"/></div>
        <div class="field"><label>描述</label><textarea id="f-desc" rows="5">${escapeHtml(p.description || '')}</textarea></div>
        <div class="field"><label>规格 JSON <span class="hint">（key/value 对象）</span></label><textarea id="f-specs" rows="6" class="mono">${escapeHtml(JSON.stringify(p.specs || {}, null, 2))}</textarea></div>
        <div class="field"><label>特性 <span class="hint">（每行一个）</span></label><textarea id="f-features" rows="5">${escapeHtml((p.features || []).join('\n'))}</textarea></div>
        <div class="field-row">
          <div class="field"><label>排序</label><input id="f-sort" type="number" value="${p.sort_order || 0}"/></div>
          <div class="field"><label>状态</label><select id="f-status"><option value="published" ${p.status === 'published' ? 'selected' : ''}>已发布</option><option value="draft" ${p.status === 'draft' ? 'selected' : ''}>草稿</option></select></div>
        </div>
        <div class="field field--check"><input type="checkbox" id="f-custom" ${p.is_custom ? 'checked' : ''}/><label for="f-custom">定制类产品（区别于标准目录）</label></div>

        <div class="field-row">
          <div class="field"><label>Meta 标题</label><input id="f-mt" value="${escapeHtml(p.meta_title || '')}"/></div>
          <div class="field"><label>Meta 描述</label><textarea id="f-md" rows="2">${escapeHtml(p.meta_description || '')}</textarea></div>
        </div>

        <div id="f-seo-mount"></div>

        <div class="form-actions">
          <button class="btn" id="save">保存</button>
          ${!isNew ? '<button class="btn btn--danger" id="delete">删除</button>' : ''}
          <a href="/admin/products.html" class="btn btn--ghost">取消</a>
        </div>
      </div>
    `;

    let seoPanel = null;
    try {
      seoPanel = window.SEOPanel.mount('f-seo-mount', {
        entity: 'product',
        siteHost: location.host,
        initial: p,
        getContext: () => ({
          title: (panel.querySelector('#f-mt') || {}).value
                 || (panel.querySelector('#f-name') || {}).value || '',
          description: (panel.querySelector('#f-md') || {}).value
                       || (panel.querySelector('#f-tagline') || {}).value || '',
          slug: 'products/' + ((panel.querySelector('#f-slug') || {}).value || ''),
          body: (panel.querySelector('#f-desc') || {}).value || '',
          coverUrl: (panel.querySelector('#f-cover') || {}).value || '',
        }),
      });
    } catch (err) {
      const host = document.getElementById('f-seo-mount');
      if (host) host.innerHTML = '<p style="color:var(--a-mute2); font-size:12px;">SEO 面板加载失败：' + escapeHtml(err.message) + '</p>';
    }
    panel.addEventListener('input', () => seoPanel && seoPanel.repaint());

    panel.querySelector('#save').addEventListener('click', async () => {
      let specs;
      try { specs = JSON.parse(panel.querySelector('#f-specs').value); }
      catch (_) { return toast('规格 JSON 格式错误', 'error'); }
      const seoVals = seoPanel ? seoPanel.getValues() : {};
      const payload = Object.assign({
        slug: panel.querySelector('#f-slug').value,
        name: panel.querySelector('#f-name').value,
        model_no: panel.querySelector('#f-model').value,
        pillar_id: panel.querySelector('#f-pillar').value || null,
        tagline: panel.querySelector('#f-tagline').value,
        cover_url: panel.querySelector('#f-cover').value,
        datasheet_url: panel.querySelector('#f-datasheet').value,
        description: panel.querySelector('#f-desc').value,
        specs,
        features: panel.querySelector('#f-features').value.split('\n').map((s) => s.trim()).filter(Boolean),
        sort_order: parseInt(panel.querySelector('#f-sort').value, 10) || 0,
        status: panel.querySelector('#f-status').value,
        is_custom: panel.querySelector('#f-custom').checked,
        meta_title: (panel.querySelector('#f-mt') || {}).value || '',
        meta_description: (panel.querySelector('#f-md') || {}).value || '',
      }, seoVals);
      try {
        if (isNew) await api('/api/products', { method: 'POST', body: JSON.stringify(payload) });
        else await api('/api/products/' + p.id, { method: 'PUT', body: JSON.stringify(payload) });
        toast('已保存', 'success');
        setTimeout(() => location.href = '/admin/products.html', 500);
      } catch (err) { toast('保存失败: ' + err.message, 'error'); }
    });
    if (!isNew) {
      panel.querySelector('#delete').addEventListener('click', async () => {
        if (!confirm('确认删除这个产品？')) return;
        await api('/api/products/' + p.id, { method: 'DELETE' });
        toast('已删除', 'success');
        setTimeout(() => location.href = '/admin/products.html', 500);
      });
    }
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'new') renderEditor();
  });
  refresh();
})();
</script>
</body>
</html>
