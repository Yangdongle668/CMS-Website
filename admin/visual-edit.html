<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>可视化编辑 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
<style>
  /* Take over the whole viewport — no admin sidebar, no padding. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f3f4f6; font-family: Inter, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 56px 1fr; }

  .ve-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    background: #0b1220; color: #fff;
    border-bottom: 1px solid #1f2937;
    font-size: 13px;
  }
  .ve-bar__brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; letter-spacing: 0.02em;
  }
  .ve-bar__brand-logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, #2563eb, #0b3a82);
    color: #fff; font-weight: 800;
    display: grid; place-items: center;
  }
  .ve-bar__title {
    font-size: 12.5px; color: #94a3b8;
    border-left: 1px solid #1f2937; padding-left: 14px;
    flex: 1; min-width: 0;
    text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
  }
  .ve-bar__title strong { color: #fff; font-weight: 600; }
  .ve-bar__url {
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11.5px; color: #cbd5e1;
    background: #111827; padding: 5px 10px; border-radius: 4px;
    max-width: 360px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
  }
  .ve-bar__actions { display: flex; gap: 8px; align-items: center; }
  .ve-btn {
    background: #1f2937; color: #fff;
    border: 1px solid #374151;
    padding: 6px 14px; border-radius: 6px;
    font-size: 12.5px; font-weight: 500;
    cursor: pointer; line-height: 1.4;
    text-decoration: none;
    transition: background 0.12s ease;
  }
  .ve-btn:hover { background: #2d3a52; }
  .ve-btn--accent { background: #2563eb; border-color: #2563eb; }
  .ve-btn--accent:hover { background: #1d4ed8; }
  .ve-btn--ghost { background: transparent; }
  .ve-btn--ghost:hover { background: rgba(255,255,255,0.08); }

  /* Tabs in the toolbar to switch between iframe view modes */
  .ve-tabs { display: flex; gap: 4px; }
  .ve-tab {
    background: transparent; color: #9ca3af; border: 0;
    font-size: 12px; font-weight: 500;
    padding: 6px 10px; cursor: pointer; border-radius: 4px;
  }
  .ve-tab:hover { color: #fff; }
  .ve-tab.is-active { background: #1f2937; color: #fff; }

  /* The viewport */
  .ve-stage {
    position: relative;
    overflow: hidden;
    background: #f3f4f6;
    display: grid;
    grid-template-columns: 1fr 320px;
  }
  .ve-stage--no-sidebar { grid-template-columns: 1fr; }
  .ve-frame-wrap {
    overflow: auto;
    padding: 18px;
    display: grid;
    place-items: start center;
  }
  .ve-frame {
    width: 100%;
    height: calc(100vh - 56px - 36px);
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 4px 22px rgba(0,0,0,0.06);
    transition: max-width 0.25s ease;
  }
  .ve-frame--mobile  { max-width: 390px; height: 844px; }
  .ve-frame--tablet  { max-width: 820px; height: 1120px; }
  .ve-frame--desktop { max-width: none; }

  /* Side rail with image grid + tips */
  .ve-side {
    background: #fff;
    border-left: 1px solid #e5e7eb;
    overflow-y: auto;
    padding: 18px;
  }
  .ve-side h3 {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b7280;
    font-weight: 700;
  }
  .ve-side p.ve-help {
    margin: 0 0 16px;
    color: #6b7280; font-size: 12.5px; line-height: 1.55;
  }
  .ve-side__count {
    color: #6b7280; font-weight: 500; text-transform: none; letter-spacing: 0;
  }
  .ve-tip-card {
    border: 1px dashed #cbd5e1;
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px 14px;
    color: #334155;
    font-size: 12.5px;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .ve-tip-card strong { color: #0f172a; }

  /* Image grid (re-uses preview-img-card from admin.css when possible) */
  .ve-img-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
</style>
</head>
<body>

<header class="ve-bar">
  <div class="ve-bar__brand">
    <span class="ve-bar__brand-logo">Z</span>
    <span>可视化编辑</span>
  </div>
  <div class="ve-bar__title">
    <span id="ve-name">加载中…</span>
  </div>
  <span class="ve-bar__url" id="ve-url">—</span>

  <div class="ve-tabs" role="tablist" aria-label="预览设备宽度">
    <button class="ve-tab is-active" data-device="desktop" type="button">桌面</button>
    <button class="ve-tab" data-device="tablet" type="button">平板</button>
    <button class="ve-tab" data-device="mobile" type="button">手机</button>
  </div>

  <div class="ve-bar__actions">
    <button class="ve-btn ve-btn--ghost" id="ve-toggle-side" type="button">隐藏右栏</button>
    <button class="ve-btn ve-btn--ghost" id="ve-reload" type="button">↻ 刷新</button>
    <a class="ve-btn ve-btn--ghost" id="ve-back" href="/admin/pages.html">← 返回表单</a>
    <a class="ve-btn ve-btn--accent" id="ve-open" href="#" target="_blank">在新窗口打开 ↗</a>
  </div>
</header>

<main class="ve-stage" id="ve-stage">
  <div class="ve-frame-wrap">
    <iframe class="ve-frame ve-frame--desktop" id="ve-frame" src="about:blank" title="可视化编辑预览"></iframe>
  </div>
  <aside class="ve-side" id="ve-side">
    <div class="ve-tip-card">
      <strong>这里怎么编辑？</strong><br>
      • 点页面里任意 <strong>图片</strong> → 直接上传替换。<br>
      • 点页面里任意 <strong>文字</strong> → 弹窗修改文字，保存即时生效。<br>
      • 同一段文字出现在多个页面会一起变（因为是站点级文字替换）。<br>
      • 改完关掉本页，返回表单调结构化字段或 SEO。
    </div>

    <h3>本页图片 <span class="ve-side__count" id="ve-img-count">扫描中…</span></h3>
    <p class="ve-help">点缩略图直接上传新图。已替换过的图边框会变绿。</p>
    <div class="ve-img-grid" id="ve-img-grid"></div>
  </aside>
</main>

<script src="/admin/assets/js/admin.js"></script>
<script src="/admin/assets/js/iframe-text-editor.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;

  // bootShell guards against unauthenticated access. We don't actually
  // render the shell here (we have our own toolbar), but reusing the
  // auth check keeps behavior consistent with every other admin page.
  // Fail-open: if it can't render the shell, redirect to login.
  let me;
  try { me = await fetch('/api/auth/me', { credentials: 'include' }).then((r) => r.json()); }
  catch (_) { me = null; }
  if (!me || !me.user) {
    location.href = '/admin/login.html?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }

  // ----- Parse target URL + back-link from query params -----
  const params = new URLSearchParams(location.search);
  const target = params.get('url') || '/';
  const back = params.get('back') || '/admin/pages.html';

  const frame = document.getElementById('ve-frame');
  const sideEl = document.getElementById('ve-side');
  const stageEl = document.getElementById('ve-stage');
  const urlEl = document.getElementById('ve-url');
  const nameEl = document.getElementById('ve-name');
  const grid = document.getElementById('ve-img-grid');
  const counter = document.getElementById('ve-img-count');

  urlEl.textContent = target;
  nameEl.innerHTML = '正在编辑：<strong>' + escapeHtml(target) + '</strong>';
  document.getElementById('ve-back').href = back;
  document.getElementById('ve-open').href = target;
  frame.src = target;

  // ----- Toolbar wiring -----
  document.querySelectorAll('.ve-tab').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.ve-tab').forEach((x) => x.classList.toggle('is-active', x === b));
      frame.classList.remove('ve-frame--desktop','ve-frame--tablet','ve-frame--mobile');
      frame.classList.add('ve-frame--' + b.dataset.device);
    });
  });
  document.getElementById('ve-reload').addEventListener('click', () => {
    try { frame.contentWindow.location.reload(); }
    catch (_) { frame.src = frame.src; }
  });
  let sideHidden = false;
  document.getElementById('ve-toggle-side').addEventListener('click', (ev) => {
    sideHidden = !sideHidden;
    stageEl.classList.toggle('ve-stage--no-sidebar', sideHidden);
    sideEl.style.display = sideHidden ? 'none' : '';
    ev.target.textContent = sideHidden ? '显示右栏' : '隐藏右栏';
  });

  // ----- Wire iframe-text-editor + image grid on every (re)load -----
  frame.addEventListener('load', async () => {
    let doc = null;
    try { doc = frame.contentDocument; } catch (_) {}
    if (!doc) {
      grid.innerHTML = '<p style="color:#6b7280; font-size:12px;">无法读取预览（同源问题）。请确认管理面板与前台站点在同一域名下。</p>';
      counter.textContent = '0 张';
      return;
    }

    // Inline text editor — turns every clickable paragraph/heading into
    // an editable target. The handler PATCHes /api/text-overrides on save.
    let overrides = {};
    try {
      const r = await fetch('/api/text-overrides', { credentials: 'include' });
      if (r.ok) overrides = (await r.json()).overrides || {};
    } catch (_) {}
    try {
      window.IframeTextEditor.enable(frame, {
        overrides,
        onSave: () => { /* iframe reload handled inside the editor */ },
      });
    } catch (_) {}

    // Scan for replaceable images (both <img src> and CSS background-image).
    await scanIframeImages(doc);
  });

  async function scanIframeImages(doc) {
    const found = new Map();
    function add(url) {
      if (!url) return;
      if (/^(data:|blob:)/i.test(url)) return;
      if (/\.(css|js|woff2?|ttf|otf)(\?|$)/i.test(url)) return;
      const isExternal = /^https?:\/\//.test(url);
      const isImg = /\.(png|jpe?g|gif|webp|avif|svg)(\?|$)/i.test(url)
        || /images\.unsplash\.com|cloudfront\.net|imgix\.net|cdn\./i.test(url);
      if (!isImg) return;
      if (found.has(url)) found.get(url).count++;
      else found.set(url, { count: 1, isExternal });
    }
    doc.querySelectorAll('img[src]').forEach((el) => add(el.getAttribute('src')));
    doc.querySelectorAll('[style*="background-image"]').forEach((el) => {
      const m = (el.getAttribute('style') || '').match(/background-image\s*:\s*url\(\s*['"]?([^'")]+)['"]?\s*\)/i);
      if (m) add(m[1]);
    });

    let overrideMap = {};
    try { const r = await api('/api/media/overrides'); overrideMap = r.overrides || {}; }
    catch (_) {}
    const reverseMap = {};
    for (const [src, dst] of Object.entries(overrideMap)) {
      if (!reverseMap[dst]) reverseMap[dst] = [];
      reverseMap[dst].push(src);
    }
    const items = Array.from(found.entries()).map(([url, meta]) => ({
      renderedUrl: url,
      sourceUrl: (reverseMap[url] && reverseMap[url][0]) || null,
      count: meta.count,
      isExternal: meta.isExternal,
      isMapped: !!(reverseMap[url] && reverseMap[url][0]),
    }));
    counter.textContent = items.length + ' 张';
    if (!items.length) {
      grid.innerHTML = '<p style="color:#6b7280; font-size:12px;">本页没有可替换的图片。</p>';
      return;
    }
    // Every image is replaceable now — external URLs map via the
    // override table just like internal ones (e.g. /assets/img/seed/*
    // becomes a key in settings.media_overrides pointing to /uploads/*).
    grid.innerHTML = items.map((it) => {
      return '<div class="preview-img-card' + (it.isMapped ? ' is-mapped' : '') + '"' +
        ' data-rendered="' + escapeHtml(it.renderedUrl) + '"' +
        ' data-source="' + escapeHtml(it.sourceUrl || it.renderedUrl) + '"' +
        ' title="' + escapeHtml(it.renderedUrl) + '">' +
        '<img src="' + escapeHtml(it.renderedUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'"/>' +
        '<div class="preview-img-card__overlay">📤 点击替换</div>' +
        (it.isMapped ? '<span class="preview-img-card__badge">已替换</span>' : '') +
        '</div>';
    }).join('');
    grid.querySelectorAll('.preview-img-card').forEach((card) => {
      card.addEventListener('click', () => onPickImage(card));
    });
  }

  // Chooser modal: lets the operator either upload a new image OR pick
  // an existing one from the media library (uploads + seed images).
  function openReplaceChooser(sourceUrl) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(15,23,42,0.55); display:flex; align-items:center; justify-content:center; z-index:99999;';
      overlay.innerHTML = `
        <div style="background:#fff; border-radius:12px; max-width:920px; width:92%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,0.25);">
          <div style="padding:18px 22px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; justify-content:space-between;">
            <h3 style="margin:0; font-size:16px;">替换图片</h3>
            <button type="button" data-close style="background:none; border:none; font-size:24px; cursor:pointer; color:#64748b;">&times;</button>
          </div>
          <div style="padding:14px 22px; border-bottom:1px solid #e5e7eb; display:flex; gap:8px;">
            <button type="button" class="btn btn--primary btn--sm" data-action="upload">📤 上传新图</button>
            <span style="color:#64748b; font-size:12px; align-self:center;">或从下方媒体库中选择已有图片</span>
          </div>
          <div data-library style="flex:1; overflow:auto; padding:14px 22px;">
            <div style="text-align:center; color:#64748b; font-size:13px; padding:24px;">加载中…</div>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = (val) => { overlay.remove(); resolve(val); };
      overlay.querySelector('[data-close]').addEventListener('click', () => close(null));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
      overlay.querySelector('[data-action="upload"]').addEventListener('click', () => {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
        document.body.appendChild(inp);
        inp.addEventListener('change', async () => {
          const file = inp.files && inp.files[0];
          inp.remove();
          if (!file) return;
          try {
            const fd = new FormData();
            fd.append('file', file);
            fd.append('alt_text', file.name.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' '));
            const up = await fetch('/api/media', { method: 'POST', credentials: 'include', body: fd });
            const upJson = await up.json();
            if (!up.ok || !upJson.url) throw new Error(upJson.error || ('HTTP ' + up.status));
            close(upJson.url);
          } catch (err) {
            toast('上传失败：' + err.message, 'error');
          }
        });
        inp.click();
      });
      // Populate library asynchronously.
      (async () => {
        const lib = overlay.querySelector('[data-library]');
        try {
          const res = await fetch('/api/media?limit=500&include_seed=1', { credentials: 'include' });
          const json = await res.json();
          const items = (json.items || []).filter((m) => /^image\//i.test(m.mime || '')).filter((m) => m.url !== sourceUrl);
          if (!items.length) {
            lib.innerHTML = '<div style="text-align:center; color:#64748b; font-size:13px; padding:24px;">媒体库还没有图片，请上传。</div>';
            return;
          }
          const seedItems = items.filter((m) => m.source === 'seed');
          const uploadItems = items.filter((m) => m.source !== 'seed');
          function cardHtml(m) {
            return '<button type="button" data-pick="' + escapeHtml(m.url) + '" title="' + escapeHtml(m.original || m.filename) + '" ' +
              'style="border:1px solid #e5e7eb; background:#fff; border-radius:8px; padding:0; overflow:hidden; cursor:pointer; display:flex; flex-direction:column;">' +
              '<img src="' + escapeHtml(m.url) + '" alt="" loading="lazy" style="width:100%; aspect-ratio:1; object-fit:cover; background:#f8fafc;"/>' +
              '<span style="padding:6px 8px; font-size:11px; color:#475569; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + escapeHtml((m.original || m.filename).slice(0, 28)) + '</span>' +
              '</button>';
          }
          function section(title, arr) {
            if (!arr.length) return '';
            return '<div style="margin-bottom:18px;">' +
              '<div style="font-size:12px; color:#64748b; margin-bottom:8px; font-weight:600;">' + escapeHtml(title) + ' · ' + arr.length + ' 张</div>' +
              '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px;">' +
              arr.map(cardHtml).join('') + '</div></div>';
          }
          lib.innerHTML = section('我的上传', uploadItems) + section('内置图库（seed）', seedItems);
          lib.querySelectorAll('[data-pick]').forEach((b) => {
            b.addEventListener('click', () => close(b.dataset.pick));
          });
        } catch (err) {
          lib.innerHTML = '<div style="color:#dc2626; font-size:13px; padding:16px;">加载媒体库失败：' + escapeHtml(err.message) + '</div>';
        }
      })();
    });
  }

  async function onPickImage(card) {
    const sourceUrl = card.dataset.source;
    const newUrl = await openReplaceChooser(sourceUrl);
    if (!newUrl) return;
    try {
      const cur = await api('/api/media/overrides');
      const map = Object.assign({}, cur.overrides || {});
      if (newUrl === sourceUrl) {
        delete map[sourceUrl];
      } else {
        map[sourceUrl] = newUrl;
      }
      await api('/api/media/overrides', { method: 'PUT', body: JSON.stringify({ overrides: map }) });
      toast('已替换该图片，刷新预览…', 'success');
      try { frame.contentWindow.location.reload(); } catch (_) {}
    } catch (err) { toast('替换失败：' + err.message, 'error'); }
  }
})();
</script>
</body>
</html>
