<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>作者档案 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '作者档案', crumbs: '内容 / 作者' });
  if (!shell) return;

  const wantId = new URLSearchParams(location.search).get('id');
  const isNew = new URLSearchParams(location.search).get('new') === '1';

  async function loadList() {
    const { items } = await api('/api/authors?all=1');
    return items;
  }

  function renderList(items) {
    shell.content.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>作者档案</h2>
          <div style="display:flex; gap:8px; align-items:center;">
            <p class="muted" style="font-size:12.5px; margin:0; color:var(--a-mute2);">每位作者会渲染为 Person 结构化数据并出现在文章页面，是 E-E-A-T 信任信号的核心。</p>
            <a class="btn btn--primary btn--sm" href="?new=1">+ 新建作者</a>
          </div>
        </div>
        <table class="table">
          <thead><tr><th>姓名</th><th>职位</th><th>Slug</th><th>关联文章数</th><th>状态</th><th></th></tr></thead>
          <tbody>
            ${items.length ? items.map((a) => `
              <tr>
                <td>
                  <div style="display:flex; gap:10px; align-items:center;">
                    ${a.avatar_url ? `<img src="${escapeHtml(a.avatar_url)}" alt="" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">` : `<div style="width:32px; height:32px; border-radius:50%; background:#0b3a82; color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600;">${escapeHtml((a.name || '?').charAt(0))}</div>`}
                    <strong>${escapeHtml(a.name)}</strong>
                  </div>
                </td>
                <td>${escapeHtml(a.job_title || '-')}</td>
                <td><span class="mono">${escapeHtml(a.slug)}</span></td>
                <td>${a.article_count != null ? a.article_count : '-'}</td>
                <td><span class="pill pill--${a.is_active ? 'published' : 'draft'}">${a.is_active ? '激活' : '已停用'}</span></td>
                <td><a class="btn btn--ghost btn--sm" href="?id=${a.id}">编辑</a></td>
              </tr>
            `).join('') : '<tr><td colspan="6"><div class="empty">还没有作者。点击右上角"+ 新建作者"开始添加。</div></td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderEditor(a) {
    a = a || { knows_about: [], same_as: [], is_active: true };
    shell.content.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>${a.id ? '编辑作者' : '新建作者'}</h2>
          <a href="/admin/authors.html" class="btn btn--ghost btn--sm">返回列表</a>
        </div>
        <div class="field-row">
          <div class="field"><label>姓名 <span class="hint">（如 Chen Li、Wei Zhang）</span></label><input id="f-name" value="${escapeHtml(a.name || '')}"/></div>
          <div class="field"><label>Slug <span class="hint">（用于 URL，如 chen-li，仅小写字母、数字和短横线）</span></label><input id="f-slug" value="${escapeHtml(a.slug || '')}" ${a.id ? 'disabled' : ''}/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>职位</label><input id="f-job" value="${escapeHtml(a.job_title || '')}" placeholder="如 Cell Chemistry Lead, ex-tier-1"/></div>
          <div class="field"><label>邮箱 <span class="hint">（仅内部，不公开）</span></label><input id="f-email" type="email" value="${escapeHtml(a.email || '')}"/></div>
        </div>
        <div class="field"><label>头像 URL <span class="hint">（推荐 400×400+ 正方形，可在媒体库上传后填这里）</span></label><input id="f-avatar" value="${escapeHtml(a.avatar_url || '')}" placeholder="/uploads/authors/chen-li.jpg"/></div>
        <div class="field"><label>简介 <span class="hint">（150-320 字符；写明专业经验、年限、相关项目，写入 Person.description）</span></label><textarea id="f-bio" rows="4" maxlength="8000">${escapeHtml(a.bio || '')}</textarea></div>
        <div class="field"><label>专业领域 (knowsAbout) <span class="hint">（每行一个主题，用于 Schema.org Person.knowsAbout）</span></label><textarea id="f-knows" rows="4" placeholder="Lithium polymer chemistry
BMS topology
IEC 62133 testing">${escapeHtml((a.knows_about || []).join('\n'))}</textarea></div>
        <div class="field"><label>外部档案 (sameAs) <span class="hint">（每行一个 URL，LinkedIn / ORCID / Google Scholar 等，强 E-E-A-T 信号）</span></label><textarea id="f-same" rows="3" placeholder="https://www.linkedin.com/in/chen-li
https://orcid.org/...">${escapeHtml((a.same_as || []).join('\n'))}</textarea></div>
        <div class="field field--check"><input type="checkbox" id="f-active" ${a.is_active !== false ? 'checked' : ''}/><label for="f-active">激活（取消勾选后将不在前台列表中显示，但已有文章保持归属）</label></div>
        <div class="form-actions">
          <button class="btn btn--primary" id="save">${a.id ? '保存修改' : '创建作者'}</button>
          ${a.id ? `<button class="btn btn--ghost" id="del" style="color:var(--a-danger);">删除</button>` : ''}
          <a href="/admin/authors.html" class="btn btn--ghost">取消</a>
        </div>
      </div>
    `;

    document.getElementById('save').addEventListener('click', async () => {
      const payload = {
        name: document.getElementById('f-name').value.trim(),
        slug: document.getElementById('f-slug').value.trim().toLowerCase(),
        job_title: document.getElementById('f-job').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        avatar_url: document.getElementById('f-avatar').value.trim(),
        bio: document.getElementById('f-bio').value,
        knows_about: document.getElementById('f-knows').value.split('\n').map((s) => s.trim()).filter(Boolean),
        same_as: document.getElementById('f-same').value.split('\n').map((s) => s.trim()).filter(Boolean),
        is_active: document.getElementById('f-active').checked,
      };
      if (!payload.name) return toast('请填写姓名', 'error');
      if (!payload.slug || !/^[a-z0-9][a-z0-9-]*$/.test(payload.slug)) return toast('Slug 格式错误（仅小写字母、数字、短横线）', 'error');
      try {
        if (a.id) await api('/api/authors/' + a.id, { method: 'PUT', body: JSON.stringify(payload) });
        else await api('/api/authors', { method: 'POST', body: JSON.stringify(payload) });
        toast('作者已保存', 'success');
        setTimeout(() => location.href = '/admin/authors.html', 600);
      } catch (err) { toast('保存失败：' + err.message, 'error'); }
    });

    if (a.id) {
      document.getElementById('del').addEventListener('click', async () => {
        if (!confirm('确认删除这位作者？已发布文章会被解除归属（但不会被删除）。')) return;
        try {
          await api('/api/authors/' + a.id, { method: 'DELETE' });
          toast('作者已删除', 'success');
          setTimeout(() => location.href = '/admin/authors.html', 600);
        } catch (err) { toast('删除失败：' + err.message, 'error'); }
      });
    }
  }

  if (isNew) {
    renderEditor(null);
  } else if (wantId) {
    try {
      const items = await loadList();
      const found = items.find((x) => String(x.id) === String(wantId));
      if (found) renderEditor(found);
      else { toast('作者不存在', 'error'); location.href = '/admin/authors.html'; }
    } catch (err) { toast('加载失败：' + err.message, 'error'); }
  } else {
    const items = await loadList();
    renderList(items);
  }
})();
</script>
</body>
</html>
