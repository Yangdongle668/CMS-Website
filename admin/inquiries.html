<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>询盘 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '询盘', crumbs: '询盘收件箱' });
  if (!shell) return;

  shell.actions.innerHTML = `<a href="/api/inquiries/export/csv" class="btn btn--ghost btn--sm">导出 CSV</a>`;

  shell.content.innerHTML = `
    <div class="toolbar">
      <div class="toolbar__filters">
        <input type="search" id="q" placeholder="搜索编号、邮箱、公司…"/>
        <select id="status">
          <option value="">全部状态</option>
          <option value="new">New</option>
          <option value="read">Read</option>
          <option value="replied">Replied</option>
          <option value="archived">archived</option>
          <option value="spam">标记垃圾</option>
        </select>
        <select id="sort" title="排序">
          <option value="created">最新优先</option>
          <option value="score">高分优先</option>
        </select>
      </div>
    </div>
    <div class="split">
      <div class="panel" style="padding:0;">
        <table class="table" id="inq-table">
          <thead><tr><th>编号</th><th>公司</th><th>来源</th><th>分数</th><th>状态</th><th>提交时间</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="panel" id="detail-panel" style="display:none;"></div>
    </div>
  `;

  const tbody = document.querySelector('#inq-table tbody');
  const qInput = document.querySelector('#q');
  const statusInput = document.querySelector('#status');
  const sortInput = document.querySelector('#sort');

  function widgetTag(w) {
    const label = ({
      main_form: '主表单',
      mini_rfq: 'Mini RFQ',
      exit_intent: '退出意图',
      resource_pack: '资料包',
    })[w] || w || '主表单';
    return `<span style="font-size:11px; background:#f1f5f9; color:#475569; padding:2px 8px; border-radius:4px;">${label}</span>`;
  }

  function scoreBadge(score) {
    score = score || 0;
    let color = '#94a3b8';
    if (score >= 60) color = '#dc2626';
    else if (score >= 30) color = '#d97706';
    else if (score > 0) color = '#0b3a82';
    return `<strong style="color:${color}; font-variant-numeric:tabular-nums;">${score}</strong>`;
  }

  async function load() {
    const params = new URLSearchParams();
    if (qInput.value) params.set('q', qInput.value);
    if (statusInput.value) params.set('status', statusInput.value);
    if (sortInput.value === 'score') params.set('sort', 'score');
    params.set('limit', '50');
    const { items } = await api('/api/inquiries?' + params.toString());
    tbody.innerHTML = items.length ? items.map((i) => `
      <tr class="${i.status === 'new' ? 'is-unread' : ''}" data-id="${i.id}" style="cursor:pointer; ${(i.score || 0) >= 60 ? 'background:rgba(220,38,38,0.04);' : ''}">
        <td><span class="mono" style="font-weight:600;">${escapeHtml(i.reference)}</span></td>
        <td>
          ${escapeHtml(i.company || i.full_name)}
          <div style="font-size:11.5px; color:var(--a-mute2);">${escapeHtml(i.email)} ${i.country ? '· ' + escapeHtml(i.country) : ''}</div>
        </td>
        <td>${widgetTag(i.source_widget)}</td>
        <td>${scoreBadge(i.score)}</td>
        <td><span class="pill pill--${i.status}">${i.status}</span></td>
        <td>${formatDate(i.created_at)}</td>
      </tr>
    `).join('') : '<tr><td colspan="6"><div class="empty">没有询盘。</div></td></tr>';

    tbody.querySelectorAll('tr[data-id]').forEach((tr) => {
      tr.addEventListener('click', () => openDetail(tr.dataset.id));
    });

    // If an id was passed in URL, open it
    const wantId = new URLSearchParams(location.search).get('id');
    if (wantId) openDetail(wantId);
  }

  async function openDetail(id) {
    const { inquiry } = await api('/api/inquiries/' + id);
    const cats = Array.isArray(inquiry.product_categories) ? inquiry.product_categories.join(', ') : '';
    const panel = document.getElementById('detail-panel');
    panel.style.display = '';
    panel.innerHTML = `
      <div class="panel__head">
        <h2>${escapeHtml(inquiry.reference)} <span class="pill pill--${inquiry.status}" style="margin-left:8px;">${inquiry.status}</span></h2>
        <button class="btn btn--ghost btn--sm" id="close-detail">关闭</button>
      </div>
      <div style="display:grid; gap:10px; font-size:13.5px; margin-bottom:14px;">
        <div><strong>${escapeHtml(inquiry.full_name)}</strong> 于 <strong>${escapeHtml(inquiry.company || '-')}</strong></div>
        <div><a href="mailto:${escapeHtml(inquiry.email)}?subject=Re: ${escapeHtml(inquiry.reference)}">${escapeHtml(inquiry.email)}</a> · ${escapeHtml(inquiry.phone || '')} · ${escapeHtml(inquiry.country || '')}</div>
        <div style="color:var(--a-mute2);">${formatDate(inquiry.created_at)} · 来自 <span class="mono">${escapeHtml(inquiry.source_page || '-')}</span></div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:14px; background:var(--a-surface); border-radius:8px; font-size:13px;">
        <div><span style="color:var(--a-mute2); display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;">产品类别</span>${escapeHtml(cats)}</div>
        <div><span style="color:var(--a-mute2); display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;">容量需求</span>${escapeHtml(inquiry.capacity_need || '-')}</div>
        <div><span style="color:var(--a-mute2); display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;">年采购量</span>${escapeHtml(inquiry.annual_volume || '-')}</div>
        <div><span style="color:var(--a-mute2); display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;">应用场景</span>${escapeHtml(inquiry.application || '-')}</div>
      </div>
      <h3 style="font-size:13px; margin-top:18px;">内容</h3>
      <div style="background:#fff; border:1px solid var(--a-line); border-radius:8px; padding:14px; white-space:pre-wrap; font-size:13.5px;">${escapeHtml(inquiry.message)}</div>
      ${(Array.isArray(inquiry.attachments) && inquiry.attachments.length) ? `
        <h3 style="font-size:13px; margin-top:18px;">📎 附件（${inquiry.attachments.length}）</h3>
        <ul style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px;">
          ${inquiry.attachments.filter((a) => a && a.url).map((a) => `
            <li style="display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--a-surface-2); border:1px solid var(--a-line); border-radius:6px; font-size:13px;">
              <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(a.original_name || a.filename || '附件')}</span>
              <span style="font-size:11.5px; color:var(--a-mute2); flex-shrink:0;">${a.size ? Math.round(a.size/1024) + ' KB' : ''}</span>
              <a href="${escapeHtml(a.url)}" target="_blank" class="btn btn--ghost btn--sm" style="flex-shrink:0;" download="${escapeHtml(a.original_name || a.filename || '')}">下载</a>
            </li>
          `).join('')}
        </ul>
      ` : ''}
      <h3 style="font-size:13px; margin-top:18px;">内部备注</h3>
      <textarea id="notes" style="width:100%; min-height:80px; border:1px solid var(--a-line); border-radius:8px; padding:10px; font-size:13.5px;">${escapeHtml(inquiry.notes || '')}</textarea>
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn--sm" data-status="read">标记为已读</button>
        <button class="btn btn--sm" data-status="replied">标记为已回复</button>
        <button class="btn btn--sm btn--ghost" data-status="archived">归档</button>
        <button class="btn btn--sm btn--ghost" data-status="spam">标记垃圾</button>
        <button class="btn btn--sm btn--ghost" id="save-notes">保存备注</button>
        <button class="btn btn--sm btn--danger" data-delete style="margin-left:auto;">删除</button>
      </div>
      <div style="margin-top:14px; padding:10px; background:var(--a-surface); border-radius:6px; font-size:12px; color:var(--a-mute2);">
        同意状态：${inquiry.consent_given ? '已同意，时间 ' + formatDate(inquiry.consent_at) + ' （政策版本 ' + escapeHtml(inquiry.policy_version || '-') + ')' : '未记录'}
      </div>
    `;
    document.getElementById('close-detail').addEventListener('click', () => { panel.style.display = 'none'; });
    panel.querySelectorAll('[data-status]').forEach((b) => b.addEventListener('click', async () => {
      await api('/api/inquiries/' + id, { method: 'PATCH', body: JSON.stringify({ status: b.dataset.status }) });
      toast('状态已更新', 'success');
      load();
    }));
    document.getElementById('save-notes').addEventListener('click', async () => {
      await api('/api/inquiries/' + id, { method: 'PATCH', body: JSON.stringify({ notes: document.getElementById('notes').value }) });
      toast('备注已保存', 'success');
    });
    panel.querySelector('[data-delete]').addEventListener('click', async () => {
      if (!confirm('删除 this inquiry? Soft-deleted records are removed permanently after the retention window.')) return;
      await api('/api/inquiries/' + id, { method: 'DELETE' });
      toast('询盘已删除', 'success');
      panel.style.display = 'none';
      load();
    });
  }

  qInput.addEventListener('input', () => { clearTimeout(window.__qt); window.__qt = setTimeout(load, 250); });
  statusInput.addEventListener('change', load);
  sortInput.addEventListener('change', load);
  load();
})();
</script>
</body>
</html>
