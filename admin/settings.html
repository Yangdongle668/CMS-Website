<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>站点设置 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '站点设置', crumbs: '设置' });
  if (!shell) return;

  const { settings } = await api('/api/settings');
  // Helper that returns a deep clone-ish object so direct binding works.
  const s = (k) => (settings[k] && typeof settings[k] === 'object') ? settings[k] : {};

  // ---- AI provider tab ---------------------------------------------
  // Each provider entry comes back from /api/settings with its api_key
  // already masked to "••••XXXX" (server-side, in routes/settings.js).
  // The save flow in routes/settings.js detects the mask prefix and
  // preserves the existing DB value, so the user can save without
  // re-typing every key.
  const AI_PROVIDERS = [
    { id: 'anthropic',     label: 'Anthropic Claude',    helpUrl: 'https://console.anthropic.com/settings/keys',         models: 'claude-sonnet-4-6 / claude-opus-4-7 / claude-haiku-4-5' },
    { id: 'openai',        label: 'OpenAI',              helpUrl: 'https://platform.openai.com/api-keys',                models: 'gpt-4o-mini / gpt-4o / gpt-5' },
    { id: 'deepseek',      label: 'DeepSeek (国内)',     helpUrl: 'https://platform.deepseek.com/api_keys',              models: 'deepseek-chat / deepseek-reasoner' },
    { id: 'moonshot',      label: '月之暗面 Kimi (国内)', helpUrl: 'https://platform.moonshot.cn/console/api-keys',       models: 'moonshot-v1-32k / moonshot-v1-128k' },
    { id: 'zhipu',         label: '智谱 GLM (国内)',     helpUrl: 'https://open.bigmodel.cn/usercenter/apikeys',         models: 'glm-4-plus / glm-4-air' },
    { id: 'qwen',          label: '通义千问 (国内)',     helpUrl: 'https://bailian.console.aliyun.com/?apiKey=1',        models: 'qwen-plus / qwen-max / qwen-turbo' },
    { id: 'openai_compat', label: 'OpenAI 兼容 (自定义)', helpUrl: '',                                                    models: '私有部署 vLLM / Ollama / OneAPI 网关' },
  ];

  function renderAiPane() {
    const ai = s('ai_providers');
    const provs = (ai.providers && typeof ai.providers === 'object') ? ai.providers : {};
    const cur = (id) => (provs[id] && typeof provs[id] === 'object') ? provs[id] : {};
    return `
      <div data-pane="ai" style="display:none;">
        <div class="panel">
          <h2 style="margin-top:0;">AI 文章生成 — Provider 接入</h2>
          <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">
            填好 API Key 后点底部"保存全部设置"即可生效（无需重启服务器）。
            已存在的 Key 显示为 <code>••••XXXX</code>，留着不动表示沿用旧值；要替换就直接覆盖。
          </p>

          <h3 style="margin:18px 0 10px; font-size:14px;">默认 Provider</h3>
          <div class="field-row">
            <div class="field">
              <label>默认 Provider <span class="hint">— /admin/ai-generate.html 打开时预选这一个</span></label>
              <select data-key="ai_providers.default_provider">
                <option value="">— 自动（首个已配置的）—</option>
                ${AI_PROVIDERS.map((p) => `
                  <option value="${p.id}" ${ai.default_provider === p.id ? 'selected' : ''}>${escapeHtml(p.label)}</option>
                `).join('')}
              </select>
            </div>
            <div class="field">
              <label>单次最大 Tokens</label>
              <input type="number" data-key="ai_providers.max_tokens" value="${ai.max_tokens || 4096}" min="512" max="32000"/>
            </div>
          </div>

          ${AI_PROVIDERS.map((p) => {
            const c = cur(p.id);
            const linkBtn = p.helpUrl
              ? `<a href="${escapeHtml(p.helpUrl)}" target="_blank" rel="noopener" style="color:var(--a-accent); font-size:12px; margin-left:8px;">获取 API Key ↗</a>`
              : '';
            const baseUrlField = p.id === 'openai_compat'
              ? `<div class="field">
                   <label>Base URL <span class="hint">— 例如 https://api.example.com 或带 /v1/chat/completions 的完整地址</span></label>
                   <input data-key="ai_providers.providers.openai_compat.base_url" value="${escapeHtml(c.base_url || '')}" placeholder="https://api.example.com"/>
                 </div>`
              : '';
            return `
              <div style="border-top:1px solid var(--a-line); padding-top:18px; margin-top:18px;">
                <h3 style="margin:0 0 10px; font-size:14px;">
                  ${escapeHtml(p.label)}${linkBtn}
                  ${c.api_key ? '<span class="pill pill--read" style="margin-left:8px; font-size:11px; padding:2px 8px;">已配置</span>' : ''}
                </h3>
                <div class="field-row">
                  <div class="field">
                    <label>API Key <span class="hint">— ${c.api_key ? '已存储，留空字段则保留原值' : '尚未配置'}</span></label>
                    <input type="text" data-key="ai_providers.providers.${p.id}.api_key"
                      value="${escapeHtml(c.api_key || '')}"
                      placeholder="${c.api_key ? '不修改' : '粘贴 API Key 后保存'}"
                      autocomplete="off" spellcheck="false"
                      style="font-family: 'JetBrains Mono', monospace; font-size:12px;"/>
                  </div>
                  <div class="field">
                    <label>默认模型 <span class="hint">— ${escapeHtml(p.models)}</span></label>
                    <input data-key="ai_providers.providers.${p.id}.model"
                      value="${escapeHtml(c.model || '')}"
                      placeholder="留空使用 provider 默认"
                      style="font-family: 'JetBrains Mono', monospace; font-size:12px;"/>
                  </div>
                </div>
                ${baseUrlField}
              </div>
            `;
          }).join('')}

          <h3 style="margin:24px 0 10px; font-size:14px; padding-top:18px; border-top:1px solid var(--a-line);">AI 内容查重</h3>
          <p style="font-size:12.5px; color:var(--a-mute2); margin-top:0;">
            <strong>heuristic</strong> 是内置启发式（免费，无外部调用）：句长方差 + AI 套话词典 + em-dash 密度 + 词汇多样性 + 段落均匀度。
            <strong>GPTZero</strong> 与 <strong>Sapling</strong> 是付费 API，配上 Key 后会优先走它们，失败自动回退到启发式。
          </p>
          <div class="field-row">
            <div class="field">
              <label>检测方式</label>
              <select data-key="ai_providers.detect_provider">
                <option value="heuristic" ${(ai.detect_provider || 'heuristic') === 'heuristic' ? 'selected' : ''}>启发式（免费 / 无外部调用）</option>
                <option value="gptzero" ${ai.detect_provider === 'gptzero' ? 'selected' : ''}>GPTZero (付费)</option>
                <option value="sapling" ${ai.detect_provider === 'sapling' ? 'selected' : ''}>Sapling (付费)</option>
              </select>
            </div>
            <div class="field">
              <label>触发降AI 的分数阈值 (0-100)</label>
              <input type="number" data-key="ai_providers.detect_threshold" value="${ai.detect_threshold || 45}" min="0" max="100"/>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>GPTZero API Key <span class="hint">— <a href="https://app.gptzero.me/app/api" target="_blank" style="color:var(--a-accent);">获取 ↗</a></span></label>
              <input type="text" data-key="ai_providers.gptzero_key"
                value="${escapeHtml(ai.gptzero_key || '')}"
                placeholder="${ai.gptzero_key ? '不修改' : '可选：粘贴 GPTZero Key'}"
                autocomplete="off" spellcheck="false"
                style="font-family: 'JetBrains Mono', monospace; font-size:12px;"/>
            </div>
            <div class="field">
              <label>Sapling API Key <span class="hint">— <a href="https://sapling.ai/dashboard/credentials" target="_blank" style="color:var(--a-accent);">获取 ↗</a></span></label>
              <input type="text" data-key="ai_providers.sapling_key"
                value="${escapeHtml(ai.sapling_key || '')}"
                placeholder="${ai.sapling_key ? '不修改' : '可选：粘贴 Sapling Key'}"
                autocomplete="off" spellcheck="false"
                style="font-family: 'JetBrains Mono', monospace; font-size:12px;"/>
            </div>
          </div>

          <div style="margin-top:18px; padding:12px 14px; background:var(--a-brand-soft); border-radius:8px; font-size:12.5px;">
            <strong>提示：</strong>
            保存后立即生效 — 不必重启服务器。前往
            <a href="/admin/ai-generate.html" style="color:var(--a-brand); font-weight:600;">AI 文章生成 ↗</a>
            会看到刚配置的 provider 已经亮起。
          </div>
        </div>
      </div>
    `;
  }

  // Pre-extract address & contact_points from organization for nicer UI.
  const org = s('organization');
  const orgAddr = org.address || {};
  const orgContacts = Array.isArray(org.contactPoints) ? org.contactPoints : [];

  shell.content.innerHTML = `
    <div class="tabs">
      <button class="tabs__btn is-active" data-tab="site">站点</button>
      <button class="tabs__btn" data-tab="seo">SEO</button>
      <button class="tabs__btn" data-tab="organization">Organization 结构化数据</button>
      <button class="tabs__btn" data-tab="navigation">导航</button>
      <button class="tabs__btn" data-tab="social">社交</button>
      <button class="tabs__btn" data-tab="gdpr">GDPR</button>
      <button class="tabs__btn" data-tab="mail">邮件</button>
      <button class="tabs__btn" data-tab="security">安全防护</button>
      <button class="tabs__btn" data-tab="analytics">访问统计</button>
      <button class="tabs__btn" data-tab="webmaster">站长工具</button>
      <button class="tabs__btn" data-tab="ai">AI 接入</button>
    </div>

    <div data-pane="site">
      <div class="panel">
        <h2 style="margin-top:0;">站点信息</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">"公司名称"用于站点 header / footer / 标题；"法律实体名"会写入 Organization schema 与法律页脚。</p>
        <div class="field-row">
          <div class="field"><label>公司名称（品牌名）</label><input data-key="site.name" value="${escapeHtml(s('site').name || '')}"/></div>
          <div class="field"><label>法律实体名</label><input data-key="site.legal_name" value="${escapeHtml(s('site').legal_name || '')}"/></div>
        </div>
        <div class="field"><label>标语</label><input data-key="site.tagline" value="${escapeHtml(s('site').tagline || '')}"/></div>
        <div class="field-row">
          <div class="field"><label>销售邮箱</label><input data-key="site.email" value="${escapeHtml(s('site').email || '')}"/></div>
          <div class="field"><label>工程邮箱</label><input data-key="site.engineering_email" value="${escapeHtml(s('site').engineering_email || '')}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>电话</label><input data-key="site.phone" value="${escapeHtml(s('site').phone || '')}"/></div>
          <div class="field"><label>地址</label><input data-key="site.address" value="${escapeHtml(s('site').address || '')}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>成立年份</label><input type="number" data-key="site.founded_year" value="${s('site').founded_year || ''}"/></div>
          <div class="field"><label>工厂面积（m²）</label><input type="number" data-key="site.factory_size_sqm" value="${s('site').factory_size_sqm || ''}"/></div>
          <div class="field"><label>员工总数</label><input type="number" data-key="site.staff_count" value="${s('site').staff_count || ''}"/></div>
        </div>
        <div class="field"><label>站点图标 (Favicon) <span class="hint">浏览器标签页 / 后台登录页使用。推荐 .ico / .png，正方形。可填 /uploads/... 或外链 URL。</span></label><input data-key="site.favicon" value="${escapeHtml(s('site').favicon || '')}" placeholder="/uploads/favicon.png"/></div>
      </div>
    </div>

    <div data-pane="seo" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">SEO 配置</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">公开 URL 用于 canonical / sitemap 的绝对地址。优先级：环境变量 PUBLIC_URL &gt; 此处的设置 &gt; 请求 Host。</p>
        <div class="field"><label>公开 URL <span class="hint">（如 https://zufek.com，无尾斜杠）</span></label><input data-key="seo.public_url" value="${escapeHtml(s('seo').public_url || '')}" placeholder="https://zufek.com"/></div>
        <div class="field"><label>默认 Meta 描述 <span class="hint">（160 字符内）</span></label><textarea data-key="seo.default_meta_description" rows="3" maxlength="200">${escapeHtml(s('seo').default_meta_description || '')}</textarea></div>
        <div class="field"><label>默认 OG 图 URL <span class="hint">（推荐 1200×630 PNG/JPG）</span></label><input data-key="seo.default_meta_image" value="${escapeHtml(s('seo').default_meta_image || '')}" placeholder="/assets/img/og-default.png"/></div>

        <h3 style="margin:24px 0 12px; font-size:14px; padding-top:18px; border-top:1px solid var(--a-line);">Google Search Console 验证</h3>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; margin-bottom:10px;">
          <strong>怎么拿这个值：</strong><br>
          1. 打开 <a href="https://search.google.com/search-console" target="_blank" style="color:var(--a-accent);">Google Search Console</a>，添加资源 → 选 <strong>"网域"</strong>（推荐）或 <strong>"网址前缀"</strong>。<br>
          2. 选 <strong>"HTML 标签"</strong> 验证方式（不是 DNS、不是上传文件）。<br>
          3. 复制 <code>&lt;meta name="google-site-verification" content="<strong>这一长串</strong>"&gt;</code> 里 content 的那一长串。<br>
          4. 粘贴到下面的输入框 → 保存 → 回到 GSC 点击"验证"。
        </div>
        <div class="field"><label>Google Search Console 验证码 <span class="hint">（仅 content 部分，不要包含 &lt;meta&gt; 标签）</span></label><input data-key="seo.gsc_verify" value="${escapeHtml(s('seo').gsc_verify || '')}" placeholder="abc123def456ghi789..."/></div>

        <h3 style="margin:24px 0 12px; font-size:14px; padding-top:18px; border-top:1px solid var(--a-line);">Bing Webmaster 验证</h3>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; margin-bottom:10px;">
          <strong>怎么拿这个值：</strong><br>
          1. 打开 <a href="https://www.bing.com/webmasters" target="_blank" style="color:var(--a-accent);">Bing Webmaster Tools</a>，添加站点。<br>
          2. 选 <strong>"Meta Tag"</strong> 验证方式 → 复制 <code>&lt;meta name="msvalidate.01" content="<strong>这一串</strong>"&gt;</code> 里 content 部分。<br>
          3. 粘贴到下面 → 保存 → Bing 点击"验证"。
        </div>
        <div class="field"><label>Bing Webmaster 验证码 <span class="hint">（仅 content 部分）</span></label><input data-key="seo.bing_verify" value="${escapeHtml(s('seo').bing_verify || '')}" placeholder="ABCDEF1234567890..."/></div>

        <h3 style="margin:24px 0 12px; font-size:14px; padding-top:18px; border-top:1px solid var(--a-line);">Google Analytics 4</h3>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; margin-bottom:10px;">
          <strong>怎么拿这个值：</strong><br>
          1. 在 <a href="https://analytics.google.com" target="_blank" style="color:var(--a-accent);">Google Analytics</a> 创建 GA4 媒体资源 → 添加"网站"数据流。<br>
          2. 复制 <strong>"测量 ID"</strong>（格式 <code>G-XXXXXXXXXX</code>）。<br>
          3. 粘贴到下面 → 保存。
        </div>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; padding:10px 14px; background:#f0fdf4; border-left:3px solid #22c55e; border-radius:4px; margin-bottom:10px;">
          <strong>✓ 自动遵守 GDPR：</strong> 默认所有 cookie 类别为 "denied"，访客在 cookie 横幅勾选 analytics 后立即（无需刷新页面）通过 Consent Mode v2 切换为 "granted"。GA4 自动启用 IP 匿名化。
        </div>
        <div class="field-row">
          <div class="field"><label>GA4 测量 ID</label><input data-key="seo.ga4_measurement_id" value="${escapeHtml(s('seo').ga4_measurement_id || '')}" placeholder="G-XXXXXXXXXX"/></div>
          <div class="field"><label>Twitter / X 账号 <span class="hint">（用于社交分享卡片，如 @zufek）</span></label><input data-key="seo.twitter_handle" value="${escapeHtml(s('seo').twitter_handle || '')}" placeholder="@zufek"/></div>
        </div>

        <h3 style="margin:24px 0 12px; font-size:14px; padding-top:18px; border-top:1px solid var(--a-line);">一键自检</h3>
        <p style="font-size:12.5px; color:var(--a-mute2); margin-top:0;">
          保存后点这里，服务器会以 Google 爬虫的身份抓取首页，确认所有 SEO meta / 验证码 / sitemap / robots.txt 都正确就位。
        </p>
        <button type="button" class="btn btn--ghost" id="seo-check-run">▶ 运行 SEO 自检</button>
        <div id="seo-check-result" style="margin-top:12px;"></div>
      </div>
    </div>

    <div data-pane="organization" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">Organization 结构化数据</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">这些字段直接写入站内的 <code>Organization</code> JSON-LD（每个页面注入），用于 Google Knowledge Panel 与 AI Overviews 引用。</p>
        <div class="field-row">
          <div class="field"><label>法律实体名</label><input data-key="organization.legal_name" value="${escapeHtml(org.legal_name || '')}"/></div>
          <div class="field"><label>品牌名</label><input data-key="organization.brand_name" value="${escapeHtml(org.brand_name || '')}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>成立日期 <span class="hint">（YYYY 或 YYYY-MM-DD）</span></label><input data-key="organization.founding_date" value="${escapeHtml(org.founding_date || '')}"/></div>
          <div class="field"><label>Logo URL</label><input data-key="organization.logo" value="${escapeHtml(org.logo || '')}" placeholder="/logo.png"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>VAT ID <span class="hint">（欧盟客户合规需要）</span></label><input data-key="organization.vat_id" value="${escapeHtml(org.vat_id || '')}"/></div>
          <div class="field"><label>D-U-N-S 编号 <span class="hint">（B2B 信用查询用）</span></label><input data-key="organization.duns" value="${escapeHtml(org.duns || '')}"/></div>
        </div>
        <h3 style="margin-bottom:12px; font-size:14px;">注册地址</h3>
        <div class="field"><label>街道地址</label><input data-key="organization.address.streetAddress" value="${escapeHtml(orgAddr.streetAddress || '')}"/></div>
        <div class="field-row">
          <div class="field"><label>城市</label><input data-key="organization.address.addressLocality" value="${escapeHtml(orgAddr.addressLocality || '')}"/></div>
          <div class="field"><label>省 / 州</label><input data-key="organization.address.addressRegion" value="${escapeHtml(orgAddr.addressRegion || '')}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>邮编</label><input data-key="organization.address.postalCode" value="${escapeHtml(orgAddr.postalCode || '')}"/></div>
          <div class="field"><label>国家代码 <span class="hint">（ISO 3166-1，如 CN / US / DE）</span></label><input data-key="organization.address.addressCountry" value="${escapeHtml(orgAddr.addressCountry || 'CN')}"/></div>
        </div>
        <h3 style="margin-bottom:12px; font-size:14px;">sameAs 外链 <span style="font-size:12px; color:var(--a-mute2);">（每行一条，社交资料和媒体页都行）</span></h3>
        <div class="field"><textarea data-key="organization.sameAs" rows="4" placeholder="https://www.linkedin.com/company/zufek
https://twitter.com/zufek">${escapeHtml((org.sameAs || []).join('\n'))}</textarea></div>
        <h3 style="margin-bottom:12px; font-size:14px;">联系方式（ContactPoint）</h3>
        <p style="font-size:12px; color:var(--a-mute2);">每条对应一组业务联系（销售 / 工程 / 客服 / 媒体），写入 schema。</p>
        <textarea class="mono" data-key="organization.contactPoints" rows="10" placeholder='[{"type":"sales","email":"info@zufek.com","telephone":"+86 ...","areaServed":"Worldwide","availableLanguage":["en","zh"]}]'>${escapeHtml(JSON.stringify(orgContacts, null, 2))}</textarea>
      </div>
    </div>

    <div data-pane="navigation" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">导航</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">编辑 as JSON. Header items support nested children.</p>
        <div class="field"><label>顶部导航 (JSON)</label><textarea class="mono" data-key="navigation.header" rows="14">${escapeHtml(JSON.stringify(s('navigation').header || [], null, 2))}</textarea></div>
        <div class="field"><label>页脚导航 (JSON)</label><textarea class="mono" data-key="navigation.footer" rows="6">${escapeHtml(JSON.stringify(s('navigation').footer || [], null, 2))}</textarea></div>
      </div>
    </div>

    <div data-pane="social" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">社交链接 <span style="font-size:12px; color:var(--a-mute2); font-weight:normal;">（也会自动并入 Organization sameAs）</span></h2>
        <div class="field"><label>LinkedIn</label><input data-key="social.linkedin" value="${escapeHtml(s('social').linkedin || '')}"/></div>
        <div class="field"><label>YouTube</label><input data-key="social.youtube" value="${escapeHtml(s('social').youtube || '')}"/></div>
        <div class="field"><label>X / Twitter</label><input data-key="social.x" value="${escapeHtml(s('social').x || '')}"/></div>
        <div class="field"><label>WhatsApp</label><input data-key="social.whatsapp" value="${escapeHtml(s('social').whatsapp || '')}"/></div>
      </div>
    </div>

    <div data-pane="gdpr" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">GDPR 配置</h2>
        <div class="field-row">
          <div class="field"><label>数据控制者名称</label><input data-key="gdpr.controller" value="${escapeHtml(s('gdpr').controller || '')}"/></div>
          <div class="field"><label>隐私联系邮箱</label><input data-key="gdpr.controller_email" value="${escapeHtml(s('gdpr').controller_email || '')}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>询盘留存天数</label><input type="number" data-key="gdpr.retention_days" value="${s('gdpr').retention_days || 365}"/></div>
          <div class="field"><label>软删除保留天数</label><input type="number" data-key="gdpr.soft_delete_days" value="${s('gdpr').soft_delete_days || 30}"/></div>
        </div>
        <div class="field"><label>隐私政策版本</label><input data-key="gdpr.policy_version" value="${escapeHtml(s('gdpr').policy_version || '1.0')}"/></div>
        <div class="field"><label>Cookie 分类 (JSON)</label><textarea class="mono" data-key="gdpr.cookie_categories" rows="10">${escapeHtml(JSON.stringify(s('gdpr').cookie_categories || {}, null, 2))}</textarea></div>
      </div>
    </div>

    <div data-pane="mail" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">邮件</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">SMTP 主机/用户/密码通过 <code>.env</code> 配置。下面的字段用于行为和收件人。</p>
        <div class="field"><label>回复地址</label><input data-key="mail.reply_to" value="${escapeHtml(s('mail').reply_to || '')}"/></div>
        <div class="field"><label>邮件主题前缀</label><input data-key="mail.subject_prefix" value="${escapeHtml(s('mail').subject_prefix || '[Inquiry]')}"/></div>
        <div class="field field--check"><input type="checkbox" id="auto-reply" ${s('mail').auto_reply_enabled !== false ? 'checked' : ''}/><label for="auto-reply">给询盘提交者发送自动回复</label></div>
      </div>
    </div>

    <div data-pane="security" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">Cloudflare Turnstile (防垃圾询盘)</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">
          在所有询盘表单（联系页、退出弹窗）启用 Cloudflare Turnstile 反机器人验证。
          留空或保留为 <code>0x000…</code> 占位符则<strong>关闭验证</strong>（蜜罐、IP 限频、去重仍生效），
          配置真实密钥后自动恢复验证。
        </p>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; padding:10px 14px; background:#f0fdf4; border-left:3px solid #22c55e; border-radius:4px; margin-bottom:14px;">
          <strong>怎么获取密钥（完全免费）：</strong><br>
          1. 打开 <a href="https://dash.cloudflare.com/?to=/:account/turnstile" target="_blank" style="color:var(--a-accent);">Cloudflare Dashboard → Turnstile</a>（没有账号先免费注册）。<br>
          2. 点 <strong>"Add site"</strong> → 站点名随意 → Domain 填你的域名 → Widget Mode 选 <strong>"Managed"</strong>（推荐）。<br>
          3. 复制生成的 <strong>Site Key</strong>（公开，用于前端）和 <strong>Secret Key</strong>（保密，用于后端验证）。<br>
          4. 粘贴到下面 → 保存即时生效，无需重启服务器。
        </div>
        <div class="field">
          <label>Site Key <span class="hint">— 公开，会注入到访客的浏览器</span></label>
          <input data-key="turnstile.site_key" value="${escapeHtml((s('turnstile').site_key) || '')}" placeholder="0x4AAAAAAA..." autocomplete="off"/>
        </div>
        <div class="field">
          <label>Secret Key <span class="hint">— 服务器端验证用，已存的会显示为 ••••XXXX</span></label>
          <input data-key="turnstile.secret_key" value="${escapeHtml((s('turnstile').secret_key) || '')}" placeholder="0x4AAAAAAA..." autocomplete="off"/>
        </div>
        <div style="font-size:12px; color:var(--a-mute2); margin-top:6px;">
          ⚠️ Site Key 和 Secret Key 必须来自<strong>同一个</strong> Turnstile widget，否则验证一定失败。<br>
          ⚠️ 创建 widget 时必须把你的域名加入"Hostname management"，否则 Cloudflare 会拒绝你的请求。
        </div>
      </div>
    </div>

    <div data-pane="analytics" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">访问统计 — 排除 IP</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">
          这里列出的 IP <strong>不会</strong>被计入 "最近访客" 与统计面板（你自己 / 同事 / 监控脚本的访问就不会污染数据）。
          每行一个 IP，支持 IPv4 / IPv6；保存后立即生效，无需重启。
        </p>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; padding:10px 14px; background:#fff7ed; border-left:3px solid #f59e0b; border-radius:4px; margin-bottom:14px;">
          <strong>怎么查自己的公网 IP：</strong>
          打开 <a href="https://ipv4.icanhazip.com" target="_blank" style="color:var(--a-accent);">ipv4.icanhazip.com</a>
          （IPv4）或 <a href="https://ipv6.icanhazip.com" target="_blank" style="color:var(--a-accent);">ipv6.icanhazip.com</a>
          （IPv6）。也可以在 "最近访客" 表里找到自己刚才那条记录，复制 IP 列。<br>
          说明：表内若看到 <code>::ffff:1.2.3.4</code> 格式，填 <code>1.2.3.4</code> 即可，系统会自动识别。
        </div>
        <div class="field">
          <label>排除 IP 列表 <span class="hint">每行一个</span></label>
          <textarea class="mono" data-key="analytics.exclude_ips" rows="8" placeholder="85.137.57.233&#10;2001:db8::1">${escapeHtml((Array.isArray(s('analytics').exclude_ips) ? s('analytics').exclude_ips : []).join('\n'))}</textarea>
        </div>
        <p style="font-size:12px; color:var(--a-mute2);">
          国家识别：优先使用 Cloudflare/Vercel CDN 头；若没有 CDN 头则使用内置 GeoIP 数据库（geoip-lite）离线解析，
          老数据中显示为 "未知" 的行也会在表中实时补全国家。
        </p>
      </div>
    </div>

    <div data-pane="webmaster" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">站长工具 API 接入</h2>
        <p style="font-size:13px; color:var(--a-mute2); margin-top:0;">
          配置 Google Search Console、Google Analytics 4、Bing Webmaster 的 API 凭证后，
          "SEO 概览" 页面会自动拉取搜索关键词、点击量、实时在线用户等数据。
          所有凭证保存后<strong>仅显示遮罩</strong>，无法被前端 / 截屏窃取。
        </p>

        <h3 style="margin:18px 0 8px; font-size:14px;">Google 共享凭证（GSC + GA4）</h3>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; padding:10px 14px; background:#f0fdf4; border-left:3px solid #22c55e; border-radius:4px; margin-bottom:12px;">
          <strong>怎么拿这个 JSON：</strong><br>
          1. 打开 <a href="https://console.cloud.google.com" target="_blank" style="color:var(--a-accent);">Google Cloud Console</a> → 新建项目（或复用现有）<br>
          2. <strong>API &amp; Services → Library</strong>，启用：<code>Google Search Console API</code> 与 <code>Google Analytics Data API</code><br>
          3. <strong>IAM &amp; Admin → Service Accounts</strong>，创建一个服务账号（角色可空）<br>
          4. 点开它 → Keys → Add Key → JSON → 下载 JSON 文件，粘贴到下面文本框<br>
          5. 复制服务账号邮箱（<code>xxx@yyy.iam.gserviceaccount.com</code>），分别授权：<br>
          &nbsp;&nbsp;• <strong>Search Console</strong>：打开属性 → Settings → Users and permissions → Add user → 粘贴邮箱 → Restricted<br>
          &nbsp;&nbsp;• <strong>GA4</strong>：Admin → Property access management → Add → 粘贴邮箱 → Viewer
        </div>
        <div class="field">
          <label>Service Account JSON <span class="hint">已保存后会显示为 ••••service-account-email</span></label>
          <textarea class="mono" data-key="seo_integrations.service_account_json" rows="6" placeholder='{"type":"service_account","project_id":"...","private_key":"-----BEGIN PRIVATE KEY-----..."}' autocomplete="off">${escapeHtml(typeof s('seo_integrations').service_account_json === 'string' ? s('seo_integrations').service_account_json : '')}</textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>GSC 属性 <span class="hint">域属性填 <code>sc-domain:zufek.com</code>；URL 前缀填 <code>https://zufek.com/</code>（含尾斜杠）</span></label>
            <input data-key="seo_integrations.gsc_property" value="${escapeHtml(s('seo_integrations').gsc_property || '')}" placeholder="sc-domain:zufek.com"/>
          </div>
          <div class="field">
            <label>GA4 属性 ID <span class="hint">在 GA4 → Admin → Property settings 看 "Property ID"，纯数字</span></label>
            <input data-key="seo_integrations.ga4_property_id" value="${escapeHtml(s('seo_integrations').ga4_property_id || '')}" placeholder="123456789"/>
          </div>
        </div>

        <h3 style="margin:24px 0 8px; font-size:14px; padding-top:16px; border-top:1px solid var(--a-line);">Bing Webmaster</h3>
        <div style="font-size:12.5px; color:var(--a-mute2); line-height:1.6; padding:10px 14px; background:#eff6ff; border-left:3px solid #3b82f6; border-radius:4px; margin-bottom:12px;">
          <strong>怎么拿 API Key：</strong><br>
          打开 <a href="https://www.bing.com/webmasters" target="_blank" style="color:var(--a-accent);">Bing Webmaster Tools</a> → 右上角设置 → API 访问 → 复制 API Key（首次需点击 "Generate"）。
        </div>
        <div class="field-row">
          <div class="field">
            <label>Bing API Key <span class="hint">已保存后显示为 ••••XXXX</span></label>
            <input data-key="seo_integrations.bing_api_key" value="${escapeHtml(s('seo_integrations').bing_api_key || '')}" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off"/>
          </div>
          <div class="field">
            <label>Bing 站点 URL <span class="hint">与在 Bing Webmaster 添加时填的一致，含 https://</span></label>
            <input data-key="seo_integrations.bing_site_url" value="${escapeHtml(s('seo_integrations').bing_site_url || '')}" placeholder="https://zufek.com/"/>
          </div>
        </div>

        <p style="font-size:12px; color:var(--a-mute2); margin-top:14px;">
          保存后访问 <a href="/admin/seo-overview.html" style="color:var(--a-accent);">SEO 概览</a> 页面查看实时数据。
          数据由 Google / Bing 服务器返回，本站缓存 10 分钟以避免触发配额限制。
        </p>
      </div>
    </div>

    ${renderAiPane()}

    <div class="form-actions" style="position:sticky; bottom:0; background:#fff; border-top:1px solid var(--a-line);">
      <button class="btn" id="save-all">保存全部设置</button>
    </div>
  `;

  document.querySelectorAll('.tabs__btn').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs__btn').forEach((x) => x.classList.toggle('is-active', x === b));
    document.querySelectorAll('[data-pane]').forEach((x) => x.style.display = x.dataset.pane === b.dataset.tab ? '' : 'none');
  }));

  document.getElementById('save-all').addEventListener('click', async () => {
    // Group inputs by top-level settings key. data-key supports dotted
    // paths like "organization.address.city" so nested objects map cleanly.
    const groups = {};
    function setNested(obj, pathParts, val) {
      let cur = obj;
      for (let i = 0; i < pathParts.length - 1; i++) {
        const k = pathParts[i];
        if (!cur[k] || typeof cur[k] !== 'object' || Array.isArray(cur[k])) cur[k] = {};
        cur = cur[k];
      }
      cur[pathParts[pathParts.length - 1]] = val;
    }
    let jsonError = null;
    document.querySelectorAll('[data-key]').forEach((el) => {
      if (jsonError) return;
      const parts = el.dataset.key.split('.');
      const group = parts[0];
      if (!groups[group]) groups[group] = JSON.parse(JSON.stringify(s(group)));
      let val = el.value;
      // Special: organization.sameAs textarea is line-separated, not JSON.
      if (el.dataset.key === 'organization.sameAs') {
        val = String(val).split('\n').map((x) => x.trim()).filter(Boolean);
      } else if (el.dataset.key === 'analytics.exclude_ips') {
        // Line-separated list of IPs; normalize and dedupe before saving.
        val = Array.from(new Set(String(val).split('\n').map((x) => x.trim()).filter(Boolean)));
      } else if (el.dataset.key === 'seo_integrations.service_account_json') {
        // Pass through as a raw string — the masked placeholder must reach
        // the server intact, and the JSON validation happens server-side.
        val = String(val);
      } else if (el.tagName === 'TEXTAREA' && el.classList.contains('mono')) {
        try { val = JSON.parse(val); }
        catch (_) { jsonError = el.dataset.key; return; }
      } else if (el.type === 'number') {
        val = parseInt(val, 10) || 0;
      }
      setNested(groups[group], parts.slice(1), val);
    });
    if (jsonError) return toast('JSON 格式错误：' + jsonError, 'error');
    // Auto-reply checkbox lives outside data-key inputs.
    if (groups.mail) {
      groups.mail.auto_reply_enabled = document.getElementById('auto-reply').checked;
    }
    try {
      for (const [k, v] of Object.entries(groups)) {
        await api('/api/settings/' + k, { method: 'PUT', body: JSON.stringify({ value: v }) });
      }
      toast('设置已保存', 'success');
    } catch (err) { toast('保存 failed: ' + err.message, 'error'); }
  });

  // SEO 一键自检：抓取首页，看看每项 SEO meta / 验证码是否已落地
  const seoCheckBtn = document.getElementById('seo-check-run');
  if (seoCheckBtn) {
    seoCheckBtn.addEventListener('click', async () => {
      const out = document.getElementById('seo-check-result');
      out.innerHTML = '<div style="padding:14px; color:var(--a-mute2);">正在抓取首页…</div>';
      seoCheckBtn.disabled = true;
      try {
        const r = await api('/api/seo-check');
        const c = r.checks;
        const row = (label, val, hint) => {
          const present = val === true || (typeof val === 'string' && val);
          const icon = present ? '<span style="color:#16a34a;">✓</span>' : '<span style="color:#dc2626;">✗</span>';
          const valTxt = typeof val === 'string' ? `<code style="font-size:12px; color:var(--a-mute2); margin-left:8px;">${escapeHtml(val.length > 60 ? val.slice(0, 57) + '…' : val)}</code>` : '';
          return `<tr><td style="padding:6px 12px;">${icon}</td><td style="padding:6px 12px;"><strong>${label}</strong>${valTxt}<div style="font-size:11.5px; color:var(--a-mute2);">${hint || ''}</div></td></tr>`;
        };
        out.innerHTML = `
          <div style="padding:14px; background:#f8fafc; border:1px solid var(--a-line); border-radius:8px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12.5px;">
              <span><strong>抓取目标：</strong> <code>${escapeHtml(r.target)}</code></span>
              <span style="color:var(--a-mute2);">HTTP ${r.httpStatus} · ${(r.bodySize/1024).toFixed(1)} KB</span>
            </div>
            <table style="width:100%; border-collapse:collapse; font-size:13px;">
              ${row('Canonical URL', c.canonical, '应该指向公开 URL + 当前路径')}
              ${row('OG image', c.og_image, '社交分享卡片缩略图')}
              ${row('Twitter card', c.twitter_card, '应为 summary_large_image')}
              ${row('Organization 结构化数据', c.organization_schema, 'Knowledge Panel + AI Overviews 引用基础')}
              ${row('WebSite 结构化数据', c.website_schema, '让搜索框出现在站点结果上')}
              ${row('Google Search Console 验证', c.google_site_verification, c.google_site_verification ? '已就位，可在 GSC 点击"验证"' : '未配置（在上方 GSC 字段填值后再来）')}
              ${row('Bing Webmaster 验证', c.bing_msvalidate, c.bing_msvalidate ? '已就位' : '未配置（可选）')}
              ${row('Twitter @ 账号', c.twitter_site, c.twitter_site ? '已注入' : '未配置（可选）')}
              ${row('GA4 gtag.js 已加载', c.ga4_tag, c.ga4_tag ? '测量 ID: ' + c.ga4_tag : '未配置 GA4 ID')}
              ${row('GA4 Consent Mode v2', c.ga4_consent_default, c.ga4_consent_default ? '默认 denied，等访客同意 cookie 后转为 granted' : (c.ga4_tag ? '⚠️ Consent default 缺失！' : '需要先配置 GA4 ID'))}
            </table>
            ${r.sitemap ? `
              <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--a-line); font-size:12.5px;">
                <strong>sitemap.xml：</strong> HTTP ${r.sitemap.status} · 绝对 URL ${r.sitemap.abs_url_count} 条 · image-sitemap ${r.sitemap.has_image_ns ? '✓' : '✗'}
              </div>` : ''}
            ${r.robots ? `
              <div style="font-size:12.5px;">
                <strong>robots.txt：</strong> HTTP ${r.robots.status} · Sitemap 绝对 URL ${r.robots.has_absolute_sitemap ? '✓' : '✗'} · 允许 AI 爬虫 ${r.robots.allows_ai_bots ? '✓' : '✗'}
              </div>` : ''}
          </div>
        `;
      } catch (err) {
        out.innerHTML = `<div style="padding:14px; color:#dc2626; background:#fef2f2; border-radius:8px;">自检失败：${escapeHtml(err.message)}</div>`;
      } finally {
        seoCheckBtn.disabled = false;
      }
    });
  }
})();
</script>
</body>
</html>
