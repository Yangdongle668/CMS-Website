<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>用户 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '用户', crumbs: '设置 / 用户' });
  if (!shell) return;
  shell.actions.innerHTML = `<button class="btn btn--sm" id="new">+ 新建用户</button>`;

  async function refresh() {
    const { items } = await api('/api/users');
    shell.content.innerHTML = `
      <div class="panel">
        <table class="table">
          <thead><tr><th>邮箱</th><th>名称</th><th>角色</th><th>状态</th><th>最近登录</th><th></th></tr></thead>
          <tbody>
            ${items.map((u) => `
              <tr>
                <td><strong>${escapeHtml(u.email)}</strong></td>
                <td>${escapeHtml(u.name || '-')}</td>
                <td><span class="pill pill--read">${escapeHtml(u.role)}</span></td>
                <td>${u.is_active ? '<span class="pill pill--published">已启用</span>' : '<span class="pill pill--archived">停用d</span>'}</td>
                <td>${u.last_login_at ? formatDate(u.last_login_at) : '<span style="color:var(--a-mute2);">从未</span>'}</td>
                <td>
                  <button class="btn btn--ghost btn--sm" data-edit='${escapeHtml(JSON.stringify(u))}'>编辑</button>
                  <button class="btn btn--ghost btn--sm" data-toggle="${u.id}" data-active="${u.is_active}">${u.is_active ? '停用' : '启用'}</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div id="edit-panel"></div>
    `;
    document.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
      try { renderEditor(JSON.parse(b.getAttribute('data-edit'))); } catch (_) {}
    }));
    document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', async () => {
      await api('/api/users/' + b.dataset.toggle, { method: 'PATCH', body: JSON.stringify({ is_active: !(b.dataset.active === 'true') }) });
      toast('用户已更新', 'success');
      refresh();
    }));
  }

  function renderEditor(u) {
    u = u || { role: 'admin' };
    const isNew = !u.id;
    const panel = document.getElementById('edit-panel');
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head"><h2>${isNew ? '新建用户' : '编辑 user'}</h2></div>
        <div class="field-row">
          <div class="field"><label>Email</label><input id="f-email" value="${escapeHtml(u.email || '')}" ${isNew ? '' : 'readonly'}/></div>
          <div class="field"><label>名称</label><input id="f-name" value="${escapeHtml(u.name || '')}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>角色</label><select id="f-role"><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option><option value="editor" ${u.role === 'editor' ? 'selected' : ''}>Editor</option></select></div>
          <div class="field"><label>${isNew ? '密码' : '新密码（留空表示不修改）'}</label><input id="f-pw" type="password" autocomplete="new-password"/></div>
        </div>
        <div class="form-actions">
          <button class="btn" id="save">保存</button>
          <button class="btn btn--ghost" id="cancel">取消</button>
        </div>
      </div>
    `;
    panel.querySelector('#cancel').addEventListener('click', () => { panel.innerHTML = ''; });
    panel.querySelector('#save').addEventListener('click', async () => {
      const payload = {
        email: panel.querySelector('#f-email').value,
        name: panel.querySelector('#f-name').value,
        role: panel.querySelector('#f-role').value,
      };
      const pw = panel.querySelector('#f-pw').value;
      if (pw) payload.password = pw;
      try {
        if (isNew) {
          if (!pw) return toast('新建用户必须设置密码', 'error');
          await api('/api/users', { method: 'POST', body: JSON.stringify(payload) });
        } else {
          await api('/api/users/' + u.id, { method: 'PATCH', body: JSON.stringify(payload) });
        }
        toast('保存d', 'success');
        panel.innerHTML = '';
        refresh();
      } catch (err) { toast('保存 failed: ' + err.message, 'error'); }
    });
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'new') renderEditor();
  });
  refresh();
})();
</script>
</body>
</html>
