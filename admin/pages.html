<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>页面 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
<style>
  .pages-hint { margin: 0 0 16px; color: var(--a-mute2); font-size: 13px; line-height: 1.6; }
  .pages-hint strong { color: var(--a-brand); }
  .new-modal { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 200; }
  .new-modal__box { background: #fff; border-radius: 14px; width: 420px; max-width: 92%; padding: 26px 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.25); }
  .new-modal__box h3 { margin: 0 0 6px; font-size: 17px; }
  .new-modal__box p { margin: 0 0 18px; color: var(--a-mute2); font-size: 13px; }
  .new-modal__actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
</style>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '页面', crumbs: '内容 / 静态页面' });
  if (!shell) return;
  shell.actions.innerHTML = `
    <a href="/admin/templates.html" class="btn btn--ghost btn--sm">★ 从模板创建</a>
    <button class="btn btn--sm" id="new-btn">+ 新建空白页面</button>
  `;

  function slugToFrontUrl(slug) {
    if (slug === 'home') return '/';
    if (['faq', 'contact', 'privacy', 'terms', 'legal', 'gdpr', 'cookies'].includes(slug)) return '/' + slug + '.html';
    if (slug.endsWith('/index')) return '/' + slug.replace(/\/index$/, '/');
    return '/' + slug;
  }

  // Open the visual builder in a new window. WordPress-style — the
  // builder takes the entire viewport (no admin shell), all editing
  // (page settings, blocks, SEO, history) happens in that one window.
  function openBuilder(pageId) {
    const w = window.open(
      '/admin/page-builder.html?page=' + pageId + '&fs=1',
      'cms-builder-' + pageId,
      'width=1500,height=950,resizable=yes,scrollbars=yes'
    );
    if (!w) {
      toast('浏览器拦了弹窗，已在当前页打开。下次允许弹窗体验会更好。', 'error');
      location.href = '/admin/page-builder.html?page=' + pageId + '&fs=1';
      return;
    }
    w.focus();
  }

  // When the builder window closes or saves, refresh the list so any
  // title/slug/status changes show up immediately.
  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (m && m.source === 'cms-builder-window' && (m.type === 'closed' || m.type === 'deleted')) {
      refresh();
    }
  });

  async function refresh() {
    let items = [];
    try { ({ items } = await api('/api/pages/admin')); }
    catch (e) {
      shell.content.innerHTML = '<div class="panel"><div class="empty">加载失败：' + escapeHtml(e.message) + '</div></div>';
      return;
    }
    shell.content.innerHTML = `
      <div class="panel">
        <p class="pages-hint">
          点击页面行的 <strong>✎ 编辑</strong> 会在新窗口打开可视化编辑器：
          页面级设置（slug/标题/导航/状态）、区块拖拽、SEO 配置、历史快照
          全部集成在一个全屏界面里——所见即所得。
        </p>
        <table class="table">
          <thead>
            <tr>
              <th>Slug / URL</th>
              <th>标题</th>
              <th>导航</th>
              <th>状态</th>
              <th>更新于</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${items.length ? items.map((p) => `
              <tr data-id="${p.id}" style="cursor:pointer;">
                <td>
                  <span class="mono" style="font-weight:600;">${escapeHtml(p.slug)}</span>
                  <div style="font-size:11px; color:var(--a-mute2); margin-top:2px;">
                    <a href="${escapeHtml(slugToFrontUrl(p.slug))}" target="_blank" rel="noopener" style="color:inherit;" onclick="event.stopPropagation();">${escapeHtml(slugToFrontUrl(p.slug))} ↗</a>
                  </div>
                </td>
                <td>
                  <div style="font-weight:600;">${escapeHtml(p.title || '(未命名)')}</div>
                  <div style="font-size:11.5px; color:var(--a-mute2);">${escapeHtml(p.hero_title || '')}</div>
                </td>
                <td>${p.nav ? `<span class="pill pill--read">${escapeHtml(p.nav)}</span>` : '<span style="color:var(--a-mute3);">—</span>'}</td>
                <td><span class="pill pill--${p.status}">${p.status === 'published' ? '已发布' : '草稿'}</span></td>
                <td style="font-size:12px; color:var(--a-mute2);">${formatDate(p.updated_at)}</td>
                <td style="text-align:right;">
                  <button class="btn btn--sm" data-edit="${p.id}" onclick="event.stopPropagation();">✎ 编辑</button>
                </td>
              </tr>
            `).join('') : '<tr><td colspan="6"><div class="empty">还没有任何页面。点上方"+ 新建空白页面"或"★ 从模板创建"开始。</div></td></tr>'}
          </tbody>
        </table>
      </div>
    `;

    // Click row = open builder
    shell.content.querySelectorAll('tr[data-id]').forEach((tr) => {
      tr.addEventListener('click', () => openBuilder(parseInt(tr.dataset.id, 10)));
    });
    shell.content.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => openBuilder(parseInt(btn.dataset.edit, 10)));
    });
  }

  // ----- "+ 新建空白页面" — minimal modal asking for slug + title only -----
  document.addEventListener('click', (ev) => {
    if (ev.target.id !== 'new-btn') return;
    const overlay = document.createElement('div');
    overlay.className = 'new-modal';
    overlay.innerHTML = `
      <div class="new-modal__box">
        <h3>新建空白页面</h3>
        <p>填写 slug 和标题就行；其他所有内容（hero、区块、SEO 等）在编辑器里完成。</p>
        <div class="field">
          <label>URL Slug *</label>
          <input id="new-slug" placeholder="例如 about/team 或 services-2026" maxlength="190" autofocus>
          <span class="hint">只能小写字母、数字、- _ /。前台访问 /<slug> 或 /<slug>.html</span>
        </div>
        <div class="field">
          <label>页面标题 *</label>
          <input id="new-title" placeholder="如：关于我们 / About Us" maxlength="255">
        </div>
        <div class="new-modal__actions">
          <button class="btn btn--ghost" data-close>取消</button>
          <button class="btn" data-create>创建并打开编辑器</button>
        </div>
      </div>
    `;
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target.matches('[data-close]')) overlay.remove();
    });
    overlay.querySelector('[data-create]').addEventListener('click', async () => {
      const slug = overlay.querySelector('#new-slug').value.trim().toLowerCase();
      const title = overlay.querySelector('#new-title').value.trim();
      if (!slug || !title) { toast('slug 和标题都得填', 'error'); return; }
      if (!/^[a-z0-9_\-\/]+$/.test(slug)) { toast('slug 含非法字符', 'error'); return; }
      try {
        const r = await api('/api/pages', {
          method: 'POST',
          body: JSON.stringify({ slug, title, status: 'published' }),
        });
        overlay.remove();
        // The endpoint returns { id }. Open builder for the new page.
        const newId = r.id || (r.page && r.page.id);
        if (newId) openBuilder(newId);
        // Refresh list so the new row appears (after builder window opens)
        setTimeout(refresh, 400);
      } catch (e) { toast('创建失败：' + e.message, 'error'); }
    });
    document.body.appendChild(overlay);
    setTimeout(() => overlay.querySelector('#new-slug').focus(), 50);
  });

  refresh();
})();
</script>
</body>
</html>
