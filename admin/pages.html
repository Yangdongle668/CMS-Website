<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>页面构建器 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
<style>
/* ===========================================================
   Visual page builder shell — overrides .page padding so the
   iframe can fill the viewport.
   =========================================================== */
.builder { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 64px); border-top: 1px solid var(--a-line); }
.builder__left {
  background: var(--a-surface); border-right: 1px solid var(--a-line);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.builder__right { background: #f4f5f7; position: relative; overflow: hidden; }
.builder__right iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }

.builder__bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--a-line); background: #fff;
  gap: 10px; flex-shrink: 0;
}
.builder__bar h2 { font-size: 13px; font-weight: 700; margin: 0; }
.builder__bar .url { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--a-mute2); }
.builder__bar .actions { display: flex; gap: 6px; }

.builder__scroll { flex: 1; overflow-y: auto; padding: 14px; }
.builder__sect-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--a-mute2); margin: 18px 0 8px;
}
.builder__sect-title:first-child { margin-top: 4px; }

.field-card { background: #fff; border: 1px solid var(--a-line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.field-card .field { margin-bottom: 8px; }
.field-card .field:last-child { margin-bottom: 0; }
.field-card .field label { font-size: 11.5px; font-weight: 600; color: var(--a-muted); display: block; margin-bottom: 4px; }
.field-card .field input,
.field-card .field textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--a-line);
  border-radius: 6px; font-size: 13px; font-family: inherit;
}
.field-card .field textarea { resize: vertical; min-height: 60px; }

/* Block list */
.block-list { display: flex; flex-direction: column; gap: 6px; }
.block-row {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border: 1px solid var(--a-line); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; user-select: none;
  transition: border 0.15s ease, transform 0.15s ease;
}
.block-row:hover { border-color: var(--a-brand); }
.block-row.is-dragging { opacity: 0.5; }
.block-row.is-drop-target { border-color: var(--a-brand); border-style: dashed; }
.block-row__handle { color: var(--a-mute2); cursor: grab; font-size: 14px; line-height: 1; }
.block-row__handle:active { cursor: grabbing; }
.block-row__icon { font-size: 16px; line-height: 1; }
.block-row__body { flex: 1; min-width: 0; }
.block-row__body .ttl { font-size: 13px; font-weight: 600; color: #1f2127; }
.block-row__body .sub { font-size: 11.5px; color: var(--a-mute2); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block-row__actions { display: flex; gap: 4px; }
.block-row__btn {
  width: 26px; height: 26px; border: 0; background: transparent; cursor: pointer;
  border-radius: 6px; color: var(--a-muted); font-size: 14px;
}
.block-row__btn:hover { background: var(--a-surface); color: #1f2127; }
.block-row__btn.danger:hover { color: #cf1322; background: #fff1f0; }

.add-block-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 11px 14px; margin-top: 8px;
  background: #fff; border: 1.5px dashed var(--a-line); border-radius: 10px;
  font-size: 13px; font-weight: 600; color: var(--a-muted); cursor: pointer;
  transition: border 0.15s ease, color 0.15s ease;
}
.add-block-btn:hover { border-color: var(--a-brand); color: var(--a-brand); border-style: solid; }

/* Block picker modal */
.picker-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }
.picker-mask.is-open { display: flex; }
.picker {
  background: #fff; border-radius: 14px; padding: 22px;
  width: 100%; max-width: 640px; max-height: 80vh; overflow-y: auto;
}
.picker h3 { margin: 0 0 4px; font-size: 16px; }
.picker p { margin: 0 0 16px; font-size: 13px; color: var(--a-mute2); }
.picker__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.picker__item {
  background: #fff; border: 1px solid var(--a-line); border-radius: 10px;
  padding: 14px 12px; cursor: pointer; text-align: left; transition: all 0.15s ease;
}
.picker__item:hover { border-color: var(--a-brand); transform: translateY(-1px); }
.picker__item .ico { font-size: 22px; line-height: 1; margin-bottom: 8px; }
.picker__item .ttl { font-size: 13px; font-weight: 600; color: #1f2127; }
.picker__item .sub { font-size: 11.5px; color: var(--a-mute2); margin-top: 2px; }
.picker__item.is-soon { opacity: 0.45; cursor: not-allowed; }
.picker__item.is-soon:hover { transform: none; }

/* Block edit drawer */
.drawer-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.05); z-index: 30; display: none; }
.drawer-mask.is-open { display: block; }
.drawer {
  position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
  background: #fff; z-index: 40; transform: translateX(-100%); transition: transform 0.22s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
}
.drawer.is-open { transform: translateX(0); }
.drawer__bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-bottom: 1px solid var(--a-line); flex-shrink: 0;
}
.drawer__bar h3 { margin: 0; font-size: 14px; font-weight: 700; }
.drawer__body { flex: 1; overflow-y: auto; padding: 16px 14px; }

/* Repeater (cards inside a block, e.g. pillar-grid cards) */
.repeater__item {
  background: #fff; border: 1px solid var(--a-line); border-radius: 10px;
  margin-bottom: 10px; overflow: hidden;
}
.repeater__head {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  cursor: pointer; user-select: none; background: var(--a-surface);
}
.repeater__head:hover { background: #f0f1f3; }
.repeater__head .ttl { flex: 1; font-size: 13px; font-weight: 600; }
.repeater__head .caret { color: var(--a-mute2); transition: transform 0.18s ease; }
.repeater__item.is-open .repeater__head .caret { transform: rotate(90deg); }
.repeater__body { display: none; padding: 12px; border-top: 1px solid var(--a-line); }
.repeater__item.is-open .repeater__body { display: block; }
.repeater__handle { color: var(--a-mute2); cursor: grab; font-size: 14px; }

/* Status pill in topbar */
.status-pill { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.status-pill.published { background: #e7f7ec; color: #137333; }
.status-pill.draft     { background: #fff4e5; color: #a35200; }
.dirty-badge { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #fff4e5; color: #a35200; margin-left: 8px; }

/* Preview width toggle */
.viewport-toggle { position: absolute; top: 12px; right: 14px; z-index: 5; display: flex; gap: 4px; background: #fff; border-radius: 999px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.viewport-toggle button {
  border: 0; background: transparent; padding: 5px 12px; font-size: 12px; font-weight: 600;
  color: var(--a-muted); border-radius: 999px; cursor: pointer; line-height: 1;
}
.viewport-toggle button.is-active { background: #171a20; color: #fff; }
.iframe-wrap { display: flex; justify-content: center; align-items: flex-start; height: 100%; padding: 12px; overflow: auto; }
.iframe-wrap iframe { width: 100%; max-width: 100%; height: 100%; border: 0; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-radius: 4px; }
.iframe-wrap.mobile iframe { max-width: 390px; }

/* Override admin shell page padding so builder fills the viewport */
.main .page { padding: 0 !important; }
</style>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script src="/admin/assets/js/page-builder.js?v=1"></script>
</body>
</html>
