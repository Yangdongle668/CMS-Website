<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Pages | Acme CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: 'Pages', crumbs: 'Content / Static Pages' });
  if (!shell) return;
  shell.actions.innerHTML = `<button class="btn btn--sm" id="new">+ New page</button>`;

  const wantId = new URLSearchParams(location.search).get('id');

  async function refresh() {
    const { items } = await api('/api/pages/admin');
    shell.content.innerHTML = `
      <div class="panel" id="list-panel">
        <p style="margin:0 0 16px; color:var(--a-mute2); font-size:13px;">
          Edit hero, meta, breadcrumbs, body content and per-page sections (e.g. homepage blocks). Changes apply on the next page load.
        </p>
        <table class="table">
          <thead><tr><th>Slug</th><th>Title</th><th>Nav</th><th>Status</th><th>Updated</th><th></th></tr></thead>
          <tbody>
            ${items.length ? items.map((p) => `
              <tr>
                <td><span class="mono" style="font-weight:600;">${escapeHtml(p.slug)}</span></td>
                <td>${escapeHtml(p.title || '')}<div style="font-size:11.5px; color:var(--a-mute2);">${escapeHtml(p.hero_title || '')}</div></td>
                <td><span class="pill pill--read">${escapeHtml(p.nav || '-')}</span></td>
                <td><span class="pill pill--${p.status}">${p.status}</span></td>
                <td>${formatDate(p.updated_at)}</td>
                <td>
                  <a class="btn btn--ghost btn--sm" href="?id=${p.id}">Edit</a>
                  <a class="btn btn--ghost btn--sm" target="_blank" href="${slugToUrl(p.slug)}">Preview &uarr;</a>
                </td>
              </tr>
            `).join('') : '<tr><td colspan="6"><div class="empty">No pages.</div></td></tr>'}
          </tbody>
        </table>
      </div>
      <div id="edit-panel"></div>
    `;
    if (wantId) {
      const p = items.find((x) => String(x.id) === wantId);
      if (p) renderEditor(p);
    }
  }

  function slugToUrl(slug) {
    if (slug === 'home') return '/';
    if (slug === 'faq') return '/faq.html';
    if (slug === 'contact') return '/contact.html';
    if (['privacy','terms','legal','gdpr'].includes(slug)) return '/' + slug + '.html';
    if (slug.endsWith('/index')) return '/' + slug.replace(/\/index$/, '/');
    return '/' + slug + '.html';
  }

  function renderEditor(p) {
    p = p || { slug: '', status: 'published', hero_breadcrumbs: [], sections: {} };
    const isNew = !p.id;
    document.getElementById('list-panel').style.display = 'none';
    const panel = document.getElementById('edit-panel');
    const breadcrumbsJson = JSON.stringify(p.hero_breadcrumbs || [], null, 2);
    const sectionsJson = JSON.stringify(p.sections || {}, null, 2);
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>${isNew ? 'New page' : 'Edit: ' + escapeHtml(p.slug)}</h2>
          <div style="display:flex; gap:8px;">
            ${!isNew ? `<a target="_blank" class="btn btn--ghost btn--sm" href="${slugToUrl(p.slug)}">Preview &uarr;</a>` : ''}
            <a href="/admin/pages.html" class="btn btn--ghost btn--sm">Back</a>
          </div>
        </div>

        <div class="tabs">
          <button class="tabs__btn is-active" data-tab="hero">Hero &amp; Meta</button>
          <button class="tabs__btn" data-tab="body">Body content</button>
          <button class="tabs__btn" data-tab="sections">Sections (JSON)</button>
          <button class="tabs__btn" data-tab="advanced">Advanced</button>
        </div>

        <div data-pane="hero">
          <div class="field-row">
            <div class="field"><label>Slug <span class="hint">(URL key, e.g. about/profile)</span></label><input id="f-slug" value="${escapeHtml(p.slug)}" ${isNew ? '' : 'readonly'}/></div>
            <div class="field"><label>Nav highlight <span class="hint">(top-level nav slug)</span></label><input id="f-nav" value="${escapeHtml(p.nav || '')}"/></div>
          </div>
          <div class="field"><label>Title <span class="hint">(internal label)</span></label><input id="f-title" value="${escapeHtml(p.title || '')}"/></div>
          <div class="field"><label>Hero eyebrow <span class="hint">(small caps line above the H1)</span></label><input id="f-heyebrow" value="${escapeHtml(p.hero_eyebrow || '')}"/></div>
          <div class="field"><label>Hero title (H1)</label><input id="f-htitle" value="${escapeHtml(p.hero_title || '')}"/></div>
          <div class="field"><label>Hero subtitle</label><textarea id="f-hsub" rows="2">${escapeHtml(p.hero_subtitle || '')}</textarea></div>
          <div class="field"><label>Hero background image URL <span class="hint">(full-bleed cover photo)</span></label><input id="f-himg" value="${escapeHtml(p.hero_image || '')}"/></div>
          <div class="field"><label>Breadcrumbs (JSON array of {label, url})</label><textarea id="f-crumbs" class="mono" rows="4">${escapeHtml(breadcrumbsJson)}</textarea></div>

          <h3 style="margin-top:24px; font-size:14px;">SEO</h3>
          <div class="field"><label>Meta title <span class="hint">(browser tab + Google result)</span></label><input id="f-mtitle" value="${escapeHtml(p.meta_title || '')}"/></div>
          <div class="field"><label>Meta description</label><textarea id="f-mdesc" rows="3">${escapeHtml(p.meta_description || '')}</textarea></div>
        </div>

        <div data-pane="body" style="display:none;">
          <p style="font-size:13px; color:var(--a-mute2);">Optional: replace the <strong>post-hero body</strong> (everything below the hero) with custom HTML. Leave empty to keep the static page's content. Use plain HTML — see the existing pages for class names like <code>.section</code>, <code>.section-light</code>, <code>.section-inner</code>, <code>.eyebrow</code>, <code>.lead</code>, <code>.product-grid</code>, <code>.feat-grid</code>, etc.</p>
          <p style="font-size:13px; color:var(--a-warning);"><strong>Note:</strong> the static HTML must contain a <code>&lt;div data-page-body&gt;...&lt;/div&gt;</code> wrapper for this override to apply. Pages that don't have this wrapper will only get hero + meta updates.</p>
          <div class="field"><textarea id="f-body" rows="20" class="mono">${escapeHtml(p.body_html || '')}</textarea></div>
        </div>

        <div data-pane="sections" style="display:none;">
          <p style="font-size:13px; color:var(--a-mute2);">Per-page structured data. Used by the homepage to drive the products / why / CTA blocks. Edit as JSON.</p>
          <div class="field"><textarea id="f-sections" rows="20" class="mono">${escapeHtml(sectionsJson)}</textarea></div>
        </div>

        <div data-pane="advanced" style="display:none;">
          <div class="field-row">
            <div class="field"><label>Status</label><select id="f-status"><option value="published" ${p.status === 'published' ? 'selected' : ''}>Published</option><option value="draft" ${p.status === 'draft' ? 'selected' : ''}>Draft</option></select></div>
            <div class="field"><label>Updated</label><input value="${escapeHtml(formatDate(p.updated_at) || '-')}" readonly/></div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn" id="save">Save</button>
          ${!isNew ? '<button class="btn btn--danger" id="delete">Delete</button>' : ''}
          <a href="/admin/pages.html" class="btn btn--ghost">Cancel</a>
        </div>
      </div>
    `;

    panel.querySelectorAll('.tabs__btn').forEach((b) => b.addEventListener('click', () => {
      panel.querySelectorAll('.tabs__btn').forEach((x) => x.classList.toggle('is-active', x === b));
      panel.querySelectorAll('[data-pane]').forEach((x) => x.style.display = x.dataset.pane === b.dataset.tab ? '' : 'none');
    }));

    panel.querySelector('#save').addEventListener('click', async () => {
      let crumbs, sections;
      try { crumbs = JSON.parse(panel.querySelector('#f-crumbs').value || '[]'); }
      catch (_) { return toast('Breadcrumbs JSON is invalid', 'error'); }
      try { sections = JSON.parse(panel.querySelector('#f-sections').value || '{}'); }
      catch (_) { return toast('Sections JSON is invalid', 'error'); }
      const payload = {
        slug: panel.querySelector('#f-slug').value,
        nav: panel.querySelector('#f-nav').value,
        title: panel.querySelector('#f-title').value,
        meta_title: panel.querySelector('#f-mtitle').value,
        meta_description: panel.querySelector('#f-mdesc').value,
        hero_eyebrow: panel.querySelector('#f-heyebrow').value,
        hero_title: panel.querySelector('#f-htitle').value,
        hero_subtitle: panel.querySelector('#f-hsub').value,
        hero_image: panel.querySelector('#f-himg').value,
        hero_breadcrumbs: crumbs,
        body_html: panel.querySelector('#f-body').value,
        sections,
        status: panel.querySelector('#f-status').value,
      };
      try {
        if (isNew) await api('/api/pages', { method: 'POST', body: JSON.stringify(payload) });
        else await api('/api/pages/' + p.id, { method: 'PUT', body: JSON.stringify(payload) });
        toast('Saved', 'success');
        setTimeout(() => location.href = '/admin/pages.html', 500);
      } catch (err) { toast('Save failed: ' + err.message, 'error'); }
    });
    if (!isNew) {
      panel.querySelector('#delete').addEventListener('click', async () => {
        if (!confirm('Delete this page? Restoring requires re-creating with the same slug.')) return;
        await api('/api/pages/' + p.id, { method: 'DELETE' });
        toast('Deleted', 'success');
        setTimeout(() => location.href = '/admin/pages.html', 500);
      });
    }
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'new') renderEditor();
  });
  refresh();
})();
</script>
</body>
</html>
