<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>图片替换 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css?v=2"/>
<style>
  .mo-row { display:grid; grid-template-columns: 1.4fr 1.4fr 0.7fr; gap:14px; align-items:center; padding:14px; border:1px solid var(--a-line); border-radius:8px; margin-bottom:10px; background:#fff; }
  .mo-row.is-mapped { border-color:#22c55e; background:#f0fdf4; }
  .mo-src { font-size:12px; color:var(--a-mute2); word-break:break-all; }
  .mo-src strong { display:block; color:var(--a-text); font-weight:500; font-size:12.5px; margin-bottom:4px; }
  .mo-thumb { width:80px; height:54px; object-fit:cover; border-radius:4px; background:#f5f5f7; flex-shrink:0; border:1px solid var(--a-line); }
  .mo-pages { font-size:11.5px; color:var(--a-mute2); }
  .mo-input { font-family: 'JetBrains Mono', monospace; font-size:12.5px; }
  .mo-help { padding:14px 16px; background:#f0f7ff; border-left:3px solid var(--a-accent); border-radius:6px; margin-bottom:18px; font-size:13px; line-height:1.55; }
</style>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '图片替换', crumbs: '内容 / 图片替换' });
  if (!shell) return;

  async function load() {
    const data = await api('/api/media/overrides');
    return data;
  }

  function render(data) {
    const sources = data.sources || [];
    const overrides = data.overrides || {};
    const mappedCount = sources.filter((s) => s.overrideTo).length;

    shell.content.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>图片替换 <span style="font-weight:400; font-size:13px; color:var(--a-mute2);">${mappedCount}/${sources.length} 已映射</span></h2>
          <div style="display:flex; gap:8px;">
            <button class="btn btn--ghost btn--sm" id="rescan">↻ 重新扫描</button>
            <a class="btn btn--ghost btn--sm" href="/admin/media.html">媒体库 ↗</a>
          </div>
        </div>
        <div class="mo-help">
          <strong>怎么用？</strong>每条对应站点上的一张外部图片（多数是 Unsplash 占位）。点 <strong>"上传替换"</strong> → 选本地文件 → 自动上传 + 自动保存映射。所有页面下次刷新即可看到新图，无需改任何 HTML 或重启服务。<br>
          <span style="color:var(--a-mute2);">推荐尺寸：hero 1920×1080；卡片 1200×800；缩略图 600×400。建议 WebP/AVIF 质量 80。</span>
        </div>
        <div id="mo-list">
          ${sources.length ? sources.map((s) => `
            <div class="mo-row${s.overrideTo ? ' is-mapped' : ''}" data-src="${escapeHtml(s.url)}">
              <div style="display:flex; gap:12px; align-items:center;">
                <img class="mo-thumb" data-current-thumb src="${escapeHtml(s.overrideTo || s.url)}" alt="" loading="lazy" onerror="this.style.display='none'"/>
                <div class="mo-src">
                  <strong>${s.overrideTo ? '当前已替换为' : '外部 URL'}</strong>
                  <a href="${escapeHtml(s.overrideTo || s.url)}" target="_blank" style="color:var(--a-mute2);">${escapeHtml((s.overrideTo || s.url).length > 70 ? (s.overrideTo || s.url).slice(0, 67) + '...' : (s.overrideTo || s.url))}</a>
                  <div class="mo-pages">${s.count} 处引用 · ${s.files.slice(0, 3).map((f) => escapeHtml(f)).join(', ')}${s.files.length > 3 ? ` 等 ${s.files.length} 个页面` : ''}</div>
                </div>
              </div>
              <div>
                <button type="button" class="btn btn--primary btn--sm" data-upload>📤 上传替换</button>
                <span class="mo-input-toggle" style="font-size:11.5px; color:var(--a-mute2); display:block; margin-top:8px; cursor:pointer;" data-toggle-input>或直接粘贴 URL ↓</span>
                <input class="mo-input" data-target value="${escapeHtml(s.overrideTo || '')}" placeholder="/uploads/your-photo.webp" style="display:none; margin-top:6px;"/>
              </div>
              <div style="text-align:right;">
                ${s.overrideTo ? '<button class="btn btn--ghost btn--sm" data-clear>清除</button>' : ''}
              </div>
            </div>
          `).join('') : '<div class="empty">扫描没有发现外部图片。</div>'}
        </div>
        <div class="form-actions" style="position:sticky; bottom:0; background:#fff; border-top:1px solid var(--a-line); padding-top:16px; z-index:10;">
          <span style="font-size:12.5px; color:var(--a-mute2);">点 <strong>上传替换</strong> 即时生效，无需点保存。批量编辑 URL 后可点这里：</span>
          <button class="btn btn--ghost" id="save">仅保存 URL 改动</button>
        </div>
      </div>
    `;

    // Per-row "upload to replace" button: opens file picker, uploads to
    // /api/media, immediately saves the mapping for that one URL pair,
    // and updates the thumbnail in place. No URL pasting required.
    document.querySelectorAll('[data-upload]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.mo-row');
        const sourceUrl = row.dataset.src;
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);
        fileInput.addEventListener('change', async () => {
          const file = fileInput.files && fileInput.files[0];
          fileInput.remove();
          if (!file) return;
          btn.disabled = true; btn.textContent = '上传中…';
          try {
            // 1) upload the file
            const fd = new FormData();
            fd.append('file', file);
            fd.append('alt_text', file.name.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' '));
            const up = await fetch('/api/media', { method: 'POST', credentials: 'include', body: fd });
            const upJson = await up.json();
            if (!up.ok || !upJson.url) throw new Error(upJson.error || ('HTTP ' + up.status));
            // 2) merge into the existing override map and save (one PUT
            //    so we don't lose any other rows the operator has edited)
            const cur = await api('/api/media/overrides');
            const map = Object.assign({}, cur.overrides || {});
            map[sourceUrl] = upJson.url;
            const save = await api('/api/media/overrides', { method: 'PUT', body: JSON.stringify({ overrides: map }) });
            // 3) reflect new state in this row without a full reload
            row.classList.add('is-mapped');
            const thumb = row.querySelector('[data-current-thumb]');
            if (thumb) { thumb.src = upJson.url; thumb.style.display = ''; }
            const inputEl = row.querySelector('[data-target]');
            if (inputEl) inputEl.value = upJson.url;
            const srcLink = row.querySelector('.mo-src strong');
            if (srcLink) srcLink.textContent = '当前已替换为';
            const link = row.querySelector('.mo-src a');
            if (link) { link.href = upJson.url; link.textContent = upJson.url; }
            // ensure a "清除" button exists
            const cell = row.querySelectorAll('div')[row.querySelectorAll('div').length - 1];
            if (cell && !cell.querySelector('[data-clear]')) {
              cell.innerHTML = '<button class="btn btn--ghost btn--sm" data-clear>清除</button>';
              cell.querySelector('[data-clear]').addEventListener('click', () => clearRow(row));
            }
            toast(`已替换：${file.name}（${(file.size/1024).toFixed(0)} KB）`, 'success');
          } catch (err) { toast('上传失败：' + err.message, 'error'); }
          finally { btn.disabled = false; btn.textContent = '📤 上传替换'; }
        });
        fileInput.click();
      });
    });

    document.querySelectorAll('[data-toggle-input]').forEach((el) => {
      el.addEventListener('click', () => {
        const inp = el.parentElement.querySelector('[data-target]');
        if (!inp) return;
        const showing = inp.style.display !== 'none';
        inp.style.display = showing ? 'none' : '';
        el.textContent = showing ? '或直接粘贴 URL ↓' : '收起 URL 输入 ↑';
        if (!showing) inp.focus();
      });
    });

    function clearRow(row) {
      row.classList.remove('is-mapped');
      const inp = row.querySelector('[data-target]');
      if (inp) inp.value = '';
      const thumb = row.querySelector('[data-current-thumb]');
      if (thumb) thumb.src = row.dataset.src;
      const lbl = row.querySelector('.mo-src strong');
      if (lbl) lbl.textContent = '外部 URL';
      const link = row.querySelector('.mo-src a');
      if (link) { link.href = row.dataset.src; link.textContent = row.dataset.src; }
    }
    document.querySelectorAll('[data-clear]').forEach((b) => {
      b.addEventListener('click', () => { clearRow(b.closest('.mo-row')); b.remove(); });
    });

    document.getElementById('rescan').addEventListener('click', async () => {
      try { const data = await load(); render(data); toast('已重新扫描', 'success'); }
      catch (err) { toast('扫描失败：' + err.message, 'error'); }
    });

    document.getElementById('save').addEventListener('click', async () => {
      const out = {};
      document.querySelectorAll('.mo-row').forEach((r) => {
        const src = r.dataset.src;
        const dst = r.querySelector('[data-target]').value.trim();
        if (src && dst) out[src] = dst;
      });
      try {
        const r = await api('/api/media/overrides', { method: 'PUT', body: JSON.stringify({ overrides: out }) });
        toast(`已保存 ${r.count} 条映射`, 'success');
        const data = await load();
        render(data);
      } catch (err) { toast('保存失败：' + err.message, 'error'); }
    });
  }

  try {
    const data = await load();
    render(data);
  } catch (err) {
    shell.content.innerHTML = `<div class="panel"><p style="color:var(--a-danger);">加载失败：${escapeHtml(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
