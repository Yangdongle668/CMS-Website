<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>页面构建器 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
<style>
  /* Full-bleed editor — replace admin shell content area with a 2-column
     layout: iframe (left, big) + side panel (right, narrow). */
  .pb2 { display: grid; grid-template-columns: 1fr 360px; gap: 0; height: calc(100vh - 100px); background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
  @media (max-width: 1100px) { .pb2 { grid-template-columns: 1fr 320px; } }

  /* Top toolbar inside the canvas */
  .pb2-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #e2e8f0; }
  .pb2-toolbar__title { font-size: 13px; font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 6px; }
  .pb2-toolbar__title small { color: #94a3b8; font-weight: 400; font-size: 11.5px; }
  .pb2-toolbar__center { flex: 1; display: flex; justify-content: center; gap: 4px; }
  .pb2-device {
    background: transparent; border: 1px solid transparent; padding: 6px 14px; font-size: 12.5px; border-radius: 999px; cursor: pointer; color: #64748b;
  }
  .pb2-device:hover { background: #f1f5f9; }
  .pb2-device.is-active { background: #0b3a82; color: #fff; }
  .pb2-toolbar__right { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .pb2-save { font-size: 11.5px; color: #94a3b8; }
  .pb2-save.is-dirty { color: #d97706; }
  .pb2-save.is-saving { color: #0b3a82; }
  .pb2-save.is-saved { color: #059669; }

  /* Canvas area + iframe wrapper */
  .pb2-canvas { display: flex; flex-direction: column; background: #f1f5f9; overflow: hidden; }
  .pb2-frame-wrap {
    flex: 1; display: flex; justify-content: center; align-items: flex-start;
    padding: 16px; overflow: auto; background: #f1f5f9;
  }
  .pb2-frame {
    background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(15,23,42,0.08);
    transition: width 0.25s ease, max-height 0.25s ease;
    overflow: hidden;
    height: 100%;
  }
  .pb2-frame iframe { width: 100%; height: 100%; border: none; display: block; }
  .pb2-frame--desktop { width: 100%; max-width: none; }
  .pb2-frame--tablet { width: 820px; max-width: 820px; height: 100%; }
  .pb2-frame--mobile { width: 390px; max-width: 390px; height: 100%; }

  /* Side panel */
  .pb2-side { background: #fff; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
  .pb2-side__tabs { display: flex; border-bottom: 1px solid #e2e8f0; }
  .pb2-side__tab { flex: 1; padding: 12px; background: transparent; border: none; cursor: pointer; font-size: 12px; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; }
  .pb2-side__tab.is-active { color: #0b3a82; border-bottom-color: #0b3a82; }
  .pb2-side__body { flex: 1; overflow-y: auto; padding: 16px; }
  .pb2-side__heading { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #0f172a; }
  .pb2-side__heading .ic { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: #eff6ff; color: #0b3a82; border-radius: 5px; font-size: 13px; }

  /* Empty side panel state */
  .pb2-side__empty { text-align: center; padding: 40px 16px; color: #94a3b8; font-size: 13px; }

  /* Library grid (in side panel) */
  .pb2-lib { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pb2-lib__item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.12s; }
  .pb2-lib__item:hover { transform: translateY(-2px); border-color: #0b3a82; background: #eff6ff; }
  .pb2-lib__icon { font-size: 22px; color: #0b3a82; line-height: 1; }
  .pb2-lib__label { font-size: 11.5px; font-weight: 600; text-align: center; color: #0f172a; }

  /* Form fields */
  .pb2-form__field { margin-bottom: 14px; }
  .pb2-form__field label { display: block; font-size: 11.5px; font-weight: 600; color: #475569; margin-bottom: 4px; }
  .pb2-form__field input[type="text"], .pb2-form__field input[type="url"], .pb2-form__field input[type="number"], .pb2-form__field textarea, .pb2-form__field select {
    width: 100%; padding: 7px 10px; font-size: 12.5px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; font-family: inherit;
  }
  .pb2-form__field textarea { resize: vertical; min-height: 60px; }
  .pb2-form__field .hint { display: block; font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .pb2-form__field--image { display: flex; gap: 6px; }
  .pb2-form__field--image input { flex: 1; }
  .pb2-form__field--image button { padding: 6px 10px; background: #eff6ff; color: #0b3a82; border: 1px solid #bfdbfe; border-radius: 5px; cursor: pointer; font-size: 11.5px; }
  .pb2-form__image-preview { width: 100%; height: 80px; background: #f1f5f9 center / cover no-repeat; border-radius: 5px; margin-top: 6px; display: none; }
  .pb2-form__image-preview.has-image { display: block; }

  .pb2-form__note { font-size: 11.5px; color: #64748b; padding: 8px 10px; background: #f1f5f9; border-radius: 5px; margin-bottom: 14px; line-height: 1.45; }
  .pb2-form__note strong { color: #0b3a82; }

  /* Repeater + table */
  .pb2-rep__item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 8px; margin-bottom: 6px; position: relative; }
  .pb2-rep__item-remove { position: absolute; top: 4px; right: 4px; background: transparent; border: none; color: #94a3b8; cursor: pointer; padding: 0 4px; font-size: 13px; }
  .pb2-rep__add { background: transparent; border: 1px dashed #cbd5e1; padding: 6px; width: 100%; border-radius: 5px; color: #64748b; cursor: pointer; font-size: 11.5px; }
  .pb2-tbl table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .pb2-tbl th, .pb2-tbl td { border: 1px solid #e2e8f0; padding: 1px; }
  .pb2-tbl input { width: 100%; padding: 3px 5px; border: none; font-size: 11.5px; background: transparent; }
  .pb2-tbl input:focus { outline: 1px solid #0b3a82; background: #fff; }
  .pb2-tbl__btns { display: flex; gap: 4px; margin-top: 6px; }
  .pb2-tbl__btns button { background: #eff6ff; border: 1px solid #bfdbfe; padding: 3px 8px; border-radius: 4px; font-size: 11px; color: #0b3a82; cursor: pointer; }

  /* Insert-block popover anchored to iframe */
  .pb2-insert-pop { position: absolute; z-index: 50; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); padding: 12px; width: 320px; }
  .pb2-insert-pop__title { font-size: 12px; font-weight: 700; color: #475569; margin: 0 0 8px; }
  .pb2-insert-pop .pb2-lib { gap: 6px; }
  .pb2-insert-pop .pb2-lib__item { padding: 10px 6px; }
</style>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, bootShell, toast } = window.AdminAPI;

  const pageId = parseInt(new URLSearchParams(location.search).get('page') || '0', 10);
  if (!pageId) {
    document.body.innerHTML = '<p style="padding:40px;">缺少 ?page=&lt;id&gt; 参数。回到 <a href="/admin/pages.html">页面列表</a>。</p>';
    return;
  }

  // Load page info for slug
  let pageInfo = null;
  try {
    const r = await api('/api/pages/admin');
    pageInfo = r.items.find((p) => p.id === pageId);
  } catch (_) {}

  const shell = await bootShell({
    title: '搭积木：' + (pageInfo ? pageInfo.title || pageInfo.slug : '#' + pageId),
    crumbs: '内容 / 页面 / 构建器',
  });
  if (!shell) return;

  shell.actions.innerHTML = `<a class="btn btn--ghost btn--sm" href="/admin/pages.html">返回列表</a>`;

  // ----- Load block types + current blocks in parallel -----
  const [typesResp, blocksResp] = await Promise.all([
    api('/api/blocks/types'),
    api('/api/blocks/page/' + pageId),
  ]);
  const TYPES = typesResp.types;
  const typeMap = Object.fromEntries(TYPES.map((t) => [t.id, t]));
  let blocks = blocksResp.items;
  let selectedId = null;
  let activeTab = 'settings';   // settings | library
  let device = 'desktop';

  const slug = pageInfo && pageInfo.slug ? pageInfo.slug : '';
  const iframeSrc = (slug ? '/' + slug : '/' + pageId) + '?builder=1&_t=' + Date.now();

  shell.content.innerHTML = `
    <div class="pb2">
      <div class="pb2-canvas">
        <div class="pb2-toolbar">
          <div class="pb2-toolbar__title">
            🧱 ${escapeHtml(pageInfo ? pageInfo.title || pageInfo.slug : '#' + pageId)}
            <small>(${blocks.length} 区块)</small>
          </div>
          <div class="pb2-toolbar__center">
            <button class="pb2-device is-active" data-device="desktop">🖥 桌面</button>
            <button class="pb2-device" data-device="tablet">◽ 平板</button>
            <button class="pb2-device" data-device="mobile">📱 手机</button>
          </div>
          <div class="pb2-toolbar__right">
            <span class="pb2-save" id="save-status">✓ 已加载</span>
            <a class="btn btn--ghost btn--sm" href="/${escapeHtml(slug)}" target="_blank">前台查看 ↗</a>
          </div>
        </div>
        <div class="pb2-frame-wrap">
          <div class="pb2-frame pb2-frame--desktop" id="frame-wrap">
            <iframe id="canvas" src="${escapeHtml(iframeSrc)}"></iframe>
          </div>
        </div>
      </div>
      <div class="pb2-side">
        <div class="pb2-side__tabs">
          <button class="pb2-side__tab is-active" data-tab="settings">⚙ 当前区块</button>
          <button class="pb2-side__tab" data-tab="library">＋ 区块库</button>
        </div>
        <div class="pb2-side__body" id="side-body"></div>
      </div>
    </div>
  `;

  const sideBody = document.getElementById('side-body');
  const saveStatus = document.getElementById('save-status');
  const frameWrap = document.getElementById('frame-wrap');
  const iframe = document.getElementById('canvas');

  function setStatus(state, text) {
    saveStatus.className = 'pb2-save is-' + state;
    saveStatus.textContent = text;
  }

  // ----- Postmessage protocol -----
  function postToFrame(type, payload) {
    iframe.contentWindow.postMessage(Object.assign({ source: 'cms-builder-parent', type }, payload || {}), '*');
  }

  window.addEventListener('message', async (ev) => {
    const m = ev.data;
    if (!m || m.source !== 'cms-builder') return;
    switch (m.type) {
      case 'ready':
        // Iframe finished bootstrap. If we have a selectedId (after reload), re-select.
        if (selectedId) postToFrame('select-block', { id: selectedId });
        break;
      case 'block-selected':
        selectedId = m.id;
        activeTab = 'settings';
        renderSide();
        break;
      case 'block-deselected':
        selectedId = null;
        renderSide();
        break;
      case 'block-edit-partial':
        await applyPartialEdit(m.id, m.fields);
        break;
      case 'block-action':
        await runBlockAction(m.id, m.action);
        break;
      case 'insert-request':
        showInsertPopover(m.ref_id, m.position);
        break;
    }
  });

  // ----- Block writes -----
  async function applyPartialEdit(id, fields) {
    const block = blocks.find((b) => b.id === id);
    if (!block) return;
    Object.assign(block.content, fields);
    setStatus('saving', '保存中…');
    try {
      await api('/api/blocks/' + id, { method: 'PUT', body: JSON.stringify({ content: block.content }) });
      setStatus('saved', '✓ 已保存');
      postToFrame('block-saved');
      if (activeTab === 'settings' && selectedId === id) renderSide();   // refresh side fields
    } catch (e) {
      setStatus('dirty', '保存失败：' + e.message);
    }
  }

  async function runBlockAction(id, action) {
    const idx = blocks.findIndex((b) => b.id === id);
    if (idx < 0) return;
    if (action === 'delete') {
      if (!confirm('删除这个区块？')) return;
      try {
        await api('/api/blocks/' + id, { method: 'DELETE' });
        blocks.splice(idx, 1);
        selectedId = null;
        reloadFrame();
      } catch (e) { alert('删除失败：' + e.message); }
    } else if (action === 'hide') {
      const b = blocks[idx];
      try {
        await api('/api/blocks/' + id, { method: 'PUT', body: JSON.stringify({ is_visible: !b.is_visible }) });
        b.is_visible = !b.is_visible;
        reloadFrame();
      } catch (e) { alert('失败：' + e.message); }
    } else if (action === 'up' || action === 'down') {
      const target = action === 'up' ? idx - 1 : idx + 1;
      if (target < 0 || target >= blocks.length) return;
      [blocks[idx], blocks[target]] = [blocks[target], blocks[idx]];
      const orderedIds = blocks.map((b) => b.id);
      try {
        await api('/api/blocks/reorder', { method: 'POST', body: JSON.stringify({ page_id: pageId, ordered_ids: orderedIds }) });
        reloadFrame();
      } catch (e) { alert('排序失败：' + e.message); }
    } else if (action === 'duplicate') {
      const orig = blocks[idx];
      try {
        const r = await api('/api/blocks', {
          method: 'POST',
          body: JSON.stringify({ page_id: pageId, block_type: orig.block_type, content: JSON.parse(JSON.stringify(orig.content || {})) }),
        });
        // Place duplicate right after the original
        const newId = r.id;
        const newBlock = r;
        // Reorder so the new block is at idx+1
        const orderedIds = blocks.map((b) => b.id);
        orderedIds.splice(idx + 1, 0, newId);
        await api('/api/blocks/reorder', { method: 'POST', body: JSON.stringify({ page_id: pageId, ordered_ids: orderedIds }) });
        // Reload blocks from server to keep state aligned
        const fresh = await api('/api/blocks/page/' + pageId);
        blocks = fresh.items;
        selectedId = newId;
        reloadFrame();
      } catch (e) { alert('复制失败：' + e.message); }
    }
  }

  async function addBlockAt(type, refId, position) {
    try {
      const r = await api('/api/blocks', { method: 'POST', body: JSON.stringify({ page_id: pageId, block_type: type }) });
      // r is appended to end. If we want it elsewhere, reorder.
      blocks.push(r);
      if (refId) {
        const refIdx = blocks.findIndex((b) => b.id === refId);
        const targetIdx = position === 'before' ? refIdx : refIdx + 1;
        // Move r from end to targetIdx
        const moved = blocks.pop();
        blocks.splice(targetIdx, 0, moved);
        await api('/api/blocks/reorder', {
          method: 'POST',
          body: JSON.stringify({ page_id: pageId, ordered_ids: blocks.map((b) => b.id) }),
        });
      }
      // Refresh authoritative state
      const fresh = await api('/api/blocks/page/' + pageId);
      blocks = fresh.items;
      selectedId = r.id;
      reloadFrame();
    } catch (e) { alert('添加失败：' + e.message); }
  }

  function reloadFrame() {
    // Rebuild iframe src with new timestamp to bust any caching
    const newSrc = (slug ? '/' + slug : '/' + pageId) + '?builder=1&_t=' + Date.now();
    iframe.src = newSrc;
    updateCount();
  }

  function updateCount() {
    const el = document.querySelector('.pb2-toolbar__title small');
    if (el) el.textContent = `(${blocks.length} 区块)`;
  }

  // ----- Side panel rendering -----
  document.querySelectorAll('.pb2-side__tab').forEach((b) => {
    b.addEventListener('click', () => {
      activeTab = b.dataset.tab;
      document.querySelectorAll('.pb2-side__tab').forEach((x) => x.classList.toggle('is-active', x === b));
      renderSide();
    });
  });

  function renderSide() {
    if (activeTab === 'library') return renderLibrary();
    return renderSettings();
  }

  function renderLibrary() {
    sideBody.innerHTML = `
      <div class="pb2-form__note">
        点任一区块 → 加到当前页面末尾。可在 iframe 中拖拽 / 重排 / 点 + 在两个区块之间插入。
      </div>
      <div class="pb2-lib">
        ${TYPES.map((t) => `
          <div class="pb2-lib__item" data-type="${t.id}" title="${escapeHtml(t.description)}">
            <div class="pb2-lib__icon">${escapeHtml(t.icon)}</div>
            <div class="pb2-lib__label">${escapeHtml(t.label)}</div>
          </div>
        `).join('')}
      </div>
    `;
    sideBody.querySelectorAll('[data-type]').forEach((el) => {
      el.addEventListener('click', () => addBlockAt(el.dataset.type, null, 'end'));
    });
  }

  function renderSettings() {
    if (!selectedId) {
      sideBody.innerHTML = `
        <div class="pb2-side__empty">
          <p style="font-size:18px; margin:0 0 10px;">👆</p>
          <p>点击左侧画布上的任一区块开始编辑</p>
          <p style="margin-top:10px;"><strong style="color:#0b3a82;">提示：</strong>直接在画布上点标题/段落即可输入</p>
          <p style="margin-top:14px; font-size:11.5px;">没有区块？切到 <strong>＋ 区块库</strong> 添加一个</p>
        </div>
      `;
      return;
    }
    const block = blocks.find((b) => b.id === selectedId);
    if (!block) { sideBody.innerHTML = '<p style="padding:20px;">区块已删除</p>'; return; }
    const type = typeMap[block.block_type];
    if (!type) { sideBody.innerHTML = '<p>未知区块类型</p>'; return; }

    sideBody.innerHTML = `
      <h2 class="pb2-side__heading">
        <span class="ic">${escapeHtml(type.icon)}</span>
        ${escapeHtml(type.label)}
      </h2>
      <p class="pb2-form__note">
        <strong>提示：</strong>标题、副标题、按钮文字可以直接在左侧画布上点击编辑。
        这里管图片、下拉选项、列数、嵌套条目这种不适合 inline 的字段。
      </p>
      <div id="side-fields"></div>
    `;

    const fieldsEl = document.getElementById('side-fields');
    // Side panel only renders complex / non-inline fields
    type.schema.forEach((field) => {
      if (isInlineEditable(field, type)) return;
      fieldsEl.appendChild(renderField(field, block.content, block.id));
    });
  }

  // Which fields are also shown inline in the canvas (so we hide from side panel)
  function isInlineEditable(field, type) {
    if (field.type !== 'text' && field.type !== 'textarea') return false;
    const inlineNames = new Set(['title', 'subtitle', 'eyebrow', 'cta_text', 'secondary_cta_text', 'quote', 'author', 'company']);
    return inlineNames.has(field.name);
  }

  function renderField(field, content, blockId) {
    const wrap = document.createElement('div');
    wrap.className = 'pb2-form__field';
    const value = content[field.name];
    const labelHtml = `<label>${escapeHtml(field.label)}${field.required ? ' *' : ''}</label>`;

    function schedulePartial(val) {
      content[field.name] = val;
      debouncedPartial(blockId);
    }

    if (field.type === 'text' || field.type === 'url') {
      wrap.innerHTML = labelHtml + `<input type="${field.type === 'url' ? 'url' : 'text'}" maxlength="${field.max || 500}">`;
      const i = wrap.querySelector('input');
      i.value = value || '';
      i.addEventListener('input', () => schedulePartial(i.value));
    } else if (field.type === 'textarea') {
      wrap.innerHTML = labelHtml + `<textarea maxlength="${field.max || 5000}" rows="3"></textarea>`;
      const t = wrap.querySelector('textarea');
      t.value = value || '';
      t.addEventListener('input', () => schedulePartial(t.value));
    } else if (field.type === 'number') {
      wrap.innerHTML = labelHtml + `<input type="number" min="${field.min ?? 0}" max="${field.max ?? 9999}">`;
      const i = wrap.querySelector('input');
      i.value = value ?? '';
      i.addEventListener('input', () => schedulePartial(parseInt(i.value, 10) || 0));
    } else if (field.type === 'select') {
      const opts = (field.options || []).map((o) => `<option value="${escapeHtml(o)}" ${value === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
      wrap.innerHTML = labelHtml + `<select>${opts}</select>`;
      const s = wrap.querySelector('select');
      s.addEventListener('change', () => schedulePartial(s.value));
    } else if (field.type === 'image') {
      wrap.innerHTML = labelHtml + `
        <div class="pb2-form__field--image">
          <input type="text" placeholder="/uploads/... or https://..." maxlength="500">
          <button type="button" data-pick>媒体库</button>
        </div>
        <div class="pb2-form__image-preview"></div>
      `;
      const i = wrap.querySelector('input');
      const pv = wrap.querySelector('.pb2-form__image-preview');
      function syncPv() {
        if (i.value) { pv.style.backgroundImage = `url('${i.value}')`; pv.classList.add('has-image'); }
        else pv.classList.remove('has-image');
      }
      i.value = value || '';
      syncPv();
      i.addEventListener('input', () => { schedulePartial(i.value); syncPv(); });
      wrap.querySelector('[data-pick]').addEventListener('click', async () => {
        const url = await pickFromMedia();
        if (url) { i.value = url; schedulePartial(url); syncPv(); }
      });
    } else if (field.type === 'richtext') {
      wrap.innerHTML = labelHtml + `<textarea rows="10" style="font-family:'JetBrains Mono', monospace; font-size:11.5px;"></textarea>`;
      const t = wrap.querySelector('textarea');
      t.value = value || '';
      t.addEventListener('input', () => schedulePartial(t.value));
    } else if (field.type === 'checkbox') {
      wrap.innerHTML = `<label style="display:flex; gap:6px; align-items:center; font-size:12px;"><input type="checkbox"> ${escapeHtml(field.label)}</label>`;
      const cb = wrap.querySelector('input');
      cb.checked = !!value;
      cb.addEventListener('change', () => schedulePartial(cb.checked));
    } else if (field.type === 'repeater') {
      wrap.innerHTML = labelHtml;
      const rep = document.createElement('div');
      const items = Array.isArray(value) ? value : [];
      content[field.name] = items;
      function rebuild() {
        rep.innerHTML = items.map((_, idx) => `
          <div class="pb2-rep__item" data-idx="${idx}">
            <button type="button" class="pb2-rep__item-remove">×</button>
            <div data-rep-fields></div>
          </div>
        `).join('') + `<button type="button" class="pb2-rep__add">+ 添加条目</button>`;
        rep.querySelectorAll('.pb2-rep__item').forEach((w) => {
          const idx = parseInt(w.dataset.idx, 10);
          const inner = w.querySelector('[data-rep-fields]');
          field.fields.forEach((sf) => {
            inner.appendChild(renderField(sf, items[idx] = items[idx] || {}, blockId));
          });
          w.querySelector('.pb2-rep__item-remove').addEventListener('click', () => {
            items.splice(idx, 1); debouncedPartial(blockId); rebuild();
          });
        });
        rep.querySelector('.pb2-rep__add').addEventListener('click', () => {
          const blank = {}; field.fields.forEach((sf) => { blank[sf.name] = ''; });
          items.push(blank); debouncedPartial(blockId); rebuild();
        });
      }
      rebuild();
      wrap.appendChild(rep);
    } else if (field.type === 'table') {
      wrap.innerHTML = labelHtml;
      const tw = document.createElement('div');
      tw.className = 'pb2-tbl';
      const hk = field.headersKey || 'headers';
      const headers = Array.isArray(content[hk]) ? content[hk] : ['Col 1', 'Col 2'];
      const rows = Array.isArray(value) ? value : [];
      content[hk] = headers; content[field.name] = rows;
      function rebuild() {
        const ths = headers.map((h, i) => `<th><input data-h="${i}" value="${escapeHtml(h)}"></th>`).join('') + '<th style="width:24px;"></th>';
        const trs = rows.map((row, ri) => {
          const cells = headers.map((_, ci) => `<td><input data-r="${ri}" data-c="${ci}" value="${escapeHtml(row[ci] || '')}"></td>`).join('');
          return `<tr>${cells}<td style="text-align:center;"><button data-del="${ri}" style="border:none;background:transparent;cursor:pointer;color:#b91c1c;">×</button></td></tr>`;
        }).join('');
        tw.innerHTML = `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>
          <div class="pb2-tbl__btns">
            <button data-add-row>+ 行</button>
            <button data-add-col>+ 列</button>
          </div>`;
        tw.querySelectorAll('input[data-h]').forEach((i) => i.addEventListener('input', () => {
          headers[parseInt(i.dataset.h, 10)] = i.value; debouncedPartial(blockId);
        }));
        tw.querySelectorAll('input[data-r]').forEach((i) => i.addEventListener('input', () => {
          const r = parseInt(i.dataset.r, 10), c = parseInt(i.dataset.c, 10);
          rows[r] = rows[r] || []; rows[r][c] = i.value; debouncedPartial(blockId);
        }));
        tw.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
          rows.splice(parseInt(b.dataset.del, 10), 1); debouncedPartial(blockId); rebuild();
        }));
        tw.querySelector('[data-add-row]').addEventListener('click', () => {
          rows.push(headers.map(() => '')); debouncedPartial(blockId); rebuild();
        });
        tw.querySelector('[data-add-col]').addEventListener('click', () => {
          headers.push('Col ' + (headers.length + 1));
          rows.forEach((r) => r.push(''));
          debouncedPartial(blockId); rebuild();
        });
      }
      rebuild();
      wrap.appendChild(tw);
    }
    return wrap;
  }

  // ----- Debounced partial save (for side-panel edits) -----
  const partialTimers = new Map();
  function debouncedPartial(blockId) {
    setStatus('dirty', '未保存…');
    if (partialTimers.has(blockId)) clearTimeout(partialTimers.get(blockId));
    partialTimers.set(blockId, setTimeout(async () => {
      partialTimers.delete(blockId);
      const block = blocks.find((b) => b.id === blockId);
      if (!block) return;
      setStatus('saving', '保存中…');
      try {
        await api('/api/blocks/' + blockId, { method: 'PUT', body: JSON.stringify({ content: block.content }) });
        setStatus('saved', '✓ 已保存');
        reloadFrame();
      } catch (e) { setStatus('dirty', '失败：' + e.message); }
    }, 700));
  }

  // ----- Media picker -----
  function pickFromMedia() {
    return new Promise((resolve) => {
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:300;display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = `
        <div style="background:#fff;border-radius:10px;width:680px;max-width:92%;max-height:80vh;display:flex;flex-direction:column;">
          <div style="padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
            <strong>选择媒体</strong>
            <button style="border:none;background:transparent;font-size:20px;cursor:pointer;" data-close>×</button>
          </div>
          <div style="padding:14px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;" data-grid>加载中…</div>
        </div>
      `;
      ov.addEventListener('click', (ev) => {
        if (ev.target === ov || ev.target.matches('[data-close]')) { ov.remove(); resolve(null); }
      });
      document.body.appendChild(ov);
      api('/api/media?limit=60').then(({ items }) => {
        const g = ov.querySelector('[data-grid]');
        g.innerHTML = items.map((m) => `
          <div data-url="${escapeHtml(m.url)}" style="cursor:pointer;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden;background:#f8fafc;">
            ${m.mime && m.mime.startsWith('image/')
              ? `<div style="height:90px;background:#fff url('${escapeHtml(m.url)}') center/cover no-repeat;"></div>`
              : `<div style="height:90px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#64748b;">${escapeHtml(m.mime || 'file')}</div>`}
            <div style="padding:4px 6px;font-size:10.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(m.original || m.filename)}</div>
          </div>
        `).join('') || '<p>没有媒体。先到媒体库上传。</p>';
        g.querySelectorAll('[data-url]').forEach((el) => {
          el.addEventListener('click', () => { ov.remove(); resolve(el.dataset.url); });
        });
      });
    });
  }

  // ----- Insert-block popover -----
  function showInsertPopover(refId, position) {
    // Switch to library tab and scroll into view
    activeTab = 'library';
    document.querySelectorAll('.pb2-side__tab').forEach((x) => x.classList.toggle('is-active', x.dataset.tab === 'library'));
    sideBody.innerHTML = `
      <div class="pb2-form__note">
        在 <strong>${refId ? '指定位置' : '页面末尾'}</strong> 插入一个新区块。点选要添加的类型：
      </div>
      <div class="pb2-lib">
        ${TYPES.map((t) => `
          <div class="pb2-lib__item" data-type="${t.id}" title="${escapeHtml(t.description)}">
            <div class="pb2-lib__icon">${escapeHtml(t.icon)}</div>
            <div class="pb2-lib__label">${escapeHtml(t.label)}</div>
          </div>
        `).join('')}
      </div>
    `;
    sideBody.querySelectorAll('[data-type]').forEach((el) => {
      el.addEventListener('click', () => {
        addBlockAt(el.dataset.type, refId, position);
        activeTab = 'settings';
        document.querySelectorAll('.pb2-side__tab').forEach((x) => x.classList.toggle('is-active', x.dataset.tab === 'settings'));
      });
    });
  }

  // ----- Device toggle -----
  document.querySelectorAll('.pb2-device').forEach((btn) => {
    btn.addEventListener('click', () => {
      device = btn.dataset.device;
      document.querySelectorAll('.pb2-device').forEach((b) => b.classList.toggle('is-active', b === btn));
      frameWrap.classList.remove('pb2-frame--desktop', 'pb2-frame--tablet', 'pb2-frame--mobile');
      frameWrap.classList.add('pb2-frame--' + device);
    });
  });

  // Initial render
  renderSide();
})();
</script>
</body>
