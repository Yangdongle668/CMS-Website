<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>支柱页 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script src="/admin/assets/js/image-picker.js"></script>
<script src="/admin/assets/js/iframe-text-editor.js"></script>
<script src="/admin/assets/js/seo-panel.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '支柱页', crumbs: '内容 / 支柱页' });
  if (!shell) return;
  let heroPicker = null;

  const wantSlug = new URLSearchParams(location.search).get('slug');

  const { items } = await api('/api/pillars?status=all');

  shell.content.innerHTML = `
    <div class="panel" id="list-panel">
      <div class="panel__head">
        <h2>支柱页</h2>
        <p class="muted" style="font-size:12.5px; margin:0; color:var(--a-mute2);">编辑 each pillar's hero, variants, spec table, FAQ and customisation block.</p>
      </div>
      <table class="table">
        <thead><tr><th>名称</th><th>Slug</th><th>排序</th><th>状态</th><th>更新于</th><th></th></tr></thead>
        <tbody>
          ${items.map((p) => `
            <tr>
              <td><strong>${escapeHtml(p.name)}</strong><div style="font-size:12px; color:var(--a-mute2);">${escapeHtml(p.short_name)}</div></td>
              <td><span class="mono">${escapeHtml(p.slug)}</span></td>
              <td>${p.sort_order}</td>
              <td><span class="pill pill--${p.status}">${p.status}</span></td>
              <td>${new Date(p.updated_at).toLocaleDateString()}</td>
              <td><a class="btn btn--ghost btn--sm" href="?slug=${encodeURIComponent(p.slug)}">编辑</a> <a class="btn btn--ghost btn--sm" href="/products/${encodeURIComponent(p.slug)}" target="_blank">View ↗</a></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div id="edit-panel"></div>
  `;

  if (wantSlug) {
    const p = items.find((x) => x.slug === wantSlug);
    if (p) renderEditor(p);
  }

  function renderEditor(p) {
    document.getElementById('list-panel').style.display = 'none';
    const panel = document.getElementById('edit-panel');
    const previewUrl = '/products/' + encodeURIComponent(p.slug);
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>正在编辑： ${escapeHtml(p.name)}</h2>
          <div style="display:flex; gap:8px;">
            <a target="_blank" class="btn btn--primary btn--sm" href="/admin/visual-edit.html?url=${encodeURIComponent(previewUrl)}&back=${encodeURIComponent(location.pathname + location.search)}">🎨 可视化编辑 ↗</a>
            <a href="${previewUrl}" target="_blank" class="btn btn--ghost btn--sm">预览 ↗</a>
            <a href="/admin/pillars.html" class="btn btn--ghost btn--sm">返回列表</a>
          </div>
        </div>

        <div class="page-editor-fullform">
          <div class="page-editor-form">
        <div class="tabs" id="tabs">
          <button class="tabs__btn is-active" data-tab="general">基本</button>
          <button class="tabs__btn" data-tab="hero">Hero</button>
          <button class="tabs__btn" data-tab="overview">概述</button>
          <button class="tabs__btn" data-tab="variants">变体</button>
          <button class="tabs__btn" data-tab="specs">规格表</button>
          <button class="tabs__btn" data-tab="custom">定制项</button>
          <button class="tabs__btn" data-tab="mfg">制造</button>
          <button class="tabs__btn" data-tab="certs">认证</button>
          <button class="tabs__btn" data-tab="apps">应用</button>
          <button class="tabs__btn" data-tab="faq">FAQ</button>
          <button class="tabs__btn" data-tab="seo">SEO</button>
        </div>

        <div data-pane="general">
          <div class="field"><label>名称</label><input id="f-name" value="${escapeHtml(p.name)}"/></div>
          <div class="field"><label>短名称 <span class="hint">（用于导航和面包屑）</span></label><input id="f-short" value="${escapeHtml(p.short_name)}"/></div>
          <div class="field-row">
            <div class="field"><label>排序</label><input id="f-sort" type="number" value="${p.sort_order}"/></div>
            <div class="field"><label>状态</label><select id="f-status"><option value="published" ${p.status === 'published' ? 'selected' : ''}>已发布</option><option value="draft" ${p.status === 'draft' ? 'selected' : ''}>草稿</option></select></div>
          </div>
        </div>

        <div data-pane="hero" style="display:none;">
          <div class="field"><label>Eyebrow（标题前小字）</label><input id="f-eyebrow" value="${escapeHtml(p.hero_eyebrow)}"/></div>
          <div class="field"><label>标题 (H1)</label><input id="f-htitle" value="${escapeHtml(p.hero_title)}"/></div>
          <div class="field"><label>副标题</label><textarea id="f-hsub">${escapeHtml(p.hero_subtitle)}</textarea></div>
          <div class="field"><label>Hero 大图</label><div id="f-himg-mount"></div></div>
          <div class="field-row">
            <div class="field"><label>主 CTA 文字</label><input id="f-cta1t" value="${escapeHtml(p.primary_cta_text)}"/></div>
            <div class="field"><label>主 CTA 链接</label><input id="f-cta1l" value="${escapeHtml(p.primary_cta_link)}"/></div>
          </div>
          <div class="field-row">
            <div class="field"><label>次 CTA 文字</label><input id="f-cta2t" value="${escapeHtml(p.secondary_cta_text)}"/></div>
            <div class="field"><label>次 CTA 链接</label><input id="f-cta2l" value="${escapeHtml(p.secondary_cta_link)}"/></div>
          </div>
        </div>

        <div data-pane="overview" style="display:none;">
          <div class="field"><label>区块标题</label><input id="f-ovt" value="${escapeHtml((p.overview && p.overview.title) || '')}"/></div>
          <div class="field"><label>正文</label><textarea id="f-ovb" rows="6">${escapeHtml((p.overview && p.overview.body) || '')}</textarea></div>
        </div>

        <div data-pane="variants" style="display:none;">
          <div class="repeat-list" data-repeat="variants"></div>
          <button class="repeat-add" data-repeat-add="variants">+ 添加变体</button>
        </div>

        <div data-pane="specs" style="display:none;">
          <div class="field"><label>表头（逗号分隔）</label><input id="f-spec-headers" value="${escapeHtml((p.spec_table && p.spec_table.headers || []).join(', '))}"/></div>
          <div class="field"><label>Rows <span class="hint">（每行一条，列用 | 分隔）</span></label>
            <textarea id="f-spec-rows" rows="12">${escapeHtml((p.spec_table && p.spec_table.rows || []).map((r) => r.join(' | ')).join('\n'))}</textarea>
          </div>
        </div>

        <div data-pane="custom" style="display:none;">
          <div class="field field--check"><input type="checkbox" id="f-cust-on" ${(p.customization && p.customization.enabled) ? 'checked' : ''}/><label for="f-cust-on">在此支柱页显示定制项区块</label></div>
          <div class="repeat-list" data-repeat="customization"></div>
          <button class="repeat-add" data-repeat-add="customization">+ 添加定制项</button>
        </div>

        <div data-pane="mfg" style="display:none;">
          <div class="field"><label>Title</label><input id="f-mfgt" value="${escapeHtml((p.manufacturing && p.manufacturing.title) || '')}"/></div>
          <div class="field"><label>正文</label><textarea id="f-mfgb" rows="5">${escapeHtml((p.manufacturing && p.manufacturing.body) || '')}</textarea></div>
        </div>

        <div data-pane="certs" style="display:none;">
          <div class="repeat-list" data-repeat="certifications"></div>
          <button class="repeat-add" data-repeat-add="certifications">+ 添加认证</button>
        </div>

        <div data-pane="apps" style="display:none;">
          <div class="field"><label>应用 slug 列表 <span class="hint">（逗号分隔，需与应用行业模块的 slug 一致）</span></label><input id="f-apps" value="${escapeHtml((p.applications || []).join(', '))}"/></div>
        </div>

        <div data-pane="faq" style="display:none;">
          <div class="repeat-list" data-repeat="faq"></div>
          <button class="repeat-add" data-repeat-add="faq">+ 添加 FAQ</button>
        </div>

        <div data-pane="seo" style="display:none;">
          <div class="field"><label>Meta 标题</label><input id="f-mt" value="${escapeHtml(p.meta_title)}"/></div>
          <div class="field"><label>Meta 描述</label><textarea id="f-md" rows="3">${escapeHtml(p.meta_description)}</textarea></div>
          <div class="field"><label>锚文本变体 <span class="hint">（逗号分隔）</span></label><input id="f-anchors" value="${escapeHtml((p.anchor_variants || []).join(', '))}"/></div>
          <div id="f-seo-mount"></div>
        </div>

        <div class="form-actions">
          <button class="btn" id="save">保存修改</button>
          <a href="/admin/pillars.html" class="btn btn--ghost">取消</a>
          <a target="_blank" class="btn btn--ghost" href="/admin/visual-edit.html?url=${encodeURIComponent(previewUrl)}&back=${encodeURIComponent(location.pathname + location.search)}">🎨 进入可视化编辑 ↗</a>
        </div>
          </div><!-- /.page-editor-form -->
        </div><!-- /.page-editor-fullform -->
      </div>
    `;

    // Hero image picker (replaces the plain URL input).
    try {
      heroPicker = window.ImagePicker.mount('f-himg-mount', {
        initialUrl: p.hero_image || '',
      });
    } catch (err) {
      const host = panel.querySelector('#f-himg-mount');
      if (host) host.innerHTML = `<input id="f-himg-fallback" value="${escapeHtml(p.hero_image || '')}" placeholder="/uploads/hero.webp"/>`;
    }

    // (visual preview + click-to-replace-image + click-to-edit-text now
    // live in the dedicated /admin/visual-edit.html full-screen page,
    // opened via the "可视化编辑" button at the top of this form.)

    // Tabs
    panel.querySelectorAll('.tabs__btn').forEach((b) => b.addEventListener('click', () => {
      panel.querySelectorAll('.tabs__btn').forEach((x) => x.classList.toggle('is-active', x === b));
      panel.querySelectorAll('[data-pane]').forEach((x) => x.style.display = x.dataset.pane === b.dataset.tab ? '' : 'none');
    }));

    // SEO panel — RankMath-style
    let seoPanel = null;
    try {
      seoPanel = window.SEOPanel.mount('f-seo-mount', {
        entity: 'pillar',
        siteHost: location.host,
        initial: p,
        getContext: () => ({
          title: (panel.querySelector('#f-mt') || {}).value
                 || (panel.querySelector('#f-htitle') || {}).value
                 || p.name || '',
          description: (panel.querySelector('#f-md') || {}).value
                       || (panel.querySelector('#f-hsub') || {}).value || '',
          slug: 'products/' + p.slug,
          // Pillar pages don't have a single body field — concat overview
          // body + manufacturing body + each FAQ answer for word-count check.
          body: [(panel.querySelector('#f-ovb') || {}).value, (panel.querySelector('#f-mfgb') || {}).value,
                 ...Array.from(panel.querySelectorAll('[data-repeat="faq"] [data-field="a"]')).map((i) => i.value)]
                .join(' '),
          coverUrl: heroPicker ? heroPicker.getValue() : (p.hero_image || ''),
        }),
      });
    } catch (err) {
      const host = document.getElementById('f-seo-mount');
      if (host) host.innerHTML = '<p style="color:var(--a-mute2); font-size:12px;">SEO 面板加载失败：' + escapeHtml(err.message) + '</p>';
    }
    panel.addEventListener('input', () => seoPanel && seoPanel.repaint());

    // Repeaters
    function renderRepeater(name, list, fields) {
      const wrap = panel.querySelector(`[data-repeat="${name}"]`);
      wrap.innerHTML = list.map((item, idx) => `
        <div class="repeat-item" data-idx="${idx}">
          <button class="repeat-item__remove" data-remove="${idx}">Remove</button>
          ${fields.map((f) => `<div class="field"><label>${f.label}</label><input data-field="${f.key}" value="${escapeHtml(item[f.key] || '')}"/></div>`).join('')}
        </div>
      `).join('');
      wrap.querySelectorAll('[data-remove]').forEach((b) => b.addEventListener('click', () => {
        const i = parseInt(b.dataset.remove, 10);
        list.splice(i, 1);
        renderRepeater(name, list, fields);
      }));
      panel.querySelector(`[data-repeat-add="${name}"]`).onclick = () => {
        const empty = {};
        fields.forEach((f) => empty[f.key] = '');
        list.push(empty);
        renderRepeater(name, list, fields);
      };
    }
    const variantsList = Array.isArray(p.variants) ? p.variants.slice() : [];
    const customList = Array.isArray(p.customization && p.customization.items) ? p.customization.items.slice() : [];
    const certList = Array.isArray(p.certifications) ? p.certifications.slice() : [];
    const faqList = Array.isArray(p.faq) ? p.faq.slice() : [];
    renderRepeater('variants', variantsList, [{ key: 'name', label: '名称' }, { key: 'summary', label: '摘要' }, { key: 'image', label: '图片 URL' }]);
    renderRepeater('customization', customList, [{ key: 'label', label: '标签' }, { key: 'value', label: '值' }]);
    renderRepeater('certifications', certList, [{ key: 'name', label: '名称' }, { key: 'image', label: '图片 URL' }]);
    renderRepeater('faq', faqList, [{ key: 'q', label: '问题' }, { key: 'a', label: '答案' }]);

    // 保存
    panel.querySelector('#save').addEventListener('click', async () => {
      const collect = (selector) => Array.from(panel.querySelectorAll(`[data-repeat="${selector}"] .repeat-item`)).map((row) => {
        const obj = {};
        row.querySelectorAll('[data-field]').forEach((inp) => { obj[inp.dataset.field] = inp.value; });
        return obj;
      });
      const headers = panel.querySelector('#f-spec-headers').value.split(',').map((s) => s.trim()).filter(Boolean);
      const rows = panel.querySelector('#f-spec-rows').value.split('\n').map((line) => line.split('|').map((c) => c.trim())).filter((r) => r.some(Boolean));
      const apps = panel.querySelector('#f-apps').value.split(',').map((s) => s.trim()).filter(Boolean);
      const anchors = panel.querySelector('#f-anchors').value.split(',').map((s) => s.trim()).filter(Boolean);

      const seoVals = seoPanel ? seoPanel.getValues() : {};
      const payload = Object.assign({
        name: panel.querySelector('#f-name').value,
        short_name: panel.querySelector('#f-short').value,
        sort_order: parseInt(panel.querySelector('#f-sort').value, 10) || 0,
        status: panel.querySelector('#f-status').value,
        hero_eyebrow: panel.querySelector('#f-eyebrow').value,
        hero_title: panel.querySelector('#f-htitle').value,
        hero_subtitle: panel.querySelector('#f-hsub').value,
        hero_image: heroPicker ? heroPicker.getValue() : (panel.querySelector('#f-himg-fallback') ? panel.querySelector('#f-himg-fallback').value : (p.hero_image || '')),
        primary_cta_text: panel.querySelector('#f-cta1t').value,
        primary_cta_link: panel.querySelector('#f-cta1l').value,
        secondary_cta_text: panel.querySelector('#f-cta2t').value,
        secondary_cta_link: panel.querySelector('#f-cta2l').value,
        overview: { title: panel.querySelector('#f-ovt').value, body: panel.querySelector('#f-ovb').value },
        variants: collect('variants'),
        spec_table: { headers, rows },
        applications: apps,
        customization: { enabled: panel.querySelector('#f-cust-on').checked, items: collect('customization') },
        manufacturing: { title: panel.querySelector('#f-mfgt').value, body: panel.querySelector('#f-mfgb').value },
        certifications: collect('certifications'),
        faq: collect('faq'),
        anchor_variants: anchors,
        meta_title: panel.querySelector('#f-mt').value,
        meta_description: panel.querySelector('#f-md').value,
      }, seoVals);
      try {
        await api('/api/pillars/' + p.id, { method: 'PUT', body: JSON.stringify(payload) });
        toast('支柱页已保存', 'success');
      } catch (err) {
        toast('保存失败: ' + err.message, 'error');
      }
    });
  }
})();
</script>
</body>
</html>
