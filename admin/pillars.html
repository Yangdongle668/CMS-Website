<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Pillar Pages | Acme CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: 'Pillar Pages', crumbs: 'Content / Pillar pages' });
  if (!shell) return;

  const wantSlug = new URLSearchParams(location.search).get('slug');

  const { items } = await api('/api/pillars?status=all');

  shell.content.innerHTML = `
    <div class="panel" id="list-panel">
      <div class="panel__head">
        <h2>Pillar Pages</h2>
        <p class="muted" style="font-size:12.5px; margin:0; color:var(--a-mute2);">Edit each pillar's hero, variants, spec table, FAQ and customisation block.</p>
      </div>
      <table class="table">
        <thead><tr><th>Name</th><th>Slug</th><th>Sort</th><th>Status</th><th>Updated</th><th></th></tr></thead>
        <tbody>
          ${items.map((p) => `
            <tr>
              <td><strong>${escapeHtml(p.name)}</strong><div style="font-size:12px; color:var(--a-mute2);">${escapeHtml(p.short_name)}</div></td>
              <td><span class="mono">${escapeHtml(p.slug)}</span></td>
              <td>${p.sort_order}</td>
              <td><span class="pill pill--${p.status}">${p.status}</span></td>
              <td>${new Date(p.updated_at).toLocaleDateString()}</td>
              <td><a class="btn btn--ghost btn--sm" href="?slug=${encodeURIComponent(p.slug)}">Edit</a> <a class="btn btn--ghost btn--sm" href="/products/${encodeURIComponent(p.slug)}" target="_blank">View ↗</a></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div id="edit-panel"></div>
  `;

  if (wantSlug) {
    const p = items.find((x) => x.slug === wantSlug);
    if (p) renderEditor(p);
  }

  function renderEditor(p) {
    document.getElementById('list-panel').style.display = 'none';
    const panel = document.getElementById('edit-panel');
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>Editing: ${escapeHtml(p.name)}</h2>
          <div style="display:flex; gap:8px;">
            <a href="/products/${encodeURIComponent(p.slug)}" target="_blank" class="btn btn--ghost btn--sm">Preview ↗</a>
            <a href="/admin/pillars.html" class="btn btn--ghost btn--sm">Back to list</a>
          </div>
        </div>
        <div class="tabs" id="tabs">
          <button class="tabs__btn is-active" data-tab="general">General</button>
          <button class="tabs__btn" data-tab="hero">Hero</button>
          <button class="tabs__btn" data-tab="overview">Overview</button>
          <button class="tabs__btn" data-tab="variants">Variants</button>
          <button class="tabs__btn" data-tab="specs">Spec Table</button>
          <button class="tabs__btn" data-tab="custom">Customisation</button>
          <button class="tabs__btn" data-tab="mfg">Manufacturing</button>
          <button class="tabs__btn" data-tab="certs">Certifications</button>
          <button class="tabs__btn" data-tab="apps">Applications</button>
          <button class="tabs__btn" data-tab="faq">FAQ</button>
          <button class="tabs__btn" data-tab="seo">SEO</button>
        </div>

        <div data-pane="general">
          <div class="field"><label>Name</label><input id="f-name" value="${escapeHtml(p.name)}"/></div>
          <div class="field"><label>Short name <span class="hint">(used in nav & breadcrumbs)</span></label><input id="f-short" value="${escapeHtml(p.short_name)}"/></div>
          <div class="field-row">
            <div class="field"><label>Sort order</label><input id="f-sort" type="number" value="${p.sort_order}"/></div>
            <div class="field"><label>Status</label><select id="f-status"><option value="published" ${p.status === 'published' ? 'selected' : ''}>Published</option><option value="draft" ${p.status === 'draft' ? 'selected' : ''}>Draft</option></select></div>
          </div>
        </div>

        <div data-pane="hero" style="display:none;">
          <div class="field"><label>Eyebrow</label><input id="f-eyebrow" value="${escapeHtml(p.hero_eyebrow)}"/></div>
          <div class="field"><label>Title (H1)</label><input id="f-htitle" value="${escapeHtml(p.hero_title)}"/></div>
          <div class="field"><label>Subtitle</label><textarea id="f-hsub">${escapeHtml(p.hero_subtitle)}</textarea></div>
          <div class="field"><label>Hero image URL</label><input id="f-himg" value="${escapeHtml(p.hero_image)}"/></div>
          <div class="field-row">
            <div class="field"><label>Primary CTA text</label><input id="f-cta1t" value="${escapeHtml(p.primary_cta_text)}"/></div>
            <div class="field"><label>Primary CTA link</label><input id="f-cta1l" value="${escapeHtml(p.primary_cta_link)}"/></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Secondary CTA text</label><input id="f-cta2t" value="${escapeHtml(p.secondary_cta_text)}"/></div>
            <div class="field"><label>Secondary CTA link</label><input id="f-cta2l" value="${escapeHtml(p.secondary_cta_link)}"/></div>
          </div>
        </div>

        <div data-pane="overview" style="display:none;">
          <div class="field"><label>Section title</label><input id="f-ovt" value="${escapeHtml((p.overview && p.overview.title) || '')}"/></div>
          <div class="field"><label>Body</label><textarea id="f-ovb" rows="6">${escapeHtml((p.overview && p.overview.body) || '')}</textarea></div>
        </div>

        <div data-pane="variants" style="display:none;">
          <div class="repeat-list" data-repeat="variants"></div>
          <button class="repeat-add" data-repeat-add="variants">+ Add variant</button>
        </div>

        <div data-pane="specs" style="display:none;">
          <div class="field"><label>Headers (comma separated)</label><input id="f-spec-headers" value="${escapeHtml((p.spec_table && p.spec_table.headers || []).join(', '))}"/></div>
          <div class="field"><label>Rows <span class="hint">(one row per line, columns separated by | )</span></label>
            <textarea id="f-spec-rows" rows="12">${escapeHtml((p.spec_table && p.spec_table.rows || []).map((r) => r.join(' | ')).join('\n'))}</textarea>
          </div>
        </div>

        <div data-pane="custom" style="display:none;">
          <div class="field field--check"><input type="checkbox" id="f-cust-on" ${(p.customization && p.customization.enabled) ? 'checked' : ''}/><label for="f-cust-on">Show customisation section on this pillar</label></div>
          <div class="repeat-list" data-repeat="customization"></div>
          <button class="repeat-add" data-repeat-add="customization">+ Add customisation item</button>
        </div>

        <div data-pane="mfg" style="display:none;">
          <div class="field"><label>Title</label><input id="f-mfgt" value="${escapeHtml((p.manufacturing && p.manufacturing.title) || '')}"/></div>
          <div class="field"><label>Body</label><textarea id="f-mfgb" rows="5">${escapeHtml((p.manufacturing && p.manufacturing.body) || '')}</textarea></div>
        </div>

        <div data-pane="certs" style="display:none;">
          <div class="repeat-list" data-repeat="certifications"></div>
          <button class="repeat-add" data-repeat-add="certifications">+ Add certification</button>
        </div>

        <div data-pane="apps" style="display:none;">
          <div class="field"><label>Application slugs <span class="hint">(comma separated; must match /admin/applications)</span></label><input id="f-apps" value="${escapeHtml((p.applications || []).join(', '))}"/></div>
        </div>

        <div data-pane="faq" style="display:none;">
          <div class="repeat-list" data-repeat="faq"></div>
          <button class="repeat-add" data-repeat-add="faq">+ Add FAQ</button>
        </div>

        <div data-pane="seo" style="display:none;">
          <div class="field"><label>Meta title</label><input id="f-mt" value="${escapeHtml(p.meta_title)}"/></div>
          <div class="field"><label>Meta description</label><textarea id="f-md" rows="3">${escapeHtml(p.meta_description)}</textarea></div>
          <div class="field"><label>Anchor text variants <span class="hint">(comma separated)</span></label><input id="f-anchors" value="${escapeHtml((p.anchor_variants || []).join(', '))}"/></div>
        </div>

        <div class="form-actions">
          <button class="btn" id="save">Save changes</button>
          <a href="/admin/pillars.html" class="btn btn--ghost">Cancel</a>
        </div>
      </div>
    `;

    // Tabs
    panel.querySelectorAll('.tabs__btn').forEach((b) => b.addEventListener('click', () => {
      panel.querySelectorAll('.tabs__btn').forEach((x) => x.classList.toggle('is-active', x === b));
      panel.querySelectorAll('[data-pane]').forEach((x) => x.style.display = x.dataset.pane === b.dataset.tab ? '' : 'none');
    }));

    // Repeaters
    function renderRepeater(name, list, fields) {
      const wrap = panel.querySelector(`[data-repeat="${name}"]`);
      wrap.innerHTML = list.map((item, idx) => `
        <div class="repeat-item" data-idx="${idx}">
          <button class="repeat-item__remove" data-remove="${idx}">Remove</button>
          ${fields.map((f) => `<div class="field"><label>${f.label}</label><input data-field="${f.key}" value="${escapeHtml(item[f.key] || '')}"/></div>`).join('')}
        </div>
      `).join('');
      wrap.querySelectorAll('[data-remove]').forEach((b) => b.addEventListener('click', () => {
        const i = parseInt(b.dataset.remove, 10);
        list.splice(i, 1);
        renderRepeater(name, list, fields);
      }));
      panel.querySelector(`[data-repeat-add="${name}"]`).onclick = () => {
        const empty = {};
        fields.forEach((f) => empty[f.key] = '');
        list.push(empty);
        renderRepeater(name, list, fields);
      };
    }
    const variantsList = Array.isArray(p.variants) ? p.variants.slice() : [];
    const customList = Array.isArray(p.customization && p.customization.items) ? p.customization.items.slice() : [];
    const certList = Array.isArray(p.certifications) ? p.certifications.slice() : [];
    const faqList = Array.isArray(p.faq) ? p.faq.slice() : [];
    renderRepeater('variants', variantsList, [{ key: 'name', label: 'Name' }, { key: 'summary', label: 'Summary' }, { key: 'image', label: 'Image URL' }]);
    renderRepeater('customization', customList, [{ key: 'label', label: 'Label' }, { key: 'value', label: 'Value' }]);
    renderRepeater('certifications', certList, [{ key: 'name', label: 'Name' }, { key: 'image', label: 'Image URL' }]);
    renderRepeater('faq', faqList, [{ key: 'q', label: 'Question' }, { key: 'a', label: 'Answer' }]);

    // Save
    panel.querySelector('#save').addEventListener('click', async () => {
      const collect = (selector) => Array.from(panel.querySelectorAll(`[data-repeat="${selector}"] .repeat-item`)).map((row) => {
        const obj = {};
        row.querySelectorAll('[data-field]').forEach((inp) => { obj[inp.dataset.field] = inp.value; });
        return obj;
      });
      const headers = panel.querySelector('#f-spec-headers').value.split(',').map((s) => s.trim()).filter(Boolean);
      const rows = panel.querySelector('#f-spec-rows').value.split('\n').map((line) => line.split('|').map((c) => c.trim())).filter((r) => r.some(Boolean));
      const apps = panel.querySelector('#f-apps').value.split(',').map((s) => s.trim()).filter(Boolean);
      const anchors = panel.querySelector('#f-anchors').value.split(',').map((s) => s.trim()).filter(Boolean);

      const payload = {
        name: panel.querySelector('#f-name').value,
        short_name: panel.querySelector('#f-short').value,
        sort_order: parseInt(panel.querySelector('#f-sort').value, 10) || 0,
        status: panel.querySelector('#f-status').value,
        hero_eyebrow: panel.querySelector('#f-eyebrow').value,
        hero_title: panel.querySelector('#f-htitle').value,
        hero_subtitle: panel.querySelector('#f-hsub').value,
        hero_image: panel.querySelector('#f-himg').value,
        primary_cta_text: panel.querySelector('#f-cta1t').value,
        primary_cta_link: panel.querySelector('#f-cta1l').value,
        secondary_cta_text: panel.querySelector('#f-cta2t').value,
        secondary_cta_link: panel.querySelector('#f-cta2l').value,
        overview: { title: panel.querySelector('#f-ovt').value, body: panel.querySelector('#f-ovb').value },
        variants: collect('variants'),
        spec_table: { headers, rows },
        applications: apps,
        customization: { enabled: panel.querySelector('#f-cust-on').checked, items: collect('customization') },
        manufacturing: { title: panel.querySelector('#f-mfgt').value, body: panel.querySelector('#f-mfgb').value },
        certifications: collect('certifications'),
        faq: collect('faq'),
        anchor_variants: anchors,
        meta_title: panel.querySelector('#f-mt').value,
        meta_description: panel.querySelector('#f-md').value,
      };
      try {
        await api('/api/pillars/' + p.id, { method: 'PUT', body: JSON.stringify(payload) });
        toast('Pillar saved', 'success');
        setTimeout(() => location.href = '/admin/pillars.html', 600);
      } catch (err) {
        toast('Save failed: ' + err.message, 'error');
      }
    });
  }
})();
</script>
</body>
</html>
