<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>应用行业 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script src="/admin/assets/js/seo-panel.js"></script>
<script>
(async function () {
  const { api, escapeHtml, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '应用行业', crumbs: '内容 / 应用行业' });
  if (!shell) return;
  shell.actions.innerHTML = `<button class="btn btn--sm" id="new">+ 新建应用</button>`;

  async function refresh() {
    const { items } = await api('/api/applications');
    const wantId = new URLSearchParams(location.search).get('id');
    shell.content.innerHTML = `
      <div class="panel" id="list-panel">
        <table class="table">
          <thead><tr><th>名称</th><th>Slug</th><th>排序</th><th>状态</th><th></th></tr></thead>
          <tbody>
            ${items.length ? items.map((a) => `
              <tr>
                <td><strong>${escapeHtml(a.name)}</strong></td>
                <td><span class="mono">${escapeHtml(a.slug)}</span></td>
                <td>${a.sort_order}</td>
                <td><span class="pill pill--${a.status}">${a.status}</span></td>
                <td><a class="btn btn--ghost btn--sm" href="?id=${a.id}">编辑</a></td>
              </tr>
            `).join('') : '<tr><td colspan="5"><div class="empty">还没有应用行业。</div></td></tr>'}
          </tbody>
        </table>
      </div>
      <div id="edit-panel"></div>
    `;
    if (wantId) {
      const a = items.find((x) => String(x.id) === wantId);
      if (a) renderEditor(a);
    }
  }

  function renderEditor(a) {
    a = a || { sort_order: 0, status: 'published' };
    const isNew = !a.id;
    document.getElementById('list-panel').style.display = 'none';
    const panel = document.getElementById('edit-panel');
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>${isNew ? '新建应用' : '编辑: ' + escapeHtml(a.name)}</h2>
          <div style="display:flex; gap:8px;">
            ${!isNew ? `<a target="_blank" class="btn btn--ghost btn--sm" href="/applications/${escapeHtml(a.slug)}">预览 ↗</a>` : ''}
            <a href="/admin/applications.html" class="btn btn--ghost btn--sm">返回</a>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>名称</label><input id="f-name" value="${escapeHtml(a.name || '')}"/></div>
          <div class="field"><label>Slug</label><input id="f-slug" value="${escapeHtml(a.slug || '')}" ${isNew ? '' : 'readonly'}/></div>
        </div>
        <div class="field"><label>图标 <span class="hint">（一个字符或 emoji）</span></label><input id="f-icon" value="${escapeHtml(a.icon || '')}"/></div>
        <div class="field"><label>封面图 URL</label><input id="f-cover" value="${escapeHtml(a.cover_url || '')}"/></div>
        <div class="field"><label>摘要 <span class="hint">（1-2 句，列表卡片用）</span></label><textarea id="f-summary" rows="3">${escapeHtml(a.summary || '')}</textarea></div>
        <div class="field"><label>正文 <span class="hint">（支持 HTML）</span></label><textarea id="f-body" rows="10">${escapeHtml(a.body || '')}</textarea></div>
        <div class="field-row">
          <div class="field"><label>Meta 标题</label><input id="f-mt" value="${escapeHtml(a.meta_title || '')}"/></div>
          <div class="field"><label>Meta 描述</label><textarea id="f-md" rows="2">${escapeHtml(a.meta_description || '')}</textarea></div>
        </div>
        <div class="field-row">
          <div class="field"><label>排序</label><input id="f-sort" type="number" value="${a.sort_order || 0}"/></div>
          <div class="field"><label>状态</label><select id="f-status"><option value="published" ${a.status === 'published' ? 'selected' : ''}>已发布</option><option value="draft" ${a.status === 'draft' ? 'selected' : ''}>草稿</option></select></div>
        </div>

        <div id="f-seo-mount"></div>

        <div class="form-actions">
          <button class="btn" id="save">保存</button>
          ${!isNew ? '<button class="btn btn--danger" id="delete">删除</button>' : ''}
          <a href="/admin/applications.html" class="btn btn--ghost">取消</a>
        </div>
      </div>
    `;

    let seoPanel = null;
    try {
      seoPanel = window.SEOPanel.mount('f-seo-mount', {
        entity: 'application',
        siteHost: location.host,
        initial: a,
        getContext: () => ({
          title: (panel.querySelector('#f-mt') || {}).value
                 || (panel.querySelector('#f-name') || {}).value || '',
          description: (panel.querySelector('#f-md') || {}).value
                       || (panel.querySelector('#f-summary') || {}).value || '',
          slug: 'applications/' + ((panel.querySelector('#f-slug') || {}).value || ''),
          body: (panel.querySelector('#f-body') || {}).value || '',
          coverUrl: (panel.querySelector('#f-cover') || {}).value || '',
        }),
      });
    } catch (err) {
      const host = document.getElementById('f-seo-mount');
      if (host) host.innerHTML = '<p style="color:var(--a-mute2); font-size:12px;">SEO 面板加载失败：' + escapeHtml(err.message) + '</p>';
    }
    panel.addEventListener('input', () => seoPanel && seoPanel.repaint());

    panel.querySelector('#save').addEventListener('click', async () => {
      const seoVals = seoPanel ? seoPanel.getValues() : {};
      const payload = Object.assign({
        slug: panel.querySelector('#f-slug').value,
        name: panel.querySelector('#f-name').value,
        icon: panel.querySelector('#f-icon').value,
        cover_url: panel.querySelector('#f-cover').value,
        summary: panel.querySelector('#f-summary').value,
        body: panel.querySelector('#f-body').value,
        meta_title: panel.querySelector('#f-mt').value,
        meta_description: panel.querySelector('#f-md').value,
        sort_order: parseInt(panel.querySelector('#f-sort').value, 10) || 0,
        status: panel.querySelector('#f-status').value,
      }, seoVals);
      try {
        if (isNew) await api('/api/applications', { method: 'POST', body: JSON.stringify(payload) });
        else await api('/api/applications/' + a.id, { method: 'PUT', body: JSON.stringify(payload) });
        toast('保存d', 'success');
        setTimeout(() => location.href = '/admin/applications.html', 500);
      } catch (err) { toast('保存 failed: ' + err.message, 'error'); }
    });
    if (!isNew) {
      panel.querySelector('#delete').addEventListener('click', async () => {
        if (!confirm('删除 this application?')) return;
        await api('/api/applications/' + a.id, { method: 'DELETE' });
        toast('删除d', 'success');
        setTimeout(() => location.href = '/admin/applications.html', 500);
      });
    }
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'new') renderEditor();
  });
  refresh();
})();
</script>
</body>
</html>
