<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>博客文章 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '博客文章', crumbs: '内容 / 博客文章' });
  if (!shell) return;
  shell.actions.innerHTML = `<button class="btn btn--sm" id="new">+ 新建文章</button>`;

  const pillars = (await api('/api/pillars?status=all')).items;
  const cats = (await api('/api/articles/categories/list')).items;

  async function refresh() {
    const wantId = new URLSearchParams(location.search).get('id');
    const { items } = await api('/api/articles/admin/list');
    shell.content.innerHTML = `
      <div class="panel" id="list-panel">
        <table class="table">
          <thead><tr><th>标题</th><th>支柱</th><th>状态</th><th>更新于</th><th></th></tr></thead>
          <tbody>
            ${items.length ? items.map((a) => `
              <tr>
                <td><strong>${escapeHtml(a.title)}</strong><div style="font-size:11.5px; color:var(--a-mute2);">${escapeHtml(a.slug)}</div></td>
                <td>${escapeHtml(a.pillar_short_name || '-')}</td>
                <td><span class="pill pill--${a.status}">${a.status}</span></td>
                <td>${formatDate(a.updated_at)}</td>
                <td><a class="btn btn--ghost btn--sm" href="?id=${a.id}">编辑</a></td>
              </tr>
            `).join('') : '<tr><td colspan="5"><div class="empty">还没有文章。</div></td></tr>'}
          </tbody>
        </table>
      </div>
      <div id="edit-panel"></div>
    `;
    if (wantId) {
      const a = items.find((x) => String(x.id) === wantId);
      if (a) renderEditor(a);
    }
  }

  function renderEditor(a) {
    a = a || { reading_minutes: 5, status: 'draft' };
    const isNew = !a.id;
    document.getElementById('list-panel').style.display = 'none';
    const panel = document.getElementById('edit-panel');
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>${isNew ? '新建文章' : '编辑: ' + escapeHtml(a.title)}</h2>
          <div style="display:flex; gap:8px;">
            ${!isNew ? `<a target="_blank" class="btn btn--ghost btn--sm" href="/blog/${escapeHtml(a.slug)}">预览 ↗</a>` : ''}
            <a href="/admin/articles.html" class="btn btn--ghost btn--sm">返回</a>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Title</label><input id="f-title" value="${escapeHtml(a.title || '')}"/></div>
          <div class="field"><label>Slug</label><input id="f-slug" value="${escapeHtml(a.slug || '')}" ${isNew ? '' : 'readonly'}/></div>
        </div>
        <div class="field"><label>摘要</label><textarea id="f-excerpt" rows="2">${escapeHtml(a.excerpt || '')}</textarea></div>
        <div class="field"><label>封面图 URL</label><input id="f-cover" value="${escapeHtml(a.cover_url || '')}"/></div>

        <div class="field-row">
          <div class="field"><label>所属支柱（话题集群） <span class="hint">— 用于把文章链接回支柱页，提升 SEO</span></label>
            <select id="f-pillar">
              <option value="">— 不绑定支柱 —</option>
              ${pillars.map((x) => `<option value="${x.id}" ${x.id === a.pillar_id ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>分类</label>
            <select id="f-cat">
              <option value="">— 无 —</option>
              ${cats.map((c) => `<option value="${c.id}" ${c.id === a.category_id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="field"><label>正文内容 <span class="hint">（支持 HTML）</span></label><textarea id="f-content" rows="14">${escapeHtml(a.content || '')}</textarea></div>

        <div class="field-row">
          <div class="field"><label>作者</label><input id="f-author" value="${escapeHtml(a.author || 'Acme Engineering')}"/></div>
          <div class="field"><label>阅读时长（分钟）</label><input id="f-min" type="number" value="${a.reading_minutes || 5}"/></div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>文章模板 <span class="hint">（决定详情页排版）</span></label>
            <select id="f-template">
              <option value="standard" ${(!a.template || a.template === 'standard') ? 'selected' : ''}>标准（默认）— 居中正文 + 侧栏元数据</option>
              <option value="guide" ${a.template === 'guide' ? 'selected' : ''}>技术指南 — 自动目录 + 步骤标题</option>
              <option value="case-study" ${a.template === 'case-study' ? 'selected' : ''}>客户案例 — 关键指标卡 + 双栏布局</option>
            </select>
          </div>
          <div class="field"><label>Hero 大图 URL <span class="hint">（详情页顶部背景，留空则用封面图）</span></label><input id="f-hero" value="${escapeHtml(a.hero_image || '')}"/></div>
        </div>

        <div class="field-row">
          <div class="field"><label>Meta 标题</label><input id="f-mt" value="${escapeHtml(a.meta_title || '')}"/></div>
          <div class="field"><label>状态</label><select id="f-status"><option value="draft" ${a.status === 'draft' ? 'selected' : ''}>草稿</option><option value="published" ${a.status === 'published' ? 'selected' : ''}>已发布</option></select></div>
        </div>
        <div class="field"><label>Meta 描述</label><textarea id="f-md" rows="2">${escapeHtml(a.meta_description || '')}</textarea></div>

        <div class="form-actions">
          <button class="btn" id="save">保存</button>
          ${!isNew ? '<button class="btn btn--danger" id="delete">删除</button>' : ''}
          <a href="/admin/articles.html" class="btn btn--ghost">取消</a>
        </div>
      </div>
    `;

    panel.querySelector('#save').addEventListener('click', async () => {
      const payload = {
        slug: panel.querySelector('#f-slug').value,
        title: panel.querySelector('#f-title').value,
        excerpt: panel.querySelector('#f-excerpt').value,
        cover_url: panel.querySelector('#f-cover').value,
        pillar_id: panel.querySelector('#f-pillar').value || null,
        category_id: panel.querySelector('#f-cat').value || null,
        content: panel.querySelector('#f-content').value,
        author: panel.querySelector('#f-author').value,
        reading_minutes: parseInt(panel.querySelector('#f-min').value, 10) || 5,
        template: panel.querySelector('#f-template').value,
        hero_image: panel.querySelector('#f-hero').value,
        meta_title: panel.querySelector('#f-mt').value,
        meta_description: panel.querySelector('#f-md').value,
        status: panel.querySelector('#f-status').value,
      };
      try {
        if (isNew) await api('/api/articles', { method: 'POST', body: JSON.stringify(payload) });
        else await api('/api/articles/' + a.id, { method: 'PUT', body: JSON.stringify(payload) });
        toast('保存d', 'success');
        setTimeout(() => location.href = '/admin/articles.html', 500);
      } catch (err) { toast('保存 failed: ' + err.message, 'error'); }
    });
    if (!isNew) {
      panel.querySelector('#delete').addEventListener('click', async () => {
        if (!confirm('删除 this article?')) return;
        await api('/api/articles/' + a.id, { method: 'DELETE' });
        toast('删除d', 'success');
        setTimeout(() => location.href = '/admin/articles.html', 500);
      });
    }
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'new') renderEditor();
  });
  refresh();
})();
</script>
</body>
</html>
