<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>博客文章 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css?v=2"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script src="/admin/assets/js/quill-editor.js"></script>
<script src="/admin/assets/js/seo-panel.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  let contentEditor = null;
  const shell = await bootShell({ title: '博客文章', crumbs: '内容 / 博客文章' });
  if (!shell) return;
  shell.actions.innerHTML = `
    <a href="/admin/ai-generate.html" class="btn btn--ghost btn--sm">✦ AI 生成新文章</a>
    <button class="btn btn--sm" id="new">+ 新建文章</button>
  `;

  const pillars = (await api('/api/pillars?status=all')).items;
  const cats = (await api('/api/articles/categories/list')).items;
  const authors = (await api('/api/authors?all=1')).items;

  // Cache the most recent admin-list payload so the row-level "查重"
  // button can find article content by id without re-fetching.
  let LAST_ITEMS = [];

  async function refresh() {
    const wantId = new URLSearchParams(location.search).get('id');
    const { items } = await api('/api/articles/admin/list');
    LAST_ITEMS = items;
    shell.content.innerHTML = `
      <div class="panel" id="list-panel">
        <table class="table">
          <thead><tr><th>标题</th><th>支柱</th><th>状态</th><th>更新于</th><th style="text-align:right;">操作</th></tr></thead>
          <tbody>
            ${items.length ? items.map((a) => `
              <tr>
                <td><strong>${escapeHtml(a.title)}</strong><div style="font-size:11.5px; color:var(--a-mute2);">${escapeHtml(a.slug)}</div></td>
                <td>${escapeHtml(a.pillar_short_name || '-')}</td>
                <td><span class="pill pill--${a.status}">${a.status}</span></td>
                <td>${formatDate(a.updated_at)}</td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="btn btn--ghost btn--sm" data-detect-id="${a.id}" title="对正文内容运行 AI 查重">◌ 查重</button>
                  <a class="btn btn--ghost btn--sm" href="?id=${a.id}">编辑</a>
                </td>
              </tr>
            `).join('') : '<tr><td colspan="5"><div class="empty">还没有文章。</div></td></tr>'}
          </tbody>
        </table>
      </div>
      <div id="edit-panel"></div>
    `;
    if (wantId) {
      const a = items.find((x) => String(x.id) === wantId);
      if (a) renderEditor(a);
    }
  }

  // ----- AI 查重 modal -----
  // Opens a small overlay, calls /api/ai-generate/detect with the
  // supplied text, and renders the score + signals. The modal is
  // created/torn down on demand so multiple opens don't stack.
  async function runDetect(text, title) {
    if (!text || !text.trim()) return toast('文章正文为空，无法查重', 'error');
    let modal = document.getElementById('detect-modal');
    if (modal) modal.remove();
    modal = document.createElement('div');
    modal.id = 'detect-modal';
    modal.style.cssText = 'position:fixed; inset:0; background:rgba(15,23,42,0.55); display:flex; align-items:center; justify-content:center; z-index:1000;';
    modal.innerHTML = `
      <div style="background:#fff; border-radius:12px; padding:22px 24px; max-width:520px; width:92%; box-shadow:0 30px 60px rgba(15,23,42,0.35);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
          <div>
            <div style="font-size:11px; color:var(--a-mute2); text-transform:uppercase; letter-spacing:0.6px;">AI 查重</div>
            <div style="font-size:15px; font-weight:600; margin-top:2px;">${escapeHtml(title || '文章正文')}</div>
          </div>
          <button class="btn btn--ghost btn--sm" id="detect-close" aria-label="Close">✕</button>
        </div>
        <div id="detect-body" style="min-height:80px;">
          <div style="display:flex; align-items:center; gap:10px; padding:18px 0;">
            <span style="display:inline-block; width:14px; height:14px; border:2px solid rgba(11,58,130,0.25); border-top-color:var(--a-brand); border-radius:50%; animation:detect-sp 0.6s linear infinite;"></span>
            <span style="font-size:13px; color:var(--a-mute2);">正在分析（句长方差 / AI 套话 / em-dash 密度 / 词汇多样性）…</span>
          </div>
          <style>@keyframes detect-sp { to { transform: rotate(360deg); } }</style>
        </div>
        <div style="margin-top:14px; display:flex; justify-content:flex-end; gap:8px;">
          <a class="btn btn--ghost btn--sm" href="/admin/ai-generate.html" target="_blank">打开 AI 工作台 ↗</a>
          <button class="btn btn--sm" id="detect-ok">关闭</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    const close = () => modal.remove();
    document.getElementById('detect-close').addEventListener('click', close);
    document.getElementById('detect-ok').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    try {
      const out = await api('/api/ai-generate/detect', {
        method: 'POST',
        body: JSON.stringify({ text }),
      });
      const colour = out.level === 'high' ? '#dc2626' : out.level === 'medium' ? '#d97706' : '#16a34a';
      const levelText = out.level === 'high' ? '高' : out.level === 'medium' ? '中' : '低';
      const body = document.getElementById('detect-body');
      if (!body) return;
      body.innerHTML = `
        <div style="display:flex; gap:14px; align-items:center; padding:10px 0;">
          <div style="width:72px; height:72px; border-radius:50%; background:${colour}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; flex-shrink:0;">${out.score}</div>
          <div>
            <div style="font-size:13px; color:var(--a-fg);"><strong>AI 风险等级: ${levelText}</strong></div>
            <div style="font-size:12px; color:var(--a-mute2); margin-top:4px;">
              检测方式: <code>${escapeHtml(out.provider)}</code>${out.score >= 45 ? ' · 建议到 AI 工作台执行降AI 微调' : ' · 风险可接受'}
            </div>
          </div>
        </div>
        ${out.signals && out.signals.length ? `
          <ul style="margin:12px 0 0; padding-left:20px; font-size:12.5px; color:var(--a-mute2); line-height:1.7;">
            ${out.signals.map((s) => `<li>${escapeHtml(s)}</li>`).join('')}
          </ul>
        ` : ''}
        ${out.suspectSpans && out.suspectSpans.length ? `
          <div style="margin-top:12px; font-size:12px; color:var(--a-mute2);">
            可疑短语: ${out.suspectSpans.slice(0, 8).map((s) => '<code style="background:#fef3c7; padding:1px 6px; border-radius:3px;">' + escapeHtml(s) + '</code>').join(' ')}
          </div>
        ` : ''}
      `;
    } catch (err) {
      const body = document.getElementById('detect-body');
      if (body) body.innerHTML = `<div style="color:#dc2626; font-size:13px;">查重失败：${escapeHtml(err.message)}</div>`;
    }
  }

  function renderEditor(a) {
    a = a || { reading_minutes: 5, status: 'draft' };
    const isNew = !a.id;
    document.getElementById('list-panel').style.display = 'none';
    const panel = document.getElementById('edit-panel');
    panel.innerHTML = `
      <div class="panel">
        <div class="panel__head">
          <h2>${isNew ? '新建文章' : '编辑: ' + escapeHtml(a.title)}</h2>
          <div style="display:flex; gap:8px;">
            <button class="btn btn--ghost btn--sm" id="editor-detect" title="对当前编辑器中的正文（未保存草稿也行）运行 AI 查重">◌ 查重</button>
            ${!isNew ? `<a target="_blank" class="btn btn--ghost btn--sm" href="/blog/${escapeHtml(a.slug)}">预览 ↗</a>` : ''}
            <a href="/admin/articles.html" class="btn btn--ghost btn--sm">返回</a>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Title</label><input id="f-title" value="${escapeHtml(a.title || '')}"/></div>
          <div class="field"><label>Slug</label><input id="f-slug" value="${escapeHtml(a.slug || '')}" ${isNew ? '' : 'readonly'}/></div>
        </div>
        <div class="field"><label>摘要</label><textarea id="f-excerpt" rows="2">${escapeHtml(a.excerpt || '')}</textarea></div>
        <div class="field"><label>封面图 URL</label><input id="f-cover" value="${escapeHtml(a.cover_url || '')}"/></div>

        <div class="field-row">
          <div class="field"><label>所属支柱（话题集群） <span class="hint">— 用于把文章链接回支柱页，提升 SEO</span></label>
            <select id="f-pillar">
              <option value="">— 不绑定支柱 —</option>
              ${pillars.map((x) => `<option value="${x.id}" ${x.id === a.pillar_id ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>分类</label>
            <select id="f-cat">
              <option value="">— 无 —</option>
              ${cats.map((c) => `<option value="${c.id}" ${c.id === a.category_id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="field">
          <label>正文内容 <span class="hint">— 可视化编辑器：标题 / 列表 / 加粗 / 链接 / 图片直接上传到媒体库。需要直接编辑 HTML 时点编辑器底部"查看 HTML 源代码"。</span></label>
          <div id="f-content"></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>作者档案 <span class="hint">— 选择已建立的作者档案，将渲染 Person 结构化数据（E-E-A-T）。<a href="/admin/authors.html" target="_blank" style="color:var(--a-accent);">管理作者 ↗</a></span></label>
            <select id="f-author-id">
              <option value="">— 无 —</option>
              ${authors.map((au) => `<option value="${au.id}" ${au.id === a.author_id ? 'selected' : ''}>${escapeHtml(au.name)}${au.job_title ? ' — ' + escapeHtml(au.job_title) : ''}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>阅读时长（分钟）</label><input id="f-min" type="number" value="${a.reading_minutes || 5}"/></div>
        </div>
        <div class="field"><label>显示作者名 <span class="hint">— 如果不绑定作者档案，可填一个文本（默认 "Zufek Engineering"）。绑定档案后此字段被忽略。</span></label><input id="f-author" value="${escapeHtml(a.author || 'Zufek Engineering')}"/></div>
        <div class="field-row">
          <div class="field">
            <label>文章模板 <span class="hint">（决定详情页排版）</span></label>
            <select id="f-template">
              <option value="standard" ${(!a.template || a.template === 'standard') ? 'selected' : ''}>标准（默认）— 居中正文 + 侧栏元数据</option>
              <option value="guide" ${a.template === 'guide' ? 'selected' : ''}>技术指南 — 自动目录 + 步骤标题</option>
              <option value="case-study" ${a.template === 'case-study' ? 'selected' : ''}>客户案例 — 关键指标卡 + 双栏布局</option>
            </select>
          </div>
          <div class="field"><label>Hero 大图 URL <span class="hint">（详情页顶部背景，留空则用封面图）</span></label><input id="f-hero" value="${escapeHtml(a.hero_image || '')}"/></div>
        </div>

        <div class="field-row">
          <div class="field"><label>Meta 标题</label><input id="f-mt" value="${escapeHtml(a.meta_title || '')}"/></div>
          <div class="field"><label>状态</label><select id="f-status"><option value="draft" ${a.status === 'draft' ? 'selected' : ''}>草稿</option><option value="published" ${a.status === 'published' ? 'selected' : ''}>已发布</option></select></div>
        </div>
        <div class="field"><label>Meta 描述</label><textarea id="f-md" rows="2">${escapeHtml(a.meta_description || '')}</textarea></div>

        <div id="f-seo-mount"></div>

        <div class="form-actions">
          <button class="btn" id="save">保存</button>
          ${!isNew ? '<button class="btn btn--danger" id="delete">删除</button>' : ''}
          <a href="/admin/articles.html" class="btn btn--ghost">取消</a>
        </div>
      </div>
    `;

    // Mount the visual editor on #f-content. Falls back gracefully to a
    // textarea if the Quill bundle fails to load (e.g. CSP block, offline
    // CDN) so the operator never loses the ability to save content.
    contentEditor = null;
    (async () => {
      try {
        contentEditor = await window.QuillEditor.mount('f-content', a.content || '', {
          placeholder: '撰写文章正文…图片直接拖拽或粘贴会自动上传到媒体库。',
        });
      } catch (err) {
        const host = panel.querySelector('#f-content');
        host.innerHTML = `<textarea id="f-content-fallback" rows="20" style="width:100%; font-family:'JetBrains Mono',monospace;">${escapeHtml(a.content || '')}</textarea>`;
        toast('可视化编辑器加载失败（' + err.message + '），已退回到 HTML 文本框', 'error');
      }
    })();

    // SEO panel — RankMath-style focus keyword + SERP preview + 14 checks
    let seoPanel = null;
    try {
      seoPanel = window.SEOPanel.mount('f-seo-mount', {
        entity: 'article',
        siteHost: location.host,
        initial: a,
        getContext: () => ({
          title: (panel.querySelector('#f-mt') || {}).value
                 || (panel.querySelector('#f-title') || {}).value
                 || '',
          description: (panel.querySelector('#f-md') || {}).value
                       || (panel.querySelector('#f-excerpt') || {}).value
                       || '',
          slug: 'blog/' + ((panel.querySelector('#f-slug') || {}).value || ''),
          body: contentEditor ? contentEditor.getHtml() : (a.content || ''),
          coverUrl: (panel.querySelector('#f-cover') || {}).value || '',
        }),
      });
    } catch (err) {
      const host = document.getElementById('f-seo-mount');
      if (host) host.innerHTML =
        '<p style="color:var(--a-mute2); font-size:12px;">SEO 面板加载失败：' + escapeHtml(err.message) + '</p>';
    }
    panel.addEventListener('input', () => seoPanel && seoPanel.repaint());

    // 查重 — pulls the live editor content (handles unsaved drafts too),
    // not the row's last-saved value.
    panel.querySelector('#editor-detect').addEventListener('click', () => {
      const fallback = panel.querySelector('#f-content-fallback');
      const content = contentEditor ? contentEditor.getHtml() : (fallback ? fallback.value : '');
      const title = (panel.querySelector('#f-title') || {}).value || a.title || '新文章';
      runDetect(content, title);
    });

    panel.querySelector('#save').addEventListener('click', async () => {
      const fallback = panel.querySelector('#f-content-fallback');
      const content = contentEditor ? contentEditor.getHtml()
        : (fallback ? fallback.value : '');
      const seoVals = seoPanel ? seoPanel.getValues() : {};
      const payload = Object.assign({
        slug: panel.querySelector('#f-slug').value,
        title: panel.querySelector('#f-title').value,
        excerpt: panel.querySelector('#f-excerpt').value,
        cover_url: panel.querySelector('#f-cover').value,
        pillar_id: panel.querySelector('#f-pillar').value || null,
        category_id: panel.querySelector('#f-cat').value || null,
        author_id: panel.querySelector('#f-author-id').value || null,
        content,
        author: panel.querySelector('#f-author').value,
        reading_minutes: parseInt(panel.querySelector('#f-min').value, 10) || 5,
        template: panel.querySelector('#f-template').value,
        hero_image: panel.querySelector('#f-hero').value,
        meta_title: panel.querySelector('#f-mt').value,
        meta_description: panel.querySelector('#f-md').value,
        status: panel.querySelector('#f-status').value,
      }, seoVals);
      try {
        if (isNew) await api('/api/articles', { method: 'POST', body: JSON.stringify(payload) });
        else await api('/api/articles/' + a.id, { method: 'PUT', body: JSON.stringify(payload) });
        toast('保存d', 'success');
        setTimeout(() => location.href = '/admin/articles.html', 500);
      } catch (err) { toast('保存 failed: ' + err.message, 'error'); }
    });
    if (!isNew) {
      panel.querySelector('#delete').addEventListener('click', async () => {
        if (!confirm('删除 this article?')) return;
        await api('/api/articles/' + a.id, { method: 'DELETE' });
        toast('删除d', 'success');
        setTimeout(() => location.href = '/admin/articles.html', 500);
      });
    }
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'new') renderEditor();
    // Row-level 查重 button — reads from the cached list, no extra fetch.
    const detectBtn = ev.target.closest('[data-detect-id]');
    if (detectBtn) {
      ev.preventDefault();
      const id = String(detectBtn.dataset.detectId);
      const a = LAST_ITEMS.find((x) => String(x.id) === id);
      if (!a) return toast('找不到文章', 'error');
      runDetect(a.content || '', a.title);
    }
  });
  refresh();
})();
</script>
</body>
</html>
