<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>审计日志 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css?v=2"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js?v=2"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '审计日志', crumbs: '合规 / 审计' });
  if (!shell) return;
  const { items } = await api('/api/audit?limit=200');
  shell.content.innerHTML = `
    <div class="panel">
      <p style="margin:0 0 16px; color:var(--a-mute2); font-size:13px;">最近 200 条后台操作记录。日志保留 24 个月，不可编辑。</p>
      <table class="table">
        <thead><tr><th>时间</th><th>用户</th><th>操作</th><th>对象</th><th>详情</th></tr></thead>
        <tbody>
          ${items.length ? items.map((a) => `
            <tr>
              <td>${formatDate(a.created_at)}</td>
              <td>${escapeHtml(a.user_email || '系统')}</td>
              <td><span class="pill pill--read">${escapeHtml(a.action)}</span></td>
              <td>${escapeHtml(a.entity)}${a.entity_id ? ' #' + escapeHtml(a.entity_id) : ''}</td>
              <td><code style="font-size:11.5px;">${escapeHtml(JSON.stringify(a.detail || {}))}</code></td>
            </tr>
          `).join('') : '<tr><td colspan="5"><div class="empty">没有活动记录。</div></td></tr>'}
        </tbody>
      </table>
    </div>
  `;
})();
</script>
</body>
</html>
