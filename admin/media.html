<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>媒体库 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '媒体库', crumbs: '内容 / 媒体库' });
  if (!shell) return;
  shell.actions.innerHTML = `<input type="file" id="upload" accept="image/*,application/pdf" style="display:none;"/><button class="btn btn--sm" id="upload-btn">+ 上传文件</button>`;

  async function refresh() {
    const { items } = await api('/api/media');
    shell.content.innerHTML = `
      <div class="panel">
        <p style="margin:0 0 16px; color:var(--a-mute2); font-size:13px;">支持格式：PNG / JPEG / WebP / SVG / GIF / PDF，单个文件最大 8 MB。访问路径 <code>/uploads/</code>。</p>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;">
          ${items.length ? items.map((m) => `
            <div style="border:1px solid var(--a-line); border-radius:8px; overflow:hidden;" data-row="${m.id}">
              ${m.mime.startsWith('image') ? `<img src="${escapeHtml(m.url)}" alt="${escapeHtml(m.alt_text || m.original)}" style="width:100%; aspect-ratio:1; object-fit:cover; background:var(--a-surface);"/>` : `<div style="aspect-ratio:1; display:grid; place-items:center; background:var(--a-surface); color:var(--a-mute2); font-size:12px;">${escapeHtml(m.mime.split('/').pop().toUpperCase())}</div>`}
              <div style="padding:10px; font-size:11.5px;">
                <div style="font-weight:600; word-break:break-word;">${escapeHtml(m.original)}</div>
                <div style="color:var(--a-mute2);">${(m.size / 1024).toFixed(1)} KB · ${formatDate(m.created_at)}</div>
                <input value="${escapeHtml(m.url)}" readonly onclick="this.select()" class="mono" style="width:100%; margin-top:6px; font-size:11px; padding:5px 6px; border:1px solid var(--a-line); border-radius:4px;"/>
                ${m.mime.startsWith('image') && m.mime !== 'image/svg+xml' ? `
                  <div style="margin-top:6px;">
                    <label style="display:block; font-size:10.5px; color:var(--a-mute2); margin-bottom:2px;">Alt 文本</label>
                    <textarea data-alt="${m.id}" rows="2" style="width:100%; font-size:11px; padding:5px 6px; border:1px solid var(--a-line); border-radius:4px; resize:vertical;">${escapeHtml(m.alt_text || '')}</textarea>
                    <div style="display:flex; gap:4px; margin-top:4px;">
                      <button class="btn btn--ghost btn--sm" style="flex:1; font-size:10.5px;" data-ai-alt="${m.id}">✦ AI 生成</button>
                      <button class="btn btn--ghost btn--sm" style="flex:1; font-size:10.5px;" data-save-alt="${m.id}">保存</button>
                    </div>
                  </div>
                ` : ''}
                <div style="display:flex; gap:6px; margin-top:6px;">
                  <a href="${escapeHtml(m.url)}" target="_blank" class="btn btn--ghost btn--sm" style="flex:1; text-align:center;">打开</a>
                  <button class="btn btn--ghost btn--sm" data-delete="${m.id}">删除</button>
                </div>
              </div>
            </div>
          `).join('') : '<div class="empty" style="grid-column:1/-1;">还没有上传文件。</div>'}
        </div>
      </div>
    `;
    document.querySelectorAll('[data-delete]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('删除 this file? This cannot be undone.')) return;
      await api('/api/media/' + b.dataset.delete, { method: 'DELETE' });
      toast('删除d', 'success');
      refresh();
    }));
    document.querySelectorAll('[data-ai-alt]').forEach((b) => b.addEventListener('click', async () => {
      const id = b.dataset.aiAlt;
      const ta = document.querySelector(`[data-alt="${id}"]`);
      const original = b.textContent;
      b.disabled = true; b.textContent = '生成中…';
      try {
        const r = await api('/api/media/' + id + '/auto-alt', { method: 'POST' });
        if (ta) ta.value = r.alt;
        toast('✓ ' + (r.provider || 'AI') + ' 生成完成', 'success');
      } catch (err) {
        toast('生成失败：' + err.message, 'error');
      } finally {
        b.disabled = false; b.textContent = original;
      }
    }));
    document.querySelectorAll('[data-save-alt]').forEach((b) => b.addEventListener('click', async () => {
      const id = b.dataset.saveAlt;
      const ta = document.querySelector(`[data-alt="${id}"]`);
      if (!ta) return;
      try {
        await api('/api/media/' + id + '/alt', { method: 'PUT', body: JSON.stringify({ alt_text: ta.value }) });
        toast('已保存', 'success');
      } catch (err) {
        toast('保存失败：' + err.message, 'error');
      }
    }));
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'upload-btn') document.getElementById('upload').click();
  });
  document.getElementById('upload').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/api/media', { method: 'POST', credentials: 'include', body: fd });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'upload_failed');
      toast('已上传：' + json.filename, 'success');
      refresh();
    } catch (err) {
      toast('上传失败：' + err.message, 'error');
    }
    ev.target.value = '';
  });

  refresh();
})();
</script>
</body>
</html>
