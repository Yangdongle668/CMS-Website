<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>媒体库 | 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin/assets/css/admin.css"/>
<style>
.media-edit-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999;}
.media-edit-panel{background:#fff;border-radius:12px;width:min(520px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.22);overflow:hidden;}
.media-edit-panel__head{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;}
.media-edit-panel__head h3{margin:0;font-size:15px;}
.media-edit-panel__close{background:none;border:none;font-size:22px;cursor:pointer;color:#64748b;line-height:1;}
.media-edit-panel__body{padding:20px;}
.media-edit-panel__preview{width:100%;aspect-ratio:16/9;object-fit:contain;background:#f8fafc;border-radius:6px;margin-bottom:16px;}
.media-edit-panel__row{margin-bottom:14px;}
.media-edit-panel__row label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px;}
.media-edit-panel__row input,.media-edit-panel__row textarea{width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;font-family:inherit;box-sizing:border-box;}
.media-edit-panel__row textarea{resize:vertical;min-height:56px;}
.media-edit-panel__row .mono{font-family:monospace;font-size:12px;}
.media-edit-panel__footer{padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>
<div data-admin-shell></div>
<script src="/admin/assets/js/admin.js"></script>
<script>
(async function () {
  const { api, escapeHtml, formatDate, toast, bootShell } = window.AdminAPI;
  const shell = await bootShell({ title: '媒体库', crumbs: '内容 / 媒体库' });
  if (!shell) return;
  shell.actions.innerHTML = `<input type="file" id="upload" accept="image/*,application/pdf" style="display:none;"/><button class="btn btn--sm" id="upload-btn">+ 上传文件</button>`;

  // ---------- Edit modal ----------
  function openEditModal(m) {
    const overlay = document.createElement('div');
    overlay.className = 'media-edit-overlay';
    const isImg = (m.mime || '').startsWith('image');
    overlay.innerHTML = `
      <div class="media-edit-panel">
        <div class="media-edit-panel__head">
          <h3>编辑图片信息</h3>
          <button type="button" class="media-edit-panel__close" aria-label="关闭">&times;</button>
        </div>
        <div class="media-edit-panel__body">
          ${isImg ? `<img src="${escapeHtml(m.url)}" class="media-edit-panel__preview" alt=""/>` : ''}
          <div class="media-edit-panel__row">
            <label>文件名（显示名称）</label>
            <input id="me-original" type="text" value="${escapeHtml(m.original || m.filename)}" maxlength="255" placeholder="例：工厂实拍图 2026"/>
          </div>
          <div class="media-edit-panel__row">
            <label>Alt 描述（无障碍 / SEO）</label>
            <textarea id="me-alt" maxlength="255" placeholder="简短描述图片内容，供搜索引擎和屏幕阅读器使用">${escapeHtml(m.alt_text || '')}</textarea>
          </div>
          <div class="media-edit-panel__row">
            <label>访问路径（只读）</label>
            <input class="mono" type="text" value="${escapeHtml(m.url)}" readonly onclick="this.select()"/>
          </div>
          <div class="media-edit-panel__row" style="font-size:12px; color:#6b7280;">
            ${m.width && m.height ? `尺寸：${m.width} × ${m.height} px &nbsp;·&nbsp; ` : ''}大小：${(m.size / 1024).toFixed(1)} KB &nbsp;·&nbsp; 上传于 ${formatDate(m.created_at)}
          </div>
        </div>
        <div class="media-edit-panel__footer">
          <button type="button" class="btn btn--ghost btn--sm" data-close>取消</button>
          <button type="button" class="btn btn--primary btn--sm" id="me-save">保存</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector('[data-close]').addEventListener('click', close);
    overlay.querySelector('.media-edit-panel__close').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('#me-save').addEventListener('click', async () => {
      const original = document.getElementById('me-original').value.trim();
      const alt_text = document.getElementById('me-alt').value.trim();
      try {
        await api('/api/media/' + m.id, {
          method: 'PATCH',
          body: JSON.stringify({ original, alt_text }),
        });
        toast('已保存', 'success');
        close();
        refresh();
      } catch (err) {
        toast('保存失败：' + err.message, 'error');
      }
    });
  }

  function renderCard(m) {
    const isSeed = m.source === 'seed' || m.readonly;
    const badge = isSeed
      ? '<span style="display:inline-block;background:#eef2ff;color:#4338ca;font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:600;">内置</span>'
      : '<span style="display:inline-block;background:#ecfdf5;color:#047857;font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:600;">上传</span>';
    const actions = isSeed
      ? `<a href="${escapeHtml(m.url)}" target="_blank" class="btn btn--ghost btn--sm" style="flex:1;text-align:center;">打开</a>`
      : `<a href="${escapeHtml(m.url)}" target="_blank" class="btn btn--ghost btn--sm" style="flex:1;text-align:center;">打开</a>
         <button class="btn btn--ghost btn--sm" data-edit="${m.id}">编辑</button>
         <button class="btn btn--ghost btn--sm" data-delete="${m.id}">删除</button>`;
    return `
      <div style="border:1px solid var(--a-line);border-radius:8px;overflow:hidden;">
        ${(m.mime || '').startsWith('image')
          ? `<img src="${escapeHtml(m.url)}" alt="${escapeHtml(m.alt_text || m.original)}" style="width:100%;aspect-ratio:1;object-fit:cover;background:var(--a-surface);" onerror="this.style.opacity=0.2"/>`
          : `<div style="aspect-ratio:1;display:grid;place-items:center;background:var(--a-surface);color:var(--a-mute2);font-size:12px;">${escapeHtml((m.mime || '').split('/').pop().toUpperCase())}</div>`}
        <div style="padding:10px;font-size:11.5px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">${badge}<span style="color:var(--a-mute2);font-size:10.5px;">${(m.size / 1024).toFixed(1)} KB</span></div>
          <div style="font-weight:600;word-break:break-word;">${escapeHtml(m.original || m.filename)}</div>
          ${m.alt_text ? `<div style="color:var(--a-mute2);font-size:11px;margin-top:2px;">${escapeHtml(m.alt_text)}</div>` : ''}
          <div style="color:var(--a-mute2);">${formatDate(m.created_at)}</div>
          <input value="${escapeHtml(m.url)}" readonly onclick="this.select()" class="mono" style="width:100%;margin-top:6px;font-size:11px;padding:5px 6px;border:1px solid var(--a-line);border-radius:4px;"/>
          <div style="display:flex;gap:6px;margin-top:6px;">${actions}</div>
        </div>
      </div>`;
  }

  let allItems = [];

  async function refresh() {
    const { items } = await api('/api/media?limit=500&include_seed=1');
    allItems = items;
    renderList(allItems);
  }

  function renderList(items) {
    const uploads = items.filter((m) => m.source !== 'seed');
    const seeds = items.filter((m) => m.source === 'seed');
    shell.content.innerHTML = `
      <div class="panel">
        <p style="margin:0 0 16px;color:var(--a-mute2);font-size:13px;">支持格式：PNG / JPEG / WebP / SVG / GIF / PDF，单个文件最大 8 MB。上传路径 <code>/uploads/</code>，内置图片路径 <code>/assets/img/seed/</code>。</p>
        <h3 style="margin:0 0 12px;font-size:14px;">我的上传 · ${uploads.length} 个</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px;">
          ${uploads.length ? uploads.map(renderCard).join('') : '<div class="empty" style="grid-column:1/-1;">还没有上传文件。点击右上角「+ 上传文件」开始。</div>'}
        </div>
        ${seeds.length ? `
          <h3 style="margin:0 0 12px;font-size:14px;">内置图库（seed） · ${seeds.length} 张</h3>
          <p style="margin:0 0 12px;color:var(--a-mute2);font-size:12px;">网站内置占位图，可在「页面预览 / 替换图片」中直接选用，不可删除。</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
            ${seeds.map(renderCard).join('')}
          </div>` : ''}
      </div>`;

    document.querySelectorAll('[data-edit]').forEach((b) => {
      const item = allItems.find((m) => String(m.id) === String(b.dataset.edit));
      if (item) b.addEventListener('click', () => openEditModal(item));
    });
    document.querySelectorAll('[data-delete]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('确定删除该文件？删除后无法恢复。')) return;
      try {
        await api('/api/media/' + b.dataset.delete, { method: 'DELETE' });
        toast('已删除', 'success');
        refresh();
      } catch (err) {
        toast('删除失败：' + err.message, 'error');
      }
    }));
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'upload-btn') document.getElementById('upload').click();
  });
  document.getElementById('upload').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/api/media', { method: 'POST', credentials: 'include', body: fd });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'upload_failed');
      toast('已上传：' + json.filename, 'success');
      refresh();
    } catch (err) {
      toast('上传失败：' + err.message, 'error');
    }
    ev.target.value = '';
  });

  refresh();
})();
</script>
</body>
</html>
