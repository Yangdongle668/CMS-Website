<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-meta-title>Article</title>
<meta name="description" data-meta-description content="">
<meta property="og:type" content="article">
<meta property="og:title" data-og-title content="">
<meta property="og:description" data-og-description content="">
<meta property="og:image" data-og-image content="">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" data-canonical href="">
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="application/ld+json" data-jsonld></script>
<style>
  /* Article-template specific layouts */
  .article-toc {
    position: sticky; top: 90px;
    padding: 22px 24px;
    background: #fafafa;
    border-radius: 12px;
    font-size: 13px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
  }
  .article-toc h4 { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #5c5e62; margin-bottom: 12px; }
  .article-toc ul { display: grid; gap: 8px; padding-left: 12px; border-left: 2px solid #e4e4e4; }
  .article-toc a { display: block; color: #3c3e42; padding: 4px 0; line-height: 1.4; }
  .article-toc a:hover, .article-toc a.is-active { color: #f5a623; font-weight: 600; }
  .layout-guide {
    display: grid; grid-template-columns: 240px 1fr; gap: 60px;
    max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 900px) {
    .layout-guide { grid-template-columns: 1fr; gap: 24px; }
    .article-toc { position: static; max-height: none; }
  }
  /* Case study */
  .case-metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;
    margin: 32px 0 40px;
    padding: 28px; background: linear-gradient(135deg, #0f1115 0%, #1d2028 100%);
    border-radius: 16px; color: #f5f5f7;
  }
  .case-metric strong { display: block; font-size: 32px; font-weight: 300; color: #f5a623; line-height: 1; margin-bottom: 8px; letter-spacing: -1px; }
  .case-metric em { font-style: normal; font-size: 12.5px; color: #c7c7cc; letter-spacing: 0.4px; }
  .case-pill {
    display: inline-block; padding: 5px 12px; background: rgba(245,166,35,.15); color: #f5a623;
    border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    margin-right: 8px;
  }
</style>
</head>
<body data-nav="blog">

<div id="header-mount"></div>

<main>
  <section class="page-hero" data-hero style="background-image:url('https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=1920&q=80');">
    <div class="breadcrumbs">
      <a href="/">Home</a><span>/</span><a href="/blog/">Blog</a><span>/</span><span data-art-title-crumb></span>
    </div>
    <h1 data-art-title>Article</h1>
    <p data-art-subtitle></p>
  </section>

  <section class="section section-light">
    <div class="section-inner">
      <div class="article-meta">
        <span data-art-category>Article</span><span class="dot">·</span>
        <span data-art-reading>5 min read</span><span class="dot">·</span>
        <span data-art-date></span>
      </div>

      <div data-art-layout></div>

      <div class="article-nav">
        <a href="/blog/" class="news-link">&larr; All articles</a>
        <a data-pillar-link style="display:none;" class="news-link"></a>
      </div>
    </div>
  </section>

  <section class="section section-grey">
    <div class="section-inner">
      <span class="eyebrow">Continue reading</span>
      <h2>Related articles</h2>
      <div class="news-grid" data-related style="display:grid;"></div>
    </div>
  </section>
</main>

<div id="footer-mount"></div>
<div id="sidemenu-mount"></div>
<script src="/partials.js?v=6"></script>
<script src="/script.js?v=6"></script>
<script>
(async function () {
  const slug = location.pathname.replace(/^\/blog\//, '').replace(/\/$/, '');
  if (!slug) { location.href = '/blog/'; return; }

  let data;
  try { data = await (await fetch('/api/articles/' + encodeURIComponent(slug))).json(); }
  catch (_) { location.href = '/404.html'; return; }
  if (!data || !data.article) { location.href = '/blog/'; return; }
  const a = data.article;
  const escape = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- Meta + OG ----
  const title = (a.meta_title || a.title) + ' | Acme Battery';
  document.title = title;
  document.querySelector('[data-meta-title]').textContent = title;
  const desc = a.meta_description || a.excerpt || '';
  document.querySelector('[data-meta-description]').setAttribute('content', desc);
  document.querySelector('[data-og-title]').setAttribute('content', a.meta_title || a.title);
  document.querySelector('[data-og-description]').setAttribute('content', desc);
  document.querySelector('[data-og-image]').setAttribute('content', a.hero_image || a.cover_url || '');
  document.querySelector('[data-canonical]').setAttribute('href', '/blog/' + a.slug);

  // ---- Hero ----
  const hero = document.querySelector('[data-hero]');
  if (a.hero_image || a.cover_url) {
    hero.style.backgroundImage = `url('${(a.hero_image || a.cover_url).replace(/'/g, "\\'")}')`;
  }
  document.querySelector('[data-art-title-crumb]').textContent = a.title;
  document.querySelector('[data-art-title]').textContent = a.title;
  document.querySelector('[data-art-subtitle]').textContent = a.excerpt || '';

  // ---- Meta line ----
  document.querySelector('[data-art-category]').textContent = a.category_name || a.pillar_short_name || 'Article';
  document.querySelector('[data-art-reading]').textContent = (a.reading_minutes || 5) + ' min read';
  if (a.published_at) {
    document.querySelector('[data-art-date]').textContent = new Date(a.published_at).toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'2-digit' });
  }

  // ---- JSON-LD ----
  const ld = {
    "@context":"https://schema.org",
    "@type":"Article",
    "headline": a.title,
    "description": desc,
    "image": a.hero_image || a.cover_url || '',
    "author": {"@type":"Organization","name": a.author || 'Acme Battery'},
    "publisher":{"@type":"Organization","name":"Acme Battery"},
    "datePublished": a.published_at || a.created_at,
    "dateModified": a.updated_at,
    "mainEntityOfPage": "/blog/" + a.slug,
    "articleSection": a.category_name || ''
  };
  document.querySelector('[data-jsonld]').textContent = JSON.stringify(ld);

  // ---- Render layout per template ----
  const layoutEl = document.querySelector('[data-art-layout]');
  const tpl = a.template || 'standard';
  const content = a.content || '';

  if (tpl === 'guide') {
    // Auto-build a TOC from the H2s in content
    const tmp = document.createElement('div'); tmp.innerHTML = content;
    const h2s = Array.from(tmp.querySelectorAll('h2'));
    h2s.forEach((h, i) => {
      const id = 'sec-' + i + '-' + (h.textContent || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0, 40);
      h.setAttribute('id', id);
    });
    layoutEl.innerHTML = `
      <div class="layout-guide">
        <aside class="article-toc">
          <h4>On this page</h4>
          <ul>${h2s.map((h) => `<li><a href="#${h.id}">${escape(h.textContent)}</a></li>`).join('')}</ul>
        </aside>
        <article class="article-body">${tmp.innerHTML}</article>
      </div>`;
    // ScrollSpy for the TOC
    const links = layoutEl.querySelectorAll('.article-toc a');
    const sections = h2s.map((h) => layoutEl.querySelector('#' + CSS.escape(h.id)));
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const idx = sections.indexOf(e.target);
        links.forEach((l, i) => l.classList.toggle('is-active', i === idx));
      });
    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });
    sections.forEach((s) => s && io.observe(s));
  } else if (tpl === 'case-study') {
    // Render content with metrics callout extracted from the first <ul class="metrics"> if present
    const tmp = document.createElement('div'); tmp.innerHTML = content;
    const firstUl = tmp.querySelector('ul.metrics, ul[data-metrics]');
    let metricsHtml = '';
    if (firstUl) {
      const items = Array.from(firstUl.querySelectorAll('li'));
      metricsHtml = `<div class="case-metrics">${items.map((li) => {
        const t = li.textContent || '';
        const parts = t.split(' — ');
        return `<div class="case-metric"><strong>${escape(parts[0] || t)}</strong><em>${escape(parts.slice(1).join(' — '))}</em></div>`;
      }).join('')}</div>`;
      firstUl.remove();
    }
    layoutEl.innerHTML = `
      <div style="max-width:880px; margin:0 auto;">
        <span class="case-pill">Case Study</span>
        ${metricsHtml}
        <article class="article-body">${tmp.innerHTML}</article>
      </div>`;
  } else {
    // Standard
    layoutEl.innerHTML = `<article class="article-body">${content}</article>`;
  }

  // ---- Pillar back-link ----
  if (a.pillar_slug) {
    const link = document.querySelector('[data-pillar-link]');
    link.style.display = '';
    link.textContent = '→ ' + (a.pillar_name || 'Visit pillar page');
    link.setAttribute('href', '/products/' + a.pillar_slug);
  }

  // ---- Related ----
  const relGrid = document.querySelector('[data-related]');
  if (data.related && data.related.length) {
    relGrid.innerHTML = data.related.map((r) => {
      const d = r.published_at ? new Date(r.published_at).toLocaleDateString('en-GB', { year:'numeric', month:'short', day:'2-digit' }) : '';
      return `<article class="news-card">
        <div class="news-date">${escape(r.category_name || 'Article')} · ${r.reading_minutes || 5} min${d ? ' · ' + d : ''}</div>
        <h3>${escape(r.title)}</h3>
        <p>${escape((r.excerpt || '').slice(0, 130))}</p>
        <a href="/blog/${escape(r.slug)}" class="news-link">Read more &rarr;</a>
      </article>`;
    }).join('');
  } else {
    relGrid.parentElement.parentElement.style.display = 'none';
  }
})();
</script>
</body>
</html>
