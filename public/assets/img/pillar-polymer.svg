<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Polymer lithium battery cell">
  <defs>
    <linearGradient id="lpcell" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b3a82"/>
    </linearGradient>
    <linearGradient id="lpedge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Polymer pouch cell, isometric-ish -->
  <g transform="translate(400 270)">
    <!-- Tabs -->
    <rect x="-40" y="-200" width="32" height="36" fill="#94a3b8"/>
    <rect x="8"   y="-200" width="32" height="36" fill="#94a3b8"/>
    <!-- Body -->
    <rect x="-260" y="-170" width="520" height="280" rx="14" fill="url(#lpedge)" stroke="#0f172a" stroke-width="2"/>
    <rect x="-244" y="-156" width="488" height="252" rx="8" fill="url(#lpcell)"/>
    <!-- Subtle layered pattern -->
    <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <line x1="-240" y1="-110" x2="240" y2="-110"/>
      <line x1="-240" y1="-60"  x2="240" y2="-60"/>
      <line x1="-240" y1="-10"  x2="240" y2="-10"/>
      <line x1="-240" y1="40"   x2="240" y2="40"/>
      <line x1="-240" y1="80"   x2="240" y2="80"/>
    </g>
    <!-- Brand stripe -->
    <rect x="-200" y="-30" width="400" height="60" rx="2" fill="rgba(255,255,255,0.06)"/>
    <text x="0" y="6" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="rgba(255,255,255,0.45)">LI-PO 3.7V</text>
  </g>
  <!-- Annotation lines -->
  <g stroke="#94a3b8" stroke-width="1" fill="none" opacity=".75">
    <line x1="140" y1="80" x2="80" y2="40"/>
    <line x1="660" y1="80" x2="720" y2="40"/>
  </g>
  <text x="60" y="32" font-family="Inter,Arial,sans-serif" font-size="12" fill="#475569" letter-spacing="1.5">0.4 mm thick</text>
  <text x="700" y="32" font-family="Inter,Arial,sans-serif" font-size="12" fill="#475569" letter-spacing="1.5">≥ 500 cycles</text>
</svg>
