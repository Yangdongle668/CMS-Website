<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Cylindrical lithium battery cells">
  <defs>
    <linearGradient id="cylBody" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.4" stop-color="#475569"/>
      <stop offset="0.55" stop-color="#cbd5e1"/>
      <stop offset="0.7" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cylCap" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cylWrap" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b3a82"/>
      <stop offset="0.5" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0b3a82"/>
    </linearGradient>
  </defs>
  <!-- 18650 in the middle, smaller side cells -->
  <!-- Left small (14500) -->
  <g transform="translate(180 250)">
    <ellipse cx="0" cy="-90" rx="40" ry="10" fill="url(#cylCap)"/>
    <rect x="-40" y="-90" width="80" height="180" fill="url(#cylWrap)" stroke="rgba(0,0,0,0.3)"/>
    <rect x="-40" y="-90" width="80" height="22" fill="rgba(0,0,0,0.18)"/>
    <ellipse cx="0" cy="90" rx="40" ry="10" fill="rgba(0,0,0,0.45)"/>
    <text x="0" y="125" text-anchor="middle" font-family="Inter" font-size="11" letter-spacing="3" fill="#94a3b8">14500</text>
  </g>
  <!-- 18650 -->
  <g transform="translate(400 240)">
    <ellipse cx="0" cy="-130" rx="58" ry="14" fill="url(#cylCap)"/>
    <rect x="-58" y="-130" width="116" height="240" fill="url(#cylWrap)" stroke="rgba(0,0,0,0.3)"/>
    <rect x="-58" y="-130" width="116" height="28" fill="rgba(0,0,0,0.2)"/>
    <ellipse cx="0" cy="110" rx="58" ry="14" fill="rgba(0,0,0,0.45)"/>
    <text x="0" y="-150" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" letter-spacing="3" fill="#fff" opacity=".85">18650</text>
    <!-- Centred IR-stripe text -->
    <text x="0" y="0" text-anchor="middle" font-family="Inter" font-size="11" letter-spacing="2" fill="rgba(255,255,255,0.6)">3.6V · 3500mAh</text>
  </g>
  <!-- Right large (21700) -->
  <g transform="translate(640 230)">
    <ellipse cx="0" cy="-150" rx="64" ry="15" fill="url(#cylCap)"/>
    <rect x="-64" y="-150" width="128" height="270" fill="url(#cylWrap)" stroke="rgba(0,0,0,0.3)"/>
    <rect x="-64" y="-150" width="128" height="30" fill="rgba(0,0,0,0.2)"/>
    <ellipse cx="0" cy="120" rx="64" ry="15" fill="rgba(0,0,0,0.45)"/>
    <text x="0" y="155" text-anchor="middle" font-family="Inter" font-size="11" letter-spacing="3" fill="#94a3b8">21700</text>
  </g>
</svg>
