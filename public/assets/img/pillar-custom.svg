<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Custom-shaped lithium polymer cells">
  <defs>
    <linearGradient id="csgrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Round / discoid -->
  <g transform="translate(160 250)">
    <circle r="100" fill="url(#csgrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <circle r="62" fill="rgba(255,255,255,0.06)"/>
    <circle r="14" fill="rgba(255,255,255,0.6)"/>
    <text x="0" y="140" text-anchor="middle" font-family="Inter" font-size="11" letter-spacing="3" fill="rgba(255,255,255,0.5)">DISCOID</text>
  </g>
  <!-- Curved -->
  <g transform="translate(420 250)">
    <path d="M -110 -70 Q 0 -110 110 -70 L 110 70 Q 0 110 -110 70 Z"
          fill="url(#csgrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <path d="M -90 -55 Q 0 -90 90 -55" stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none"/>
    <path d="M -90 55 Q 0 90 90 55" stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none"/>
    <text x="0" y="145" text-anchor="middle" font-family="Inter" font-size="11" letter-spacing="3" fill="rgba(255,255,255,0.5)">CURVED</text>
  </g>
  <!-- Stepped -->
  <g transform="translate(660 250)">
    <path d="M -90 -80 L 40 -80 L 40 -40 L 90 -40 L 90 40 L 40 40 L 40 80 L -90 80 Z"
          fill="url(#csgrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <text x="0" y="140" text-anchor="middle" font-family="Inter" font-size="11" letter-spacing="3" fill="rgba(255,255,255,0.5)">STEPPED</text>
  </g>
</svg>
