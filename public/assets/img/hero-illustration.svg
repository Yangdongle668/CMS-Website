<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Battery cell schematic">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b3a82"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="360" fill="url(#grid)"/>
  <!-- Cylindrical cell -->
  <g transform="translate(70 90)">
    <rect x="0" y="20" width="160" height="120" rx="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="160" y="60" width="14" height="40" rx="3" fill="#0f172a"/>
    <rect x="14" y="36" width="132" height="16" rx="3" fill="url(#g1)"/>
    <text x="80" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">21700 INR</text>
    <text x="80" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#475569">5000 mAh · 3.6 V</text>
  </g>
  <!-- Pouch / polymer cell -->
  <g transform="translate(260 70)">
    <rect x="0" y="0" width="160" height="100" rx="6" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="100" rx="6" fill="url(#g1)" opacity=".06"/>
    <rect x="60" y="-12" width="18" height="14" fill="#94a3b8"/>
    <rect x="84" y="-12" width="18" height="14" fill="#94a3b8"/>
    <text x="80" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Polymer Li-Po</text>
    <text x="80" y="73" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#475569">Custom geometry</text>
  </g>
  <!-- Round cell -->
  <g transform="translate(290 200)">
    <circle cx="50" cy="50" r="48" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="50" cy="50" r="34" fill="url(#g1)" opacity=".12"/>
    <circle cx="50" cy="50" r="6" fill="#0f172a"/>
    <text x="50" y="115" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#475569">Discoid Li-Po</text>
  </g>
  <!-- Decorative bolts -->
  <g stroke="#0b3a82" stroke-width="2" fill="none">
    <path d="M120 200 L160 240 L130 250" />
    <path d="M170 240 L200 270" />
  </g>
</svg>
