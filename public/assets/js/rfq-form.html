<!-- Reusable RFQ form snippet. Embed via <iframe> or copy-paste. -->
<form data-rfq-form class="form-grid">
  <div class="form-row">
    <div class="form-field">
      <label>Full Name<span class="req">*</span></label>
      <input name="full_name" type="text" required maxlength="120" />
    </div>
    <div class="form-field">
      <label>Company<span class="req">*</span></label>
      <input name="company" type="text" required maxlength="120" />
    </div>
  </div>
  <div class="form-row">
    <div class="form-field">
      <label>Work Email<span class="req">*</span></label>
      <input name="email" type="email" required maxlength="190" />
    </div>
    <div class="form-field">
      <label>Phone (with country code)</label>
      <input name="phone" type="tel" maxlength="40" />
    </div>
  </div>
  <div class="form-row">
    <div class="form-field">
      <label>Country / Region<span class="req">*</span></label>
      <input name="country" type="text" required maxlength="60" />
    </div>
    <div class="form-field">
      <label>Product Category<span class="req">*</span></label>
      <select name="product_categories" required>
        <option value="">Select…</option>
        <option value="polymer-lithium-battery">Polymer Lithium Battery</option>
        <option value="custom-shaped-polymer-lithium-battery">Custom-Shaped Li-Po</option>
        <option value="cylindrical-steel-shell-lithium-battery">Cylindrical Li-Ion</option>
        <option value="custom-pack">Custom Battery Pack</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-field">
      <label>Capacity / Voltage Need</label>
      <input name="capacity_need" type="text" maxlength="120" placeholder="e.g. 1200 mAh @ 3.7 V" />
    </div>
    <div class="form-field">
      <label>Annual Volume</label>
      <select name="annual_volume">
        <option value="">Select…</option>
        <option>Under 1,000</option>
        <option>1,000 - 10,000</option>
        <option>10,000 - 100,000</option>
        <option>100,000+</option>
      </select>
    </div>
  </div>
  <div class="form-field">
    <label>Application / Use Case</label>
    <input name="application" type="text" maxlength="190" placeholder="e.g. medical wearable, IoT tracker, drone" />
  </div>
  <div class="form-field">
    <label>Project Details<span class="req">*</span></label>
    <textarea name="message" required minlength="10" maxlength="3000" placeholder="Describe your specs, timeline, certifications required, etc."></textarea>
  </div>
  <!-- Honeypot -->
  <div class="form-honeypot" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"/></label></div>

  <div data-turnstile></div>

  <label class="form-consent">
    <input type="checkbox" name="consent_given" required />
    <span>I have read and agree to the <a href="/privacy" target="_blank">Privacy Policy</a>. I consent to my personal data being processed for the purpose of responding to my inquiry. I understand I can withdraw consent at any time via the <a href="/gdpr" target="_blank">GDPR request page</a>.</span>
  </label>

  <button type="submit" class="btn btn--primary btn--lg" data-label="Submit Inquiry">Submit Inquiry</button>
  <div class="form-status" data-status></div>
</form>
