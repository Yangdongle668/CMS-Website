# =============================================================
# Battery CMS - One-shot Docker stack
#
#   docker compose up -d            (start in background)
#   docker compose logs -f app      (follow app logs)
#   docker compose down             (stop, keep data)
#   docker compose down -v          (stop + wipe DB volume)
#
# All env vars have sensible defaults so the stack works out of the box.
# Override by editing the matching keys in .env (same file used by Node).
# =============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: battery-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-battery_cms}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-battery_cms}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: battery-cms-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: battery-cms:latest
    container_name: battery-cms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Set PUBLIC_URL=https://yourdomain.com in .env — leave blank to
      # auto-detect from admin Settings → SEO → public_url or request host.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SITE_NAME: ${SITE_NAME:-Zufek}
      # Only set FORCE_HTTPS=true when serving via a real TLS terminator.
      FORCE_HTTPS: ${FORCE_HTTPS:-false}

      # Database (talk to the db service over the compose network)
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-battery_cms}

      # Auth.
      #
      # JWT_SECRET / COOKIE_SECRET are intentionally left empty by default.
      # The app generates a random key on first boot and persists it to the
      # cms-data volume, so the stack still starts with no .env file while
      # no two deployments share a signing key. Set them here (via .env) to
      # pin your own values. A previously shipped placeholder is rejected.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      # Also empty by default: with no seeded admin, the first POST to
      # /api/auth/login creates the admin account from the credentials you
      # submit (server/routes/auth.js). That is safer than shipping a
      # password this repository publishes.
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}

      # SMTP — leave blank for dev (mails will be logged to stdout)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      INQUIRY_RECIPIENTS: ${INQUIRY_RECIPIENTS:-}
      AUTO_REPLY_ENABLED: ${AUTO_REPLY_ENABLED:-true}

      # Cloudflare Turnstile — placeholders bypass verification in non-production
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-0x000000000000000000}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-0x000000000000000000}

      # GDPR
      GDPR_RETENTION_DAYS: ${GDPR_RETENTION_DAYS:-365}
      GDPR_SOFT_DELETE_DAYS: ${GDPR_SOFT_DELETE_DAYS:-30}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-1.0}

      # Emergency store — inquiries are written here as NDJSON if the
      # DB is unreachable, then replayed at boot. Lives on a named
      # volume so it survives container restarts.
      EMERGENCY_DIR: /app/data

      # Outbox worker tuning (sensible defaults; uncomment to tweak)
      # OUTBOX_POLL_MS: 5000
      # OUTBOX_BATCH: 5
      # OUTBOX_DISABLED: false
      # HEALTH_ALERTS_DISABLED: false

      # Cache layer. Comment out REDIS_URL to fall back to in-memory
      # (works fine for single-node deployments, ~90% hit rate).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # CACHE_DISABLED: false
      # CACHE_TTL_PILLAR: 300
      # CACHE_TTL_ARTICLE: 300
      # CACHE_TTL_PRODUCT: 300
    ports:
      - "${APP_PORT:-3000}:3000"
      - "80:80"    # ACME HTTP-01 challenges + HTTP→HTTPS redirect
      - "443:443"  # HTTPS (started automatically once a cert is provisioned)
    volumes:
      - uploads:/app/uploads
      - cms-data:/app/data
      - certs:/app/certs
      # Bind-mount the whole shipped-image directory, not just seed/.
      #
      # Two reasons. Host-downloaded seed images from `npm run images:localize`
      # need to be visible without rebuilding the image — that was the original
      # reason, and it only needed seed/. The second is that responsive variants
      # are gitignored build output that is now generated on demand (the button
      # in /admin/media.html, or `npm run images:optimize`) rather than during
      # the Docker build. Anything written inside a container layer is discarded
      # by the next rebuild, so with seed/ alone an operator's backfill of
      # logo.png would silently evaporate on the next `./update.sh` and the site
      # would quietly go back to serving the 1 MB original.
      - ./public/assets/img:/app/public/assets/img
    # Use `node` to probe since the bookworm-slim base image lacks
    # wget/curl. The probe hits /healthz which never touches PG, so it
    # stays reliable even when the database is briefly down.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:3000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  uploads:
  cms-data:
  certs:
